; Raised so admins can upload larger course PDFs through the cycle
; materials folder — the shared-hosting default (2M/8M) is far too low.
; Picked up by PHP-FPM a few minutes after deploy (user_ini.cache_ttl).
upload_max_filesize = 100M
post_max_size = 105M
max_execution_time = 300
memory_limit = 256M
