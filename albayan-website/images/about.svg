    <rect x="205" y="240" width="34" height="60" rx="4"/><rect x="260" y="215" width="34" height="85" rx="4"/>
    <rect x="315" y="190" width="34" height="110" rx="4"/><rect x="370" y="165" width="34" height="135" rx="4"/>
  </g>
  <rect x="425" y="130" width="34" height="170" rx="4" fill="#c9a227"/>
  <polyline points="112,262 167,246 222,230 277,204 332,178 387,152 442,118" fill="none" stroke="#0f3d3e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="442" cy="118" r="7" fill="#0f3d3e" stroke="#fff" stroke-width="3"/>
  <!-- KPI badges -->
  <rect x="50" y="390" width="140" height="70" rx="12" fill="#145a5b"/>
  <text x="120" y="422" text-anchor="middle" font-size="26" font-weight="800" fill="#c9a227">+320%</text>
  <text x="120" y="446" text-anchor="middle" font-size="13" fill="#d7e3e1">Traffic</text>
  <rect x="210" y="390" width="140" height="70" rx="12" fill="#145a5b"/>
  <text x="280" y="422" text-anchor="middle" font-size="26" font-weight="800" fill="#c9a227">#1</text>
  <text x="280" y="446" text-anchor="middle" font-size="13" fill="#d7e3e1">Google Rank</text>
  <rect x="370" y="390" width="140" height="70" rx="12" fill="#145a5b"/>
  <text x="440" y="422" text-anchor="middle" font-size="26" font-weight="800" fill="#c9a227">x4</text>
  <text x="440" y="446" text-anchor="middle" font-size="13" fill="#d7e3e1">Leads</text>
