<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="Arial, sans-serif">
  <rect width="560" height="500" rx="16" fill="#0f3d3e"/>
  <circle cx="470" cy="80" r="120" fill="#c9a227" opacity=".12"/>
  <circle cx="80" cy="440" r="140" fill="#ffffff" opacity=".05"/>
  <!-- dashboard card -->
  <rect x="50" y="60" width="460" height="300" rx="14" fill="#ffffff"/>
  <rect x="50" y="60" width="460" height="46" rx="14" fill="#f1f4f3"/>
  <rect x="50" y="92" width="460" height="14" fill="#f1f4f3"/>
  <circle cx="78" cy="83" r="6" fill="#e05d5d"/><circle cx="98" cy="83" r="6" fill="#e6b84c"/><circle cx="118" cy="83" r="6" fill="#4cbf7a"/>
  <text x="480" y="89" text-anchor="end" font-size="15" font-weight="700" fill="#0f3d3e">Organic Traffic</text>
  <!-- grid -->
  <g stroke="#e8eeec" stroke-width="1">
    <line x1="80" y1="150" x2="480" y2="150"/><line x1="80" y1="200" x2="480" y2="200"/>
    <line x1="80" y1="250" x2="480" y2="250"/><line x1="80" y1="300" x2="480" y2="300"/>
  </g>
  <!-- bars -->
  <g fill="#cfe0dd">
