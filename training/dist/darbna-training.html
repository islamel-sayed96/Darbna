"mind-blowing","ar":"مذهل","example":"My bedroom setup would be mind-blowing.","type":"phrase","id":"en594"},{"en":"lawn","ar":"نجيلة","example":"He worked on the lawn.","type":"phrase","id":"en595"},{"en":"record player","ar":"مشغل أسطوانات","example":"He has a record player.","type":"phrase","id":"en596"},{"en":"dining room","ar":"غرفة طعام","example":"The dining room seats six to eight people.","type":"phrase","id":"en597"}]}]},{"id":"course-1","title":"أسئلة الفصول","heading":"أسئلة وأجوبة للمذاكرة","intro":["الأسئلة تدريب من إجاباتك، وليست قائمة أسئلة الكتاب الأصلية. ملخص الفيديو منفصل في البرزنتيشنز."],"sections":[{"id":"course-1-0","title":"الاعتذار","notes":[],"items":[{"en":"Do you get angry easily?","ar":"هل بتتعصب بسهولة؟","answer":"No, I’m usually calm, and I rarely get angry.","type":"qa","id":"en598"},{"en":"What makes you angry?","ar":"إيه اللي بيعصبك؟","answer":"Sometimes I get upset when I watch Zamalek play or when someone interrupts me while I’m working.","type":"qa","id":"en599"},{"en":"What do you do when you are wrong?","ar":"بتعمل إيه لما تكون غلطان؟","answer":"I calm down and apologize. I also try to make up for it and avoid repeating the mistake.","type":"qa","id":"en600"},{"en":"What did your manager ask you to build?","ar":"مديرك طلب منك تعمل إيه؟","answer":"He asked me to build a CRM system to record sales.","type":"qa","id":"en601"},{"en":"What did you learn from the CRM situation?","ar":"اتعلمت إيه من موقف السيستم؟","answer":"I learned to take more precautions and check that people follow my instructions.","type":"qa","id":"en602"}]},{"id":"course-1-1","title":"المرض","notes":[],"items":[{"en":"When did you last visit a doctor?","ar":"آخر مرة رحت الدكتور إمتى؟","answer":"About two months ago.","type":"qa","id":"en603"},{"en":"What were your symptoms?","ar":"كانت إيه الأعراض؟","answer":"I had a bad ache on the right side of my chest. The pain got worse when I breathed or moved.","type":"qa","id":"en604"},{"en":"What was the diagnosis?","ar":"كان إيه التشخيص؟","answer":"As far as I remember, it was inflammation of the tendons.","type":"qa","id":"en605"},{"en":"Do you have any allergies to medicines?","ar":"عندك حساسية من أدوية؟","answer":"No, I don’t have any allergies to medicines.","type":"qa","id":"en606"},{"en":"How did you recover?","ar":"اتحسنت إزاي؟","answer":"I took medicine and used a patch on my chest. Over time, I started feeling better.","type":"qa","id":"en607"},{"en":"What happens when you catch a cold?","ar":"إيه أعراض البرد عندك؟","answer":"My nose runs nonstop, and I have body aches. I take medicine and rest for a few days.","type":"qa","id":"en608"},{"en":"When do you get headaches?","ar":"إمتى بيجيلك صداع؟","answer":"Sometimes I get headaches when I use my laptop for a long time.","type":"qa","id":"en609"}]},{"id":"course-1-2","title":"الاتجاهات","notes":[],"items":[{"en":"Where do you live?","ar":"ساكن فين؟","answer":"I live in Ajman, in the UAE.","type":"qa","id":"en610"},{"en":"How do you get to work?","ar":"بتروح الشغل إزاي؟","answer":"I drive to work. Sometimes I go to Dubai, Sharjah, or Abu Dhabi.","type":"qa","id":"en611"},{"en":"Is there a shortcut to work?","ar":"في طريق مختصر للشغل؟","answer":"There is no shortcut because all the roads are busy.","type":"qa","id":"en612"},{"en":"What will I see on my right?","ar":"هشوف إيه على يميني؟","answer":"You’ll see Ajman Court on your right.","type":"qa","id":"en613"},{"en":"What should I do at the traffic lights?","ar":"أعمل إيه عند الإشارة؟","answer":"Keep going straight past the traffic lights.","type":"qa","id":"en614"},{"en":"Where is your apartment?","ar":"شقتك فين؟","answer":"It’s in the same building as Madina Supermarket, on the first floor.","type":"qa","id":"en615"}]},{"id":"course-1-3","title":"السوشيال ميديا","notes":[],"items":[{"en":"How do you use social media?","ar":"بتستخدم السوشيال ميديا إزاي؟","answer":"I use it to relax, find information, and connect with family and friends. I also use it for work.","type":"qa","id":"en616"},{"en":"How do you use social media for work?","ar":"بتستخدمها إزاي في الشغل؟","answer":"I use it for media buying and running paid advertising campaigns.","type":"qa","id":"en617"},{"en":"Have you ever bought something because of social media?","ar":"اشتريت حاجة بسبب السوشيال ميديا؟","answer":"Yes! When something is trending or has good reviews, I want to try it, but only if it’s useful to me, like a course.","type":"qa","id":"en618"},{"en":"How did you find this course?","ar":"عرفت الكورس ده إزاي؟","answer":"I found this course on TikTok.","type":"qa","id":"en619"},{"en":"What is the video about?","ar":"الفيديو عن إيه؟","answer":"The video is about how social media influencers affect people’s shopping habits. Some people buy products because influencers recommend them. Others only trust influencers they know.","type":"qa","id":"en620"}]},{"id":"course-1-4","title":"الروتين اليومي","notes":[],"items":[{"en":"What time do you wake up?","ar":"بتصحى الساعة كام؟","answer":"I usually wake up between 8 and 9 a.m.","type":"qa","id":"en621"},{"en":"What is the first thing you do?","ar":"أول حاجة بتعملها؟","answer":"The first thing I do is make my bed.","type":"qa","id":"en622"},{"en":"What do you do before leaving home?","ar":"بتعمل إيه قبل ما تخرج؟","answer":"I take a shower, pray, prepare my meals, get dressed, and pack my bag.","type":"qa","id":"en623"},{"en":"What do you do during your commute?","ar":"بتعمل إيه في الطريق؟","answer":"I usually drink iced coffee and listen to music.","type":"qa","id":"en624"},{"en":"What time do you arrive at work?","ar":"بتوصل الشغل إمتى؟","answer":"I arrive at work at 11 a.m.","type":"qa","id":"en625"},{"en":"What do you do during your breaks?","ar":"بتعمل إيه في البريك؟","answer":"I eat something, prepare my lessons, and finish some tasks.","type":"qa","id":"en626"},{"en":"What time do you get off work?","ar":"بتخلص شغل إمتى؟","answer":"Usually at 8 p.m., but sometimes I work until 10 p.m.","type":"qa","id":"en627"},{"en":"How long does the commute home take?","ar":"طريق الرجوع بياخد قد إيه؟","answer":"It takes about an hour.","type":"qa","id":"en628"},{"en":"What do you do after work?","ar":"بتعمل إيه بعد الشغل؟","answer":"I go home, change my clothes, and go to the gym. After that, I take a shower, have dinner, and go to bed.","type":"qa","id":"en629"},{"en":"Do you have trouble sleeping?","ar":"عندك صعوبة في النوم؟","answer":"Yes. Sometimes I can’t fall asleep until just before dawn or even later.","type":"qa","id":"en630"}]},{"id":"course-1-5","title":"بيت الأحلام","notes":[],"items":[{"en":"What is your dream home like?","ar":"بيت أحلامك شكله إيه؟","answer":"A simple apartment overlooking a lake in Dubai, with one or two bedrooms.","type":"qa","id":"en631"},{"en":"Where would you like your coffee corner?","ar":"تحب الكوفي كورنر فين؟","answer":"I’d like it in the kitchen.","type":"qa","id":"en632"},{"en":"What kind of decor do you prefer?","ar":"بتحب أي ديكور؟","answer":"I prefer simple decor because I don’t like clutter.","type":"qa","id":"en633"},{"en":"What would you like in your bedroom?","ar":"عايز إيه في أوضة النوم؟","answer":"I want it to feel like a hotel room, with fluffy pillows and blackout curtains.","type":"qa","id":"en634"},{"en":"Do you do the housework yourself?","ar":"بتعمل شغل البيت بنفسك؟","answer":"Yes, I like doing it myself, including the laundry.","type":"qa","id":"en635"},{"en":"Do you want a separate laundry room?","ar":"عايز أوضة غسيل منفصلة؟","answer":"No, I don’t need a separate laundry room.","type":"qa","id":"en636"}]}]},{"id":"course-2","title":"البرزنتيشنز","heading":"البرزنتيشنز والحلول","intro":[],"sections":[{"id":"course-2-0","title":"الاعتذار","notes":[],"items":[{"part":"المطلوب","en":"Explain the steps of apologizing. Talk about a specific situation where you went too far and how you handled it. Use at least seven phrases.","ar":"شرح خطوات الاعتذار، ثم موقف محدد تجاوزت فيه الحدود وكيف تصرفت، مع ٧ تعبيرات على الأقل.","type":"task","id":"en637"},{"part":"ملخص الفيديو","en":"The video explains why apologizing is important. Saying sorry can be difficult because we may feel embarrassed or afraid of being blamed. But a good apology helps repair relationships and rebuild trust.","ar":"الفيديو بيشرح أهمية الاعتذار. ممكن نحس بإحراج أو نخاف من اللوم، لكن الاعتذار بيساعد يصلح العلاقات ويرجع الثقة.","type":"passage","id":"en638"},{"part":"الخطوات الأربع","en":"First, express remorse: say you’re sorry and mean it. Second, admit responsibility: accept your mistake and understand the other person’s feelings. Third, make amends: do something to make things right. Finally, promise that it won’t happen again and keep your promise.","ar":"أولًا عبّر عن الندم بصدق. ثانيًا تحمّل المسؤولية وافهم مشاعر الشخص. ثالثًا حاول تصلح الضرر. أخيرًا اوعد بعدم تكرار الغلط والتزم بوعدك.","type":"passage","id":"en639"},{"part":"عن نفسي","en":"I’m usually calm, and I rarely get angry. But sometimes I get upset when I watch Zamalek play or when someone interrupts me while I’m working.","ar":"أنا عادة هادي ونادرًا بتعصب، لكن ممكن أتعصب وأنا بتفرج على الزمالك أو لو حد قاطعني وأنا شغال.","note":"وصف عام؛ لسه محتاجين موقف محدد للتاسك.","type":"passage","id":"en640"},{"part":"تعبيرات أستخدمها","en":"If I’m wrong, I calm down and apologize. I might say: “I regret snapping at you. I said things I wish I could take back. I was stressed, but that’s no excuse. I don’t want to make a lame excuse. I know I messed up, and I apologize for that. I shouldn’t have taken it out on you. I want to smooth things over.”","ar":"لو غلطان بهدى وبعتذر: ندمان إني اتعصبت عليك. قلت كلام نفسي أرجع فيه. كنت مضغوط لكن ده مش عذر. مش عايز أقول عذر ضعيف. أنا غلطت وبعتذر. مكنش ينفع أطلع ضيقي عليك وعايز أصفي الأمور.","type":"passage","id":"en641"},{"part":"الخاتمة","en":"I would also try to make up for it and avoid repeating the same mistake.","ar":"هحاول أعوضه وأتجنب تكرار نفس الغلط.","type":"passage","id":"en642"}]},{"id":"course-2-1","title":"المرض","notes":[],"items":[{"part":"المطلوب","en":"Talk about any three infections from the video. Describe two illnesses you have had, their symptoms, and how you recovered. Use at least six phrases.","ar":"٣ عدوى من الفيديو، وحالتين مرضيتين مريت بيهم مع الأعراض والعلاج أو التعافي، واستخدام ٦ تعبيرات.","type":"task","id":"en643"},{"part":"وجع الصدر: البداية","en":"The last time I visited a doctor was about two months ago because I had a bad ache on the right side of my chest. The area felt sore, and the pain got worse when I breathed or moved. It affected everything I did.","ar":"آخر زيارة كانت من حوالي شهرين بسبب وجع شديد في يمين الصدر. الوجع كان بيزيد مع التنفس والحركة ومأثر على كل حاجة.","type":"passage","id":"en644"},{"part":"التشخيص والعلاج","en":"I explained my symptoms to the doctor. As far as I remember, the diagnosis was inflammation of the tendons. I didn’t have any allergies to medicines. I took medicine and used a patch on the right side of my chest. Over time, I started feeling better. Now I feel much better, alhamdulillah.","ar":"شرحت الأعراض. على ما أفتكر التشخيص كان التهاب أوتار. معنديش حساسية من الأدوية. أخدت علاج واستخدمت لاصق على صدري وتحسنت مع الوقت.","note":"التشخيص حسب تذكرك؛ مش تشخيص مؤكد. التهاب الأوتار ليس مثالًا لعدوى الفيديو.","type":"passage","id":"en645"},{"part":"البرد والصداع","en":"I also sometimes catch a cold when the weather changes. My nose runs nonstop, and I have body aches. I take medicine and rest for a few days until I feel better. Sometimes I also get headaches when I use my laptop for a long time.","ar":"أحيانًا بيجيلي برد مع تغير الجو، ورشح وتكسير جسم. باخد علاج وبرتاح كام يوم. وكمان بيجيلي صداع مع استخدام اللابتوب لفترة طويلة.","note":"استخدمنا body aches حسب وصفك السابق؛ ذكرت أيضًا I feel cold في آخر تدريب.","type":"passage","id":"en646"},{"part":"ملخص عام متاح","en":"The video is about infectious diseases. These diseases are caused by germs, such as bacteria, viruses, fungi, and parasites. They can spread in different ways. Washing our hands and getting vaccinated can help protect us. Treatment depends on the type of infection.","ar":"ملخص عام: الأمراض المعدية بتسببها ميكروبات مختلفة، وطرق الانتقال متنوعة. النظافة والتطعيمات تساعد في الوقاية والعلاج يعتمد على نوع العدوى.","note":"مبني على ملخص منشور، وليس نص الفيديو الكامل. لا يحدد ٣ عدوى مؤكدة من الفيديو.","type":"passage","id":"en647"}]},{"id":"course-2-2","title":"الاتجاهات","notes":[],"items":[{"part":"المطلوب","en":"Describe the route in the video. Then give a lost delivery driver detailed directions from the hospital to your home.","ar":"وصف الطريق في الفيديو، ثم إرشاد مندوب توصيل ضايع عند المستشفى لبيتك.","type":"task","id":"en648"},{"part":"بداية المكالمة","en":"Hello! Where are you now? Are you at the hospital? Okay, here’s how to get to my place. Start at the Ajman University bus stop. It’s near the hospital.","ar":"أهلًا، أنت فين دلوقتي؟ عند المستشفى؟ هقولك توصل بيتي إزاي. ابدأ من محطة جامعة عجمان، هي قريبة من المستشفى.","note":"ناقص تفاصيل الانتقال من المستشفى للمحطة واسم المستشفى.","type":"passage","id":"en649"},{"part":"المحكمة والتقاطع","en":"Go straight down the street. You’ll see Ajman Court on your right. A little further ahead, you’ll reach an intersection with traffic lights. Keep going straight past the traffic lights.","ar":"امشي على طول. محكمة عجمان هتكون على يمينك. بعدها بشوية هتوصل تقاطع فيه إشارة. كمل على طول وعدي الإشارة.","type":"passage","id":"en650"},{"part":"الوصول والخاتمة","en":"After two blocks, you’ll see Madina Supermarket on your right. I live in the same building, on the first floor. Is that clear? Okay, fine. Drive safely, and see you soon!","ar":"بعد اتنين بلوك هتلاقي سوبر ماركت المدينة على يمينك. أنا في نفس العمارة، الدور الأول. واضح؟ سوق بالسلامة وأشوفك قريب.","type":"passage","id":"en651"}]},{"id":"course-2-3","title":"السوشيال ميديا","notes":[],"items":[{"part":"المطلوب","en":"Summarize the video and explain how social media affects people’s lives from your point of view. Use at least eight phrases.","ar":"لخص الفيديو واتكلم عن تأثير السوشيال ميديا على الناس من وجهة نظرك باستخدام ٨ تعبيرات على الأقل.","type":"task","id":"en652"},{"part":"ملخص الفيديو","en":"The video is about how social media influencers affect people’s shopping habits. Some people buy products because influencers recommend them. Others only trust influencers they know.","ar":"الفيديو عن تأثير الإنفلونسرز على عادات الشراء. بعض الناس بتشتري بسبب ترشيحاتهم، وغيرهم بيثق بس في المؤثرين اللي يعرفهم.","note":"ملخص مبني على الصور اللي بعتها، مش مشاهدة كاملة للفيديو.","type":"passage","id":"en653"},{"part":"استخدامي الشخصي والمهني","en":"I use social media to relax and have fun. I also use it for work, especially for media buying and running paid advertising campaigns. Most of the time, I use it to connect with my family and friends. Sometimes, I use it to look for information or read reviews.","ar":"بستخدمها للاستمتاع والاسترخاء، وللميديا باينج والإعلانات الممولة. أغلب الوقت بتواصل مع أهلي وصحابي، وأحيانًا للبحث وقراءة التقييمات.","type":"passage","id":"en654"},{"part":"تأثيرها على قراراتي","en":"When something is trending or has good reviews, I want to try it, but only if it’s useful to me, like a course. Actually, I’m here with you today because I found this course on TikTok!","ar":"لو حاجة تريند أو تقييمها كويس بحب أجربها لو هتفيدني زي الكورسات. أنا هنا معاكم لأني لقيت الكورس على تيك توك!","note":"النص الشخصي الحالي لا يغطي وحده ٨ تعبيرات من القائمة.","type":"passage","id":"en655"}]},{"id":"course-2-4","title":"الروتين اليومي","notes":[],"items":[{"part":"المطلوب","en":"Describe five daily activities from the video. Then describe your own daily routine in detail. Use at least seven phrases.","ar":"٥ عادات من فيديو الشخص، ثم روتينك بالتفصيل مع ٧ تعبيرات من القائمة.","type":"task","id":"en656"},{"part":"الصبح","en":"I usually wake up between 8 and 9 a.m. The first thing I do is make my bed. Then I take a shower, pray, prepare my meals for the whole day, get dressed, and pack my bag.","ar":"بصحى بين ٨ و٩. أول حاجة برتب سريري، وبعدين شاور وصلاة وتحضير أكل اليوم واللبس وتجهيز الشنطة.","note":"في التدريب قلت ٨ صباحًا؛ هنا استخدمنا المدى اللي وصفته في البداية.","type":"passage","id":"en657"},{"part":"الطريق والشغل","en":"After that, I head straight to my car and get ready to drive. I like drinking iced coffee while I’m driving. I usually listen to music to kill the time. I arrive at work at 11 a.m. I go to my office, check my schedule for classes and tasks, and start working.","ar":"بروح للعربية وأستعد للسواقة. بحب آيس كوفي ومزيكا في الطريق. بوصل ١١ وأراجع جدول المحاضرات والتاسكات وأبدأ شغل.","type":"passage","id":"en658"},{"part":"أثناء الشغل","en":"Between classes, I take time to pray. When I have a break, I eat something, prepare my lessons, and finish some tasks. I usually get off work at 8 p.m., but sometimes I work until 10 p.m.","ar":"بين المحاضرات بصلي. في البريك باكل وأحضر الدروس وأخلص تاسكات. بخلص ٨، وأحيانًا بكمل لحد ١٠.","type":"passage","id":"en659"},{"part":"الرجوع والجيم","en":"After that, I head straight to my car and drive home. The commute home takes about an hour. When I get home, I change my clothes, put my things away, and go to the gym.","ar":"برجع بالعربية والطريق حوالي ساعة. بغير هدومي وأرتب حاجتي وأنزل الجيم.","type":"passage","id":"en660"},{"part":"النوم","en":"After the gym, I take a shower, prepare dinner, eat, and go to bed. I usually have trouble sleeping. Sometimes I can’t fall asleep until just before dawn or even later. That’s my daily routine on most days.","ar":"بعد الجيم شاور وعشاء وبروح السرير. عندي صعوبة في النوم وممكن منامش لحد قبل الفجر أو بعده. ده يومي في أغلب الأيام.","note":"لسه نراجع تغطية ٧ تعبيرات بالقائمة؛ وقت الخروج من البيت والفطار مش محددين.","type":"passage","id":"en661"}]},{"id":"course-2-5","title":"بيت الأحلام","notes":[],"items":[{"part":"المطلوب","en":"Describe what you saw in the video. Then describe your dream home in detail. Use at least eight phrases.","ar":"وصف الفيديو ثم بيت أحلامك بالتفصيل باستخدام ٨ تعبيرات على الأقل.","type":"task","id":"en662"},{"part":"ملخص الجزء المتاح","en":"The video shows a man giving an updated tour of his house. He has lived there for about nine months and has been working on the garden and lawn. His favorite room is a small, sunny front room with a sofa, a record player, speakers, plants, and family photos.","ar":"رجل بيعمل جولة جديدة في بيته بعد حوالي ٩ شهور. اشتغل على الجنينة والنجيلة. أوضته المفضلة صغيرة ومشمسة وفيها كنبة ومشغل أسطوانات وسماعات وزرع وصور.","note":"النص المرسل جزئي، مش الفيديو كامل.","type":"passage","id":"en663"},{"part":"باقي الجزء المتاح","en":"The dining room has seats for six to eight people. The downstairs bathroom hasn’t changed. He loves his kitchen because it is big and easy to use. He and his sister are planning to repaint the chairs.","ar":"السفرة تسع ٦ إلى ٨. الحمام تحت زي ما هو. بيحب المطبخ لأنه واسع وسهل الاستخدام، وهيغير لون الكراسي مع أخته.","type":"passage","id":"en664"},{"part":"المكان والديكور","en":"My dream home would be a simple apartment overlooking a lake in Dubai, with one or two bedrooms. I want a big kitchen with a coffee corner inside it. I prefer simple decorations because I don’t like clutter. I want my home to feel spacious.","ar":"شقة بسيطة في دبي مطلة على بحيرة، أوضة أو اتنين، مطبخ واسع وكوفي كورنر فيه. ديكور بسيط عشان مش بحب الزحمة والبيت يبقى واسع.","type":"passage","id":"en665"},{"part":"غرفة النوم والمعيشة","en":"I want my bedroom to feel like a hotel room, with fluffy pillows and blackout curtains. I also want a big couch I can nap on and a large TV. My living room would have recliners, surround sound, and a PlayStation.","ar":"عايز أوضة النوم زي الفندق بمخدات ناعمة وستاير معتمة، وكنبة كبيرة للقيلولة وتلفزيون، وكراسي استرخاء وصوت محيطي وبلايستيشن.","type":"passage","id":"en666"},{"part":"شغل البيت","en":"I don’t need a separate laundry room. I like doing the housework myself, including the laundry.","ar":"مش محتاج أوضة غسيل منفصلة. بحب أعمل شغل البيت بنفسي بما فيه غسل هدومي.","note":"لسه مراجعة شرط ٨ تعبيرات؛ مش هنضيف حديقة أو حمام سباحة عكس رغبتك.","type":"passage","id":"en667"}]}]},{"id":"course-3","title":"فيديو تاسك","heading":"الفيديو تاسك: المطلوب وما جهزناه","intro":[],"sections":[{"id":"course-3-0","title":"الاتجاهات","notes":[],"items":[{"task":"فيديو دقيقة عن طريقك للشغل أو المدرسة أو الجامعة.","words":"Mosque; Sidewalk; Across from; Shortcut","en":"I live in Ajman, in the UAE. My route to work changes because I sometimes work in Dubai, Sharjah, or Abu Dhabi. I drive to work, and there is usually a lot of traffic. There is no shortcut because all the roads are busy. On my way, I pass many mosques. On the side streets along my route, there are pedestrian crossings. I stop to let people cross.","type":"passage","id":"en668"}]},{"id":"course-3-1","title":"الاعتذار","notes":[],"items":[{"task":"فيديو دقيقة عن موقف بوظت فيه حاجة واضطريت تعتذر.","words":"Make excuses; Blame; Regret; Take back","en":"One day, my manager asked me to build a CRM system to record sales. The system was still being tested. I told my colleague not to enter real data yet, but he ignored my instructions and caused a problem. He complained to my manager about me. My manager blamed me. I didn’t make excuses or argue. My priority was to solve the problem first. Later, I showed my manager the system history to explain what happened. I asked him not to punish my colleague. I regret trusting him to follow my instructions without checking. I wish I could take back that decision. I didn’t apologize because I didn’t think it was my fault. But I learned to take more precautions next time.","type":"passage","id":"en669"}]},{"id":"course-3-2","title":"البيت","notes":[],"items":[{"task":"النص الأصلي للصورة غير متاح؛ اللي اشتغلنا عليه وصف بيت تحب تسكنه وشغل البيت.","words":"Cozy spot; Spacious; Home chores; Do laundry","en":"I’d like to move into a one- or two-bedroom apartment overlooking a lake in Dubai. I prefer simple decor so the apartment feels spacious, because I don’t like clutter. I’d also like a coffee corner in the kitchen. It would be a cozy spot to enjoy my coffee and relax. I like doing all the home chores myself. I clean the apartment, keep everything tidy, and do the laundry. For me, the perfect home is a simple, comfortable place where I can relax after a busy day.","type":"passage","id":"en670"}]},{"id":"course-3-3","title":"المرض","notes":[],"items":[{"task":"فيديو دقيقة عن آخر مرة زرت فيها الدكتور.","words":"Ill; Sore; Ache; Allergies; Diagnosis; Symptoms","en":"The last time I visited a doctor was about two months ago. I felt ill because I had a bad ache on the right side of my chest. The area felt sore, and the pain got worse when I breathed or moved. It affected almost everything I did. I explained my symptoms to the doctor. As far as I remember, the diagnosis was inflammation of the tendons. I didn’t have any allergies to medicines. I took some medicine and used a patch on my chest. Over time, I started feeling better. Now I feel much better.","type":"passage","id":"en671"}]}]},{"id":"course-4","title":"حوار وجمل","heading":"حوار الدكتور وجمل المحاضرة","intro":["حوار الدكتور مثال تمثيلي للتدريب. جمل الغياب والاستئذان جهزناها في المحادثة."],"sections":[{"id":"course-4-0","title":"كورس - حوار وجمل","notes":[],"items":[{"role":"Doctor","en":"Hello. What seems to be the problem?","ar":"أهلًا، إيه المشكلة؟","type":"dialogue","id":"en672"},{"role":"Son","en":"My mother isn’t feeling well, and I’m worried about her.","ar":"والدتي تعبانة وأنا قلقان عليها.","type":"dialogue","id":"en673"},{"role":"Doctor","en":"What symptoms does she have?","ar":"عندها إيه من أعراض؟","type":"dialogue","id":"en674"},{"role":"Son","en":"She has a bad stomachache and has been throwing up.","ar":"عندها وجع شديد في المعدة وبترجّع.","type":"dialogue","id":"en675"},{"role":"Doctor","en":"When did it start?","ar":"بدأ إمتى؟","type":"dialogue","id":"en676"},{"role":"Son","en":"It started yesterday.","ar":"بدأ امبارح.","type":"dialogue","id":"en677"},{"role":"Doctor","en":"Is she taking any medication?","ar":"بتاخد أي أدوية؟","type":"dialogue","id":"en678"},{"role":"Son","en":"I’ll check with her. What should we do next, doctor?","ar":"هتأكد منها. إيه الخطوة الجاية يا دكتور؟","type":"dialogue","id":"en679"},{"role":"Doctor","en":"I’d like to examine her first.","ar":"أحب أفحصها الأول.","type":"dialogue","id":"en680"},{"role":"اعتذار عن الغياب","en":"I’m sorry I missed the last class. Thursdays are usually busy for me because it’s the last day of my workweek. I had a lot of work and finished late.","ar":"آسف على غيابي. الخميس زحمة لأنه آخر يوم في أسبوع شغلي، وخلصت متأخر.","type":"dialogue","id":"en681"},{"role":"استئذان من الميتينج","en":"I’m done. Is there anything else we need to cover, or can I leave the meeting?","ar":"أنا خلصت. في حاجة تانية هناخدها ولا ممكن أستأذن؟","type":"dialogue","id":"en682"},{"role":"توديع الزملاء","en":"It was a pleasure being here with you all. Hopefully, we’ll meet again soon. I have to go now, so please excuse me. Take care, everyone!","ar":"اتشرفت بوجودي معاكم، وإن شاء الله نتقابل قريب. مضطر أستأذن. خلي بالكم من نفسكم.","type":"dialogue","id":"en683"}]}]}]},{"id":"mistakes","title":"الأخطاء والتصحيحات","desc":"أخطاء شائعة وصيغ أقل أولوية مع البديل الصحيح","lessons":[{"id":"mistakes-0","title":"التصحيحات","heading":"تصحيحات متكررة من تدريبك","intro":[],"sections":[{"id":"mistakes-0-0","title":"كورس - التصحيحات","notes":[],"items":[{"wrong":"I woke up at 8 (روتين)","correct":"I usually wake up at 8.","note":"المضارع البسيط للعادة.","type":"correction","id":"en684"},{"wrong":"The first thing I do, make my bed.","correct":"The first thing I do is make my bed.","note":"لازم is بعد الجملة الافتتاحية.","type":"correction","id":"en685"},{"wrong":"take shower","correct":"take a shower","note":"استخدم a.","type":"correction","id":"en686"},{"wrong":"for all day","correct":"for the whole day","note":"لكامل اليوم.","type":"correction","id":"en687"},{"wrong":"get ready for driving","correct":"get ready to drive","note":"get ready to + فعل.","type":"correction","id":"en688"},{"wrong":"while I driving","correct":"while I’m driving","note":"مضارع مستمر.","type":"correction","id":"en689"},{"wrong":"check to my schedule","correct":"check my schedule","note":"check هنا من غير to.","type":"correction","id":"en690"},{"wrong":"take a time for pray","correct":"take time to pray","note":"time بدون a، وto pray.","type":"correction","id":"en691"},{"wrong":"get off my work","correct":"get off work","note":"تعبير ثابت.","type":"correction","id":"en692"},{"wrong":"work at 10 (لحد ١٠)","correct":"work until 10","note":"until = لحد.","type":"correction","id":"en693"},{"wrong":"When I arrived (روتين)","correct":"When I get home","note":"عادة في المضارع.","type":"correction","id":"en694"},{"wrong":"have a trouble sleeping","correct":"have trouble sleeping","note":"trouble هنا غير معدودة.","type":"correction","id":"en695"},{"wrong":"almost days","correct":"on most days","note":"في أغلب الأيام.","type":"correction","id":"en696"},{"wrong":"he complained me","correct":"he complained to my manager about me","note":"complain to شخص / about موضوع.","type":"correction","id":"en697"},{"wrong":"any argue","correct":"argue","note":"فعل: I didn’t make excuses or argue.","type":"correction","id":"en698"},{"wrong":"my priority is solve","correct":"my priority was to solve","note":"سرد الماضي + to قبل الفعل.","type":"correction","id":"en699"},{"wrong":"told colleague not enter","correct":"told a colleague not to enter","note":"a colleague وnot to + فعل.","type":"correction","id":"en700"},{"wrong":"a bad ash","correct":"a bad ache","note":"ache = وجع؛ راجع التفريغ الصوتي.","type":"correction","id":"en701"},{"wrong":"on right side","correct":"on the right side","note":"استخدم the.","type":"correction","id":"en702"},{"wrong":"allergies of medicine","correct":"allergies to medicines","note":"حرف الجر to.","type":"correction","id":"en703"},{"wrong":"I take medicine (موقف قديم)","correct":"I took medicine","note":"took هو الماضي.","type":"correction","id":"en704"},{"wrong":"My nose running","correct":"My nose is running","note":"ناقص is.","type":"correction","id":"en705"},{"wrong":"in hospital? (المكان)","correct":"Are you at the hospital?","note":"ترتيب السؤال؛ للسؤال عن المكان.","type":"correction","id":"en706"},{"wrong":"start on the bus stop","correct":"start at the bus stop","note":"at للمكان.","type":"correction","id":"en707"},{"wrong":"instructions with traffic lights","correct":"an intersection with traffic lights","note":"intersection = تقاطع، instructions = تعليمات.","type":"correction","id":"en708"},{"wrong":"Most time","correct":"Most of the time","note":"أغلب الوقت.","type":"correction","id":"en709"},{"wrong":"research about any information","correct":"look for information","note":"صياغة أبسط وطبيعية.","type":"correction","id":"en710"},{"wrong":"I see the course on TikTok (قديم)","correct":"I found this course on TikTok.","note":"found للتجربة الماضية.","type":"correction","id":"en711"},{"wrong":"the direction (موضوع الطرق)","correct":"directions","note":"الجمع هو الطبيعي لوصف الطرق.","type":"correction","id":"en712"}],"rules":["للعادات استخدم المضارع البسيط: I usually wake up at 8.","take a shower (بـ a).","get ready to + فعل.","check my schedule من غير to."],"questions":[]}]},{"id":"mistakes-1","title":"جمل أقل أولوية","heading":"جمل أقل أولوية — للرجوع والفهم","intro":[],"sections":[{"id":"mistakes-1-0","title":"الجملة الأصلية والسبب والبديل","notes":["هذه ليست قائمة جمل غير مستخدمة تمامًا. تشمل أخطاء أو أمثالًا طويلة أو ألفاظًا قديمة أو عبارات هجومية.","الأولوية حكم تعليمي للمحادثة اليومية، وليست ترتيبًا مبنيًا على عدد مرات الاستخدام.","البديل صياغة مقترحة لنفس المعنى أو طريقة ألطف للتواصل؛ لا يطابق الإهانة حرفيًا.","مصادر مراجعة الصيغ"],"items":[{"wrong":"I’m at the grocery.","ar":"أنا في البقالة.","note":"التركيبات اللغوية / Part 1: مفهومة في بعض الاستعمالات، لكن grocery store أوضح للمتعلم.","correct":"I’m at the grocery store.","type":"correction","id":"en713"},{"wrong":"I’m in the grocery.","ar":"أنا داخل البقالة.","note":"التركيبات اللغوية / Part 1: grocery store أوضح عند الحديث عن المحل.","correct":"I’m in the grocery store.","type":"correction","id":"en714"},{"wrong":"I’m getting a tooth ache.","ar":"بدأ يجيني وجع أسنان.","note":"التركيبات اللغوية / Part 3: الصيغة قابلة للفهم، لكن البديل أبسط وأكثر طبيعية لوصف بداية الألم. toothache كلمة واحدة.","correct":"My tooth is starting to hurt.","type":"correction","id":"en715"},{"wrong":"Do not add salt to my wounds.","ar":"متزودش وجعي.","note":"مصطلحات / فصل 38: الصورة مفهومة، لكن التعبير الاصطلاحي المعتاد هو rub salt in/into the wound.","correct":"Don’t rub salt in the wound.","type":"correction","id":"en716"},{"wrong":"Well bred.","ar":"حسن التربية / مهذب.","note":"مصطلحات / فصل 38: تعبير قديم ورسمي نسبيًا، وقد يوحي بخلفية اجتماعية. ليس أول اختيار للمحادثة.","correct":"Well-mannered.","type":"correction","id":"en717"},{"wrong":"Howling in the moon.","ar":"المقصود في الصورة: جهد أو كلام دون جدوى.","note":"مصطلحات / فصل 38: الصيغة ليست تعبيرًا اصطلاحيًا صحيحًا بهذا الشكل. حتى howl at the moon لا يطابق المعنى دائمًا.","correct":"You’re wasting your breath.","type":"correction","id":"en718"},{"wrong":"Hold your horse.","ar":"استنى / على مهلك.","note":"مصطلحات / فصل 38: التعبير المعتاد يحتاج الجمع horses.","correct":"Hold your horses!","type":"correction","id":"en719"},{"wrong":"I got you in the jam.","ar":"أنا ورّطتك.","note":"مصطلحات / فصل 38: الصياغة المعتادة: get someone into a jam، دون the.","correct":"I got you into a jam.","type":"correction","id":"en720"},{"wrong":"It deserves me right.","ar":"أنا أستاهل اللي حصل لي.","note":"مصطلحات / فصل 38: خطأ في التعبير؛ الفعل الصحيح serves.","correct":"It serves me right.","type":"correction","id":"en721"},{"wrong":"You still have a leg to stand on.","ar":"عندك حجة أو أساس يدعم موقفك.","note":"مصطلحات / فصل 38: الجملة ممكنة، لكن ترجمة الصورة «لسه ليك عين تتكلم» لا تطابق المعنى. الأشهر هو التعبير المنفي.","correct":"You don’t have a leg to stand on. = ليس لديك حجة تدعم موقفك.","type":"correction","id":"en722"},{"wrong":"Only good people appreciate.","ar":"المقصود: الناس الكويسة بتقدّر المعروف.","note":"مصطلحات / فصل 38: الجملة مبهمة ولا تعادل المثل العربي المكتوب في الصورة. ليست عبارة محفوظة مقترحة.","correct":"Good people appreciate kindness.","type":"correction","id":"en723"},{"wrong":"You can tell a book from its cover.","ar":"المقصود: تحكم من المظهر.","note":"مصطلحات / فصل 38: لا تعادل المثل الشائع؛ احفظ صيغة Don’t judge a book by its cover.","correct":"Don’t judge a book by its cover.","type":"correction","id":"en724"},{"wrong":"Your sins have caught up with you.","ar":"بدأت تواجه عواقب أخطائك أو ذنوبك.","note":"مصطلحات / فصل 38: نبرة لوم ووعظ. لا تعني تحديدًا العبارة الدينية العربية في الصورة.","correct":"You’re facing the consequences of your actions.","type":"correction","id":"en725"},{"wrong":"Worhaholic.","ar":"شخص مدمن شغل.","note":"مصطلحات / فصل 38: خطأ إملائي.","correct":"Workaholic.","type":"correction","id":"en726"},{"wrong":"What must be must be.","ar":"ما لا بد منه سيحدث.","note":"مصطلحات / فصل 38: صيغة مَثَل ثقيلة للمحادثة البسيطة. البديل أوضح.","correct":"Some things are unavoidable.","type":"correction","id":"en727"},{"wrong":"The proof of the pudding is in the eating.","ar":"الحكم الحقيقي يكون من التجربة أو النتيجة.","note":"مصطلحات / فصل 38: مَثَل صحيح، لكن طويل وأقل أولوية من صيغة مباشرة للمحادثة.","correct":"The results will show whether it works.","type":"correction","id":"en728"},{"wrong":"The shoemaker’s wife is ill shod.","ar":"المهني قد يهمل احتياجات أهل بيته في مجال عمله.","note":"مصطلحات / فصل 38: مَثَل قديم وأقل أولوية. ill-shod تعني سيئة الحذاء، وليس مريضة.","correct":"The shoemaker’s children go barefoot.","type":"correction","id":"en729"},{"wrong":"The spirit is willing but the flesh is week.","ar":"الرغبة موجودة لكن القدرة أو الطاقة ضعيفة.","note":"مصطلحات / فصل 38: weak هي الكلمة الصحيحة، وليس week. قول مأثور أقل أولوية من العبارة المباشرة.","correct":"I want to, but I don’t have the energy.","type":"correction","id":"en730"},{"wrong":"The hole calls the thief.","ar":"الفرصة السهلة قد تشجع السرقة.","note":"مصطلحات / فصل 38: قول مأثور غير مألوف للمحادثة البسيطة؛ لا تحفظه كاختيار أساسي.","correct":"Leaving valuables unsecured can invite theft.","type":"correction","id":"en731"},{"wrong":"People who live in glass houses shouldn’t through stones.","ar":"من لديه عيوب لا ينبغي أن ينتقد الآخرين على مثلها.","note":"مصطلحات / فصل 38: خطأ إملائي: throw وليس through. مثل صحيح لكنه طويل؛ افهمه أولًا.","correct":"People who live in glass houses shouldn’t throw stones.","type":"correction","id":"en732"},{"wrong":"Share a Leg.","ar":"المقصود: استعجل.","note":"مصطلحات / فصل 38: خطأ في التعبير؛ الصحيح Shake a leg.","correct":"Shake a leg! / Hurry up!","type":"correction","id":"en733"},{"wrong":"He was dressed to the nines in yesterday’s wedding.","ar":"كان لابس شيك جدًا في فرح امبارح.","note":"مصطلحات / فصل 38: نستخدم at مع حضور حفل الزفاف، وليس in هنا.","correct":"He was dressed to the nines at yesterday’s wedding.","type":"correction","id":"en734"},{"wrong":"When the hell freezes.","ar":"مستحيل / لما المستحيل يحصل.","note":"مصطلحات / فصل 38: الصحيح When hell freezes over. شائعة للفهم لكنها حادة وغير مناسبة لكل موقف.","correct":"That will never happen.","type":"correction","id":"en735"},{"wrong":"This is a hot air.","ar":"ده كلام فارغ / بلا قيمة.","note":"مصطلحات / فصل 38: hot air في هذا المعنى غير معدودة، فلا نستخدم a.","correct":"This is just hot air.","type":"correction","id":"en736"},{"wrong":"Don’t take me for a fool.","ar":"متفتكرنيش عبيط.","note":"مصطلحات / فصل 38: صحيحة لكنها اتهامية ومواجهة.","correct":"Please don’t underestimate me.","type":"correction","id":"en737"},{"wrong":"You’re just a loser, nothing more and nothing less.","ar":"إنت مجرد فاشل، لا أكثر ولا أقل.","note":"مصطلحات / فصل 38: إهانة مباشرة؛ للفهم وليس للحفظ كنموذج للتواصل.","correct":"I’m disappointed with what happened.","type":"correction","id":"en738"},{"wrong":"Who do you think you are? You’re nothing.","ar":"إنت فاكر نفسك مين؟ إنت ولا حاجة.","note":"مصطلحات / فصل 38: إهانة وتحطيم للشخص.","correct":"Please speak to me respectfully.","type":"correction","id":"en739"},{"wrong":"You should know your place.","ar":"لازم تعرف مقامك / مكانك.","note":"مصطلحات / فصل 38: متكبرة ومهينة في هذا السياق.","correct":"Please respect the boundaries.","type":"correction","id":"en740"},{"wrong":"Your mind is in the gutter.","ar":"تفكيرك رايح لمعاني جنسية أو غير لائقة.","note":"مصطلحات / فصل 38: صحيحة لكنها اتهامية؛ ليست ترجمة عامة لأي تفكير سيئ.","correct":"That’s not what I meant.","type":"correction","id":"en741"}]},{"id":"mistakes-1-1","title":"إضافات الملفين الجديدين — للفهم والرجوع","notes":[],"items":[{"wrong":"Man up.","ar":"اتشجّع / استرجل حسب السياق.","note":"Public 1: شائعة لكنها قد تقلل من المشاعر وتربط الشجاعة بالرجولة؛ مش نموذج تشجيع مناسب لكل موقف.","correct":"You can handle this.","correctAr":"إنت تقدر تتعامل مع ده.","type":"correction","id":"en742"},{"wrong":"Has no morals.","ar":"عديم الأخلاق.","note":"Public 1: المصدر جزء جملة يحتاج فاعل: He has no morals. حكم شخصي جارح؛ ركّز على السلوك.","correct":"That behavior is dishonest.","correctAr":"التصرف ده مش أمين.","type":"correction","id":"en743"},{"wrong":"You are a scrounger.","ar":"إنت عالة / بتطلب حاجات من غير مقابل.","note":"Public 1: وصف ازدرائي، مش مجرد «مصلحجي». للفهم؛ البديل يضع حدودًا بدل الإهانة.","correct":"I can’t keep paying for you.","correctAr":"مش هقدر أفضل أدفع لك.","type":"correction","id":"en744"},{"wrong":"It’s your funeral.","ar":"إنت حر، بس هتتحمل العواقب.","note":"Public 1: تحذير حاد أو ساخر من قرار سيئ، مش مجرد «دي مشكلتك».","correct":"It’s your decision, but it could have consequences.","correctAr":"ده قرارك، بس ممكن يكون له عواقب.","type":"correction","id":"en745"},{"wrong":"Isn’t that peachy?","ar":"يا سلام! / مش ده رائع؟","note":"Public 1: غالبًا سخرية حسب النبرة، وأقل أولوية للمحادثة الأساسية؛ مش ممنوعة مع كل غريب.","correct": ectAr":"خلّينا نتفق على طريقة تناسبنا إحنا الاتنين.","type":"correction","id":"en760"},{"wrong":"I said no! I don’t wanna talk about it. You just drop it.","ar":"قلت لأ! مش عايز أتكلم في ده. اقفل الموضوع.","note":"جزء 4: نبرة غضب ومواجهة. wanna غير رسمية؛ الأمر الطبيعي Drop it. البديل يضع حدًا بهدوء.","correct":"I don’t want to discuss this. Please respect that.","correctAr":"مش عايز أناقش الموضوع ده، ياريت تحترم ده.","type":"correction","id":"en761"},{"wrong":"Don’t get me started.","ar":"متفتحش الموضوع ده معايا.","note":"جزء 4: يوحي إن عندك شكوى أو كلام كتير؛ قد يقال بمزاح أو ضيق، مش معناه العام «خلّيني ساكت».","correct":"I have a lot to say about that, but let’s leave it for now.","correctAr":"عندي كلام كتير عن ده، بس خلّينا نسيبه دلوقتي.","type":"correction","id":"en762"},{"wrong":"Out of sight, out of mind.","ar":"البعيد عن العين قد يغيب عن البال.","note":"جزء 4: مثل عن نسيان ما لا نراه؛ مش قاعدة ثابتة عن الحب أو العلاقات. أقل أولوية من عبارة مباشرة.","correct":"We sometimes forget about things we don’t see.","correctAr":"أحيانًا بننسى الحاجات اللي مش بنشوفها.","type":"correction","id":"en763"},{"wrong":"Two haves of the same whole.","ar":"نصفان يكملان كيانًا واحدًا.","note":"جزء 4: تصحيح haves إلى halves؛ وصف ممكن لكنه مش مرادف دقيق لتشابه شخصين. للتشابه احفظ Two peas in a pod.","correct":"They complement each other.","correctAr":"هما بيكمّلوا بعض.","type":"correction","id":"en764"}]},{"id":"mistakes-1-3","title":"مراجعات الملفين الجديدين — للفهم والرجوع","notes":[],"items":[{"wrong":"Wouldn’t it be alright if I took this seat?","ar":"ممكن آخد المقعد ده؟","note":"E - Questions: مفهومة لكن السؤال المنفي طويل وقد يربك الإجابة؛ البديل أبسط لطلب الإذن.","correct":"Would it be all right if I took this seat?","correctAr":"ممكن آخد المقعد ده؟","type":"correction","id":"en765"},{"wrong":"Are you gonna be part of the problem or part of the solution? — I’m gonna be the whole problem.","ar":"هتكون جزءًا من المشكلة ولا الحل؟ — هكون المشكلة كلها.","note":"E - Questions: سؤ ظة بهدوء وخد المفيد بدل رفضها كلها.","correct":"I assess feedback fairly and use it to improve.","correctAr":"بقيّم الملاحظات بعدل وبستخدمها للتحسين.","type":"correction","id":"en772"}]}]}]}]}];

  { id: "frontend", title: "Front-end", mono: "FE", desc: "HTML وCSS وJavaScript وReact — مصطلحات وأسئلة مقابلات" },

];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const hasLatin = s => /[A-Za-z]/.test(s || "");
const hasArabic = s => /[\u0600-\u06FF]/.test(s || "");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtNum = n => new Intl.NumberFormat("ar-EG").format(n);
const pct = x => Math.round(x * 100);
function toast(msg) { const t = $("#toast"); t.firstElementChild.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
/* Letter badge for a card: subject.mono if set, else first letter without the Arabic "ال". */
function monoOf(x) { if (x.mono) return x.mono; const w = String(x.title).trim().replace(/^ال(?=\S{2})/, ""); return w[0] || "؟"; }
function enSpan(s) { return `<span class="en">${esc(s)}</span>`; }
/* Show text, wrapping Latin runs so mixed Arabic/English reads in the right direction. */
function mixed(s) {
  if (!hasArabic(s)) return enSpan(s);
  return esc(s).replace(/([A-Za-z][A-Za-z0-9’'\-.,!?;:…() /+]*[A-Za-z0-9.!?…)])/g, '<span class="en">$1</span>');
}

/* ---------- speech ---------- */
const canSpeak = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
let enVoice = null;
function loadVoice() { try { const vs = speechSynthesis.getVoices(); enVoice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Jenny/i.test(v.name)) || vs.find(v => /en[-_](US|GB)/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if (canSpeak) { loadVoice(); try { speechSynthesis.onvoiceschanged = loadVoice; } catch (e) {} }
function speak(text) {
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ".").replace(/^\w+:\s/, ""));
    u.lang = "en-US"; u.rate = 0.92; if (enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const SPK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>`;
function sayBtn(text) { return canSpeak ? `<button class="say" type="button" data-say="${esc(text)}" aria-label="استمع للنطق" title="استمع">${SPK}</button>` : ""; }
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.preventDefault(); speak(b.dataset.say); } });

/* ---------- progress store (this browser only) ---------- */
const KEY = "darbna-training-v1";
function blank() { return { items: {}, xp: 0, days: {}, history: [], best: {}, placement: null }; }
let P = blank();
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
function rec(id) { return P.items[id] || (P.items[id] = { box: 0, ok: 0, no: 0, last: 0 }); }
/* Leitner-style boxes 0..5: right answers move an item up, wrong ones move it down. */
function grade(id, result) {
  const r = rec(id);
  if (result === 1) { r.ok++; r.box = Math.min(5, r.box + 1); P.xp += 10; }
  else if (result === 0.5) { r.ok += 0; r.box = Math.max(r.box, 1); P.xp += 4; }
  else { r.no++; r.box = Math.max(0, r.box - 2); P.xp += 2; }
  r.last = Date.now();
  const d = today(); P.days[d] = (P.days[d] || 0) + 1;
  save();
}
const mastery = id => (P.items[id]?.box || 0) / 5;
function streak() {
  let n = 0; const d = new Date();
  if (!P.days[today()]) d.setDate(d.getDate() - 1);
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (P.days[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
const LEVELS = [
  [0, "مبتدئ", "A1"], [0.10, "أساسي", "A2"], [0.25, "متوسط", "B1"], [0.45, "فوق المتوسط", "B2"], [0.65, "متقدم", "C1"], [0.85, "متمكن", "C2"],
];
function levelOf(m) { let L = LEVELS[0]; for (const l of LEVELS) if (m >= l[0]) L = l; const i = LEVELS.indexOf(L); const next = LEVELS[i + 1]; return { name: L[1], code: L[2], next: next ? next[0] : 1, from: L[0] }; }

/* ---------- data index ---------- */
const IDX = { items: {}, sections: {}, lessons: {}, topics: {}, subjects: {} };
for (const s of SUBJECTS) {
  s.labels = Object.assign({ meaning: "إيه معنى", say: "إزاي تقول بالإنجليزي", write: "اكتب بالإنجليزي", lang: "الإنجليزي" }, s.labels || {});
  IDX.subjects[s.id] = s;
  for (const t of s.topics) {
    t.subject = s; IDX.topics[t.id] = t;
    for (const l of t.lessons) {
      l.topic = t; IDX.lessons[l.id] = l;
      for (const sec of l.sections) {

/* ---------- quiz engine ---------- */
function startQuiz(cfg) {
  const questions = cfg.questions || buildQuiz(cfg.sections, cfg.count, cfg);
  if (!questions.length) { toast("مفيش أسئلة متاحة هنا لسه"); return; }
  QUIZ = { cfg, questions, i: 0, score: 0, answered: false, log: [], xp0: P.xp, back: location.hash || "#home" };
  renderQ();
}
function qHeader() {
  const q = QUIZ;
  return `<div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem">${mixed(q.cfg.title)}</h2><button class="btn sm ghost" data-act="quit">إنهاء</button></div>
    <div class="qtop"><span>${fmtNum(q.i + 1)} / ${fmtNum(q.questions.length)}</span><div class="meter"><i style="width:${pct(q.i / q.questions.length)}%"></i></div><span>✓ ${fmtNum(q.score)}</span></div>`;
}
function bigHTML(q) {
  if (q.listen) return `<div class="row"><button class="btn" data-say="${esc(q.listen)}">${SPK.replace("<svg", '<svg style="width:18px;height:18px;fill:currentColor"')} شغّل الصوت</button><span class="muted">تقدر تسمعها أكتر من مرة</span></div>`;
  if (!q.big) return "";
  const html = esc(q.big).replace(/_____/g, '<span class="blank">&nbsp;</span>');
  return `<div class="row" style="align-items:flex-start;gap:8px">${q.bigEn ? `<div class="qbig" style="flex:1">${html}</div>${q.say ? sayBtn(q.say) : ""}` : `<div class="qbig ar" style="flex:1">${mixed(q.big)}</div>`}</div>`;
}
function renderQ() {
  const Q = QUIZ, q = Q.questions[Q.i]; Q.answered = false;
  let body = "";
  if (q.kind === "mcq") body = `<div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${fmtNum(k + 1)}</span><span class="v ${q.optsEn || (hasLatin(o) && !hasArabic(o)) ? "en" : ""}">${q.optsEn || (hasLatin(o) && !hasArabic(o)) ? esc(o) : mixed(o)}</span></button>`).join("")}</div>`;
  else if (q.kind === "tf") body = `<div class="qbig ar">${mixed(q.sub)}</div><div class="tf"><button class="opt" data-tf="1"><span class="k">${fmtNum(1)}</span><span class="v">صح</span></button><button class="opt" data-tf="0"><span class="k">${fmtNum(2)}</span><span class="v">غلط</span></button></div>`;
  else if (q.kind === "type") body = `<input class="typein" id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here…"><div class="row"><button class="btn primary" data-act="check">تأكيد</button><button class="btn ghost sm" data-act="skip">مش عارف</button></div>`;
  else if (q.kind === "order") body = `<div class="built" id="built" aria-label="الجملة اللي بتكوّنها"></div><div class="bank" id="bank">${q.tokens.map((t, k) => `<button class="tok" data-t="${k}">${esc(t)}</button>`).join("")}</div><div class="row"><button class="btn primary" data-act="check">تأكيد</button><button class="btn ghost sm" data-act="reset">إعادة</button><button class="btn ghost sm" data-act="skip">مش عارف</button></div>`;
  else if (q.kind === "recall") body = `<textarea class="typein" id="typein" placeholder="Write your answer…"></textarea><div class="row"><button class="btn primary" data-act="reveal">اعرض الإجابة النموذجية</button></div>`;
  app.innerHTML = `<div class="quiz">${qHeader()}<div class="qcard"><div class="qkind">${esc(q.tag)}</div><div class="qtext">${mixed(q.prompt)}</div>${bigHTML(q)}${q.sub && q.kind !== "tf" && q.kind !== "recall" ? `<div class="qsub">${mixed(q.sub)}</div>` : ""}${q.kind === "recall" && q.sub ? `<div class="qsub">${mixed(q.sub)}</div>` : ""}${body}<div id="fb"></div></div>
    <div class="hint-k">${q.kind === "mcq" || q.kind === "tf" ? "اختصار: اضغط رقم الاختيار، وEnter للسؤال اللي بعده" : "Enter للتأكيد"}</div></div>`;
  app.querySelector('[data-act="quit"]').onclick = finishQuiz;
  if (q.kind === "mcq") app.querySelectorAll(".opt").forEach(b => b.onclick = () => answerMCQ(+b.dataset.k));
  if (q.kind === "tf") app.querySelectorAll(".opt").forEach(b => b.onclick = () => answerTF(b.dataset.tf === "1"));
  if (q.kind === "type") { const inp = $("#typein"); inp.focus(); app.querySelector('[data-act="check"]').onclick = () => answerType(inp.value); app.querySelector('[data-act="skip"]').onclick = () => answerType(""); }
  if (q.kind === "order") {
    const built = $("#built"), bank = $("#bank"); const seq = [];
    bank.onclick = e => { const b = e.target.closest(".tok"); if (!b || b.classList.contains("used") || Q.answered) return; b.classList.add("used"); seq.push(+b.dataset.t); const c = document.createElement("button"); c.className = "tok"; c.textContent = q.tokens[+b.dataset.t]; c.dataset.t = b.dataset.t; built.appendChild(c); };
    built.onclick = e => { const c = e.target.closest(".tok"); if (!c || Q.answered) return; const k = +c.dataset.t; seq.splice(seq.indexOf(k), 1); c.remove(); bank.querySelector(`[data-t="${k}"]`).classList.remove("used"); };
    app.querySelector('[data-act="reset"]').onclick = () => { seq.length = 0; built.innerHTML = ""; bank.querySelectorAll(".tok").forEach(b => b.classList.remove("used")); };
    app.querySelector('[data-act="check"]').onclick = () => answerOrder(seq.map(k => q.tokens[k]).join(" "));
    app.querySelector('[data-act="skip"]').onclick = () => answerOrder("");
  }
  if (q.kind === "recall") app.querySelector('[data-act="reveal"]').onclick = revealRecall;
}
function explainHTML(q) {
  const it = q.item, parts = [];
  if (q.why) parts.push(mixed(q.why));
  if (it) {
    if (q.full && q.gen !== "context") parts.push(`<span class="en">${esc(q.full)}</span>`);
    if (it.type === "phrase" || it.type === "dialogue") {
      parts.push(`<span class="en"><b>${esc(it.en)}</b></span> = ${mixed(it.ar || "")}`);
      if (it.note) parts.push(mixed(it.note));
      if (it.example && q.gen !== "exampleOrder") parts.push(`مثال: <span class="en">${esc(it.example)}</span>${it.exampleAr ? " — " + mixed(it.exampleAr) : ""}`);
      if (q.gen === "exampleOrder" && it.exampleAr) parts.push(mixed(it.exampleAr));
    } else if (it.type === "correction") {
      parts.push(`الأصح: <span class="en"><b>${esc(String(it.correct).split("\n")[0])}</b></span>${it.ar ? " — " + mixed(it.ar) : ""}`);
      if (it.note) parts.push(mixed(it.note));
    } else if (it.type === "qa") {
      if (q.gen !== "qaPick") parts.push(`<span class="en">${esc(short(it.answer, 400))}</span>`);
      if (it.ar) parts.push(`السؤال: ${mixed(it.ar)}`);
    } else if (it.type === "passage" && it.ar) parts.push(mixed(short(it.ar, 300)));
  }
  return parts.map(p => `<div class="why">${p}</div>`).join("");
}
function showFeedback(result, rightText, rightIsEn) {
  const Q = QUIZ, q = Q.questions[Q.i]; Q.answered = true;
  const cls = result >= 0.9 ? "ok" : result > 0 ? "mid" : "no";
  const head = result === 1 ? "إجابة صحيحة" : result >= 0.9 ? "صح، مع غلطة إملائية بسيطة" : result > 0 ? "جزئيًا" : "إجابة غلط";
  Q.score += result >= 0.9 ? 1 : result > 0 ? 0.5 : 0;
  Q.log.push({ q, result, right: rightText });
  grade(q.gradeId, result >= 0.9 ? 1 : result > 0 ? 0.5 : 0);
  if (q.gradeId !== (q.item && q.item.id) && q.item) { /* reply questions also touch the asking line lightly */ }
  updateChip();
  const last = Q.i + 1 >= Q.questions.length;
  $("#fb").innerHTML = `<div class="fb ${cls}"><div class="head">${head}</div>${result < 1 && rightText ? `<div class="ans">الإجابة الصحيحة: ${rightIsEn ? `<span class="en"><b>${esc(rightText)}</b></span>` : `<b>${mixed(rightText)}</b>`}</div>` : ""}${explainHTML(q)}</div>
    <div class="qactions" style="margin-top:12px"><button class="btn primary" id="nextq">${last ? "النتيجة" : "السؤال اللي بعده"}</button>${q.say ? sayBtn(q.say) : ""}</div>`;
  $("#nextq").onclick = nextQ; $("#nextq").focus({ preventScroll: true });
  $("#fb").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function answerMCQ(k) {
  const Q = QUIZ; if (Q.answered) return; const q = Q.questions[Q.i];
  const chosen = q.options[k]; const ok = chosen === q.answer;
  app.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (q.options[j] === q.answer) b.classList.add("right"); else if (j === k) b.classList.add("wrongpick"); });
  showFeedback(ok ? 1 : 0, ok ? null : q.answer, q.optsEn || (hasLatin(q.answer) && !hasArabic(q.answer)));
}
function answerTF(v) {
  const Q = QUIZ; if (Q.answered) return; const q = Q.questions[Q.i]; const ok = v === q.answer;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bv = b.dataset.tf === "1"; if (bv === q.answer) b.classList.add("right"); else if (bv === v) b.classList.add("wrongpick"); });
  showFeedback(ok ? 1 : 0, ok ? null : (q.answer ? "صح" : "غلط — المعنى الصحيح: " + q.truthAr), false);
}
function answerType(val) {
  const Q = QUIZ; if (Q.answered) return; const q = Q.questions[Q.i];
  const r = checkTyped(val, q.answers); $("#typein").disabled = true; app.querySelectorAll('[data-act="check"],[data-act="skip"]').forEach(b => b.disabled = true);
  showFeedback(r, r === 1 ? null : q.show, true);
}
function answerOrder(val) {
  const Q = QUIZ; if (Q.answered) return; const q = Q.questions[Q.i];
  const ok = norm(val) === norm(q.answer) && val.length > 0;
  app.querySelectorAll('[data-act]:not([data-act="quit"])').forEach(b => b.disabled = true);
  showFeedback(ok ? 1 : 0, ok ? null : q.answer, true);
}
function revealRecall() {
  const Q = QUIZ, q = Q.questions[Q.i];
  const btn = app.querySelector('[data-act="reveal"]'); btn.parentElement.remove(); $("#typein").readOnly = true;
  $("#fb").innerHTML = `<div class="fb mid"><div class="head">الإجابة النموذجية</div><div class="ans en" style="text-align:left">${esc(q.model)}</div>${q.modelAr ? `<div class="why">${mixed(q.modelAr)}</div>` : ""}</div>
    <div class="stack" style="gap:8px;margin-top:12px"><div class="muted">قيّم إجابتك بأمانة:</div><div class="row"><button class="btn" data-r="1">جاوبت كويس</button><button class="btn" data-r="0.5">جزئيًا</button><button class="btn" data-r="0">ماعرفتش</button></div></div>`;
  $("#fb").querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const r = +b.dataset.r; Q.answered = true; Q.score += r; Q.log.push({ q, result: r, right: short(q.model, 300) }); grade(q.gradeId, r); updateChip();
    const last = Q.i + 1 >= Q.questions.length;
    $("#fb").querySelector(".stack").innerHTML = `<div class="qactions"><button class="btn primary" id="nextq">${last ? "النتيجة" : "السؤال اللي بعده"}</button></div>`;
    $("#nextq").onclick = nextQ; $("#nextq").focus();
  });
}
function nextQ() { QUIZ.i++; if (QUIZ.i >= QUIZ.questions.length) finishQuiz(); else { renderQ(); window.scrollTo(0, 0); } }
function finishQuiz() {
  const Q = QUIZ; if (!Q) return;
  const done = Q.log.length;
  if (!done) { QUIZ = null; render(); return; }
  const score = Math.round(100 * Q.score / done);
  const entry = { date: today(), t: Date.now(), title: Q.cfg.title, score, n: done, xp: P.xp - Q.xp0 };
  P.history.unshift(entry); P.history = P.history.slice(0, 200);
  let placementNote = "";
  if (Q.cfg.placement) {
    const L = levelOf(Q.score / done * 0.95);
    P.placement = P.placement || {}; P.placement[Q.cfg.placement] = { score, level: `${L.name} ${L.code}`, date: today() };
    placementNote = `<p>مستواك التقريبي حسب الاختبار: <b>${L.name}</b> <span class="pill">${L.code}</span></p>`;
  }
  save();
  const wrong = Q.log.filter(x => x.result < 0.9);
  const verdict = score >= 90 ? "ممتاز" : score >= 75 ? "كويس جدًا" : score >= 50 ? "محتاج شوية مراجعة" : "راجع الشرح وجرّب تاني";
  const cls = score >= 75 ? "good" : score >= 50 ? "warn" : "bad";
  QUIZ = null;
  app.innerHTML = `<div class="quiz stack" style="gap:20px">
    <div class="qcard" style="align-items:flex-start"><div class="qkind">${mixed(Q.cfg.title)}</div>
      <div class="row" style="gap:16px;align-items:flex-end"><div class="result-score">${fmtNum(score)}٪</div><span class="pill ${cls}">${verdict}</span></div>
      <p class="muted">${fmtNum(Math.round(Q.score * 10) / 10)} من ${fmtNum(done)} صح · +${fmtNum(P.xp - Q.xp0)} نقطة</p>${placementNote}
      <div class="row">${wrong.length ? `<button class="btn primary" data-act="retry">أعد الأسئلة اللي غلطت فيها (${fmtNum(wrong.length)})</button>` : ""}<button class="btn" data-act="again">اختبار جديد بنفس الإعدادات</button><a class="btn ghost" href="${esc(Q.back)}">رجوع</a></div></div>
    ${wrong.length ? `<section class="stack"><h2>راجع الأخطاء</h2><div class="review-list">${wrong.map(x => `<div class="r"><div class="q">${mixed(x.q.prompt)} ${x.q.big ? (x.q.bigEn ? enSpan(x.q.big.replace(/_____/g, "___")) : mixed(x.q.big)) : ""}</div><div>الصح: ${hasLatin(x.right) && !hasArabic(x.right) ? enSpan(x.right) : mixed(x.right || "")}</div></div>`).join("")}</div></section>` : ""}
  </div>`;
  app.querySelector('[data-act="retry"]')?.addEventListener("click", () => {
    const qs = wrong.map(x => { if (!x.q.item) return x.q.rule ? ruleQuestion(x.q.rule) : x.q; return makeQuestion(x.q.item, x.q.gen) || x.q; });
    startQuiz({ title: "إعادة الأخطاء", questions: qs, back: Q.back });
  });
  app.querySelector('[data-act="again"]').onclick = () => startQuiz(Object.assign({}, Q.cfg, { questions: Q.cfg.placement ? Q.questions.map(q => (q.item && makeQuestion(q.item)) || q) : null }));
  updateChip();
}
document.addEventListener("keydown", e => {
  if (!QUIZ) return;
  const q = QUIZ.questions[QUIZ.i]; if (!q) return;
  if (e.key === "Enter" && QUIZ.answered && $("#nextq")) { e.preventDefault(); nextQ(); return; }
  if (e.target.matches("input,textarea")) { if (e.key === "Enter" && e.target.tagName === "INPUT" && !QUIZ.answered) { e.preventDefault(); answerType(e.target.value); } return; }
  const n = parseInt(e.key, 10);
  if (!QUIZ.answered && n >= 1) { if (q.kind === "mcq" && n <= q.options.length) answerMCQ(n - 1); if (q.kind === "tf" && n <= 2) answerTF(n === 1); }
  if (e.key === "Enter" && !QUIZ.answered && q.kind === "order") app.querySelector('[data-act="check"]')?.click();
});

/* ---------- flashcards ---------- */
function startFlash(title, items) {
  const list = shuffle(items).sort((a, b) => mastery(a.id) - mastery(b.id)).slice(0, 30);
  if (!list.length) return toast("مفيش بطاقات هنا");
  let i = 0, known = 0; const back = location.hash;
  const show = () => {
    if (i >= list.length) {
      app.innerHTML = `<div class="quiz"><div class="qcard"><h2>خلّصت البطاقات</h2><p>عرفت ${fmtNum(known)} من ${fmtNum(list.length)}.</p><div class="row"><button class="btn primary" id="fa">بطاقات تاني</button><a class="btn" href="${esc(back)}">رجوع</a></div></div></div>`;
      $("#fa").onclick = () => startFlash(title, items); return;
    }
    const it = list[i]; const front = it.type === "correction" ? String(it.correct).split("\n")[0] : cleanEn(it.en);
    const backAr = it.type === "qa" ? (it.ar || "") : (it.ar || it.correctAr || "");
    app.innerHTML = `<div class="quiz"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem">بطاقات: ${mixed(title)}</h2><a class="btn sm ghost" href="${esc(back)}">إنهاء</a></div>
      <div class="qtop"><span>${fmtNum(i + 1)} / ${fmtNum(list.length)}</span><div class="meter"><i style="width:${pct(i / list.length)}%"></i></div></div>
      <div class="flash" id="card" tabindex="0" role="button" aria-label="اقلب البطاقة"><div class="stack" style="align-items:center"><div class="front">${esc(front)}</div><div class="muted" id="flipHint">اضغط عشان تشوف المعنى</div><div class="back" id="back" hidden><div style="font-size:1.15rem;font-weight:600">${mixed(backAr)}</div>${it.example ? `<div class="en muted">${esc(it.example)}</div>` : ""}${it.type === "qa" ? `<div class="en" style="text-align:left;font-size:.95rem">${esc(short(it.answer, 400))}</div>` : ""}</div></div></div>
      <div class="row" style="justify-content:center">${sayBtn(front)}<button class="btn" id="fno" hidden>لسه مش حافظها</button><button class="btn primary" id="fyes" hidden>حافظها</button></div></div>`;
    const flip = () => { $("#back").hidden = false; $("#flipHint").hidden = true; $("#fno").hidden = false; $("#fyes").hidden = false; };
    $("#card").onclick = flip; $("#card").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
    $("#fyes").onclick = () => { grade(it.id, 1); known++; i++; updateChip(); show(); };
    $("#fno").onclick = () => { grade(it.id, 0); i++; updateChip(); show(); };
  };
  show();
}

/* ---------- stats ---------- */
function viewStats() {
  setNav("stats");
  const all = SUBJECTS.flatMap(subjectItems);
  const days = []; const d = new Date(); d.setDate(d.getDate() - 13);
  for (let k = 0; k < 14; k++) { const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); days.push([key, P.days[key] || 0]); d.setDate(d.getDate() + 1); }
  const weak = all.filter(it => P.items[it.id] && P.items[it.id].no > 0).sort((a, b) => (P.items[b.id].no - P.items[b.id].ok) - (P.items[a.id].no - P.items[a.id].ok)).slice(0, 12);
  const learned = all.filter(it => (P.items[it.id]?.box || 0) >= 4).length;
  app.innerHTML = `<div class="stack" style="gap:24px">
    <h1>المتابعة</h1>
    <section class="hero">${levelCard(all, "مستواك العام")}<div class="panel stack" style="gap:10px"><h3>آخر ١٤ يوم</h3><div class="week">${days.map(([k, n]) => `<span class="${n === 0 ? "" : n < 15 ? "l1" : n < 40 ? "l2" : "l3"}" title="${k}: ${n}"></span>`).join("")}</div>
      <div class="kv"><div><b>${fmtNum(streak())}</b>أيام متتالية</div><div><b>${fmtNum(P.xp)}</b>نقطة</div><div><b>${fmtNum(learned)}</b>عنصر محفوظ</div></div></div></section>
    ${SUBJECTS.map(s => `<section class="panel stack"><h2>${esc(s.title)}</h2>${s.topics.map(t => `<div class="stack" style="gap:4px"><div class="row" style="justify-content:space-between"><a href="#topic-${t.id}"><b>${esc(t.title)}</b></a><span class="muted" style="font-size:.85rem">${fmtNum(topicItems(t).filter(it => P.items[it.id]).length)} / ${fmtNum(topicItems(t).length)}</span></div>${meter(avgMastery(topicItems(t)))}</div>`).join("")}</section>`).join("")}
    ${weak.length ? `<section class="panel stack"><div class="row" style="justify-content:space-between"><h2>أكتر حاجات بتغلط فيها</h2><button class="btn sm primary" id="drillweak">تدريب عليها</button></div><div class="items">${weak.map(it => `<div class="it"><div class="en-line">${sayBtn(cleanEn(it.en || it.wrong || ""))}<span class="en">${esc(it.type === "correction" ? String(it.correct).split("\n")[0] : it.en)}</span></div><div class="ar">${mixed(it.ar || "")}</div><div class="tag">${fmtNum(P.items[it.id].no)} غلط · ${fmtNum(P.items[it.id].ok)} صح · ${esc(it.sec.lesson.title)}</div></div>`).join("")}</div></section>` : ""}
    <section class="panel stack"><h2>سجل الاختبارات</h2>${P.history.length ? `<div class="tablewrap"><table class="hist"><thead><tr><th>التاريخ</th><th>الاختبار</th><th>الأسئلة</th><th>النتيجة</th></tr></thead><tbody>${P.history.slice(0, 30).map(h => `<tr><td class="n">${esc(h.date)}</td><td>${mixed(h.title)}</td><td class="n">${fmtNum(h.n)}</td><td class="n"><span class="pill ${h.score >= 75 ? "good" : h.score >= 50 ? "warn" : "bad"}">${fmtNum(h.score)}٪</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">لسه ماعملتش أي اختبار. ابدأ من صفحة الأقسام.</p>`}</section>
    <section class="panel stack"><h2>حفظ التقدم</h2><p class="muted">التقدم بيتحفظ في المتصفح ده بس. انسخ الكود عشان تنقله لجهاز تاني أو تحتفظ بنسخة.</p>
      <textarea class="typein" id="backup" style="min-height:80px;font-size:.8rem" placeholder="الصق كود التقدم هنا عشان تسترجعه"></textarea>
      <div class="row"><button class="btn" id="exp">انسخ كود التقدم</button><button class="btn" id="imp">استرجع من الكود</button><button class="btn ghost" id="rst">مسح كل التقدم</button></div><div id="rstc"></div></section>
  </div>`;
  $("#drillweak")?.addEventListener("click", () => startQuiz({ title: "تدريب على الأخطاء", questions: weak.map(it => makeQuestion(it)).filter(Boolean).concat(weak.map(it => makeQuestion(it)).filter(Boolean)).slice(0, 20) }));
  $("#exp").onclick = () => { const code = JSON.stringify(P); $("#backup").value = code; $("#backup").select(); (navigator.clipboard?.writeText(code) || Promise.reject()).then(() => toast("اتنسخ"), () => toast("اختار النص وانسخه يدويًا")); };
  $("#imp").onclick = () => { try { const v = JSON.parse($("#backup").value); if (!v || typeof v !== "object" || !v.items) throw 0; P = Object.assign(blank(), v); save(); toast("اترجع التقدم"); render(); } catch (e) { toast("الكود ده مش صحيح"); } };
  $("#rst").onclick = () => { $("#rstc").innerHTML = `<div class="fb no"><div>متأكد؟ هيتمسح كل تقدمك ومستواك.</div><div class="row"><button class="btn" id="rsty">أيوه امسح</button><button class="btn ghost" id="rstn">لا</button></div></div>`; $("#rsty").onclick = () => { P = blank(); save(); render(); toast("اتمسح التقدم"); }; $("#rstn").onclick = () => $("#rstc").innerHTML = ""; };
}

render();
</script>
</body>
