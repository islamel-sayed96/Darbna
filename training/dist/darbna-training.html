<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دربنا للتدريب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one reading column (max 860px) like a study notebook; sticky top bar; quiz = one focused card. */
:root {
  --paper: #f6f4ec;
  --sheet: #fffdf7;
  --ink: #1d2a2a;
  --muted: #5d6b68;
  --line: #e2ddcd;
  --accent: #0d6b5e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --marker: #fbe7a1;
  --good: #1f7a3a;
  --good-soft: #def2e2;
  --bad: #b3261e;
  --bad-soft: #fbe3e0;
  --warn: #8a5a00;
  --warn-soft: #fbefd5;
  --shadow: 0 1px 2px rgba(29, 42, 42, .06), 0 4px 16px rgba(29, 42, 42, .06);
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-en: "Literata", Georgia, "Times New Roman", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a19; --sheet: #1a2322; --ink: #e8ece6; --muted: #9caba6; --line: #2c3836;
    --accent: #4cc2ad; --accent-ink: #08201c; --accent-soft: #1d3a35; --marker: #4d4420;
    --good: #6fd08c; --good-soft: #1b3524; --bad: #ff8a80; --bad-soft: #3d1f1d; --warn: #f2c46b; --warn-soft: #3a2f17;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a19; --sheet: #1a2322; --ink: #e8ece6; --muted: #9caba6; --line: #2c3836;
  --accent: #4cc2ad; --accent-ink: #08201c; --accent-soft: #1d3a35; --marker: #4d4420;
  --good: #6fd08c; --good-soft: #1b3524; --bad: #ff8a80; --bad-soft: #3d1f1d; --warn: #f2c46b; --warn-soft: #3a2f17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.7 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
.en { font-family: var(--f-en); direction: ltr; unicode-bidi: isolate; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; color: var(--ink); text-decoration: none; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: .8rem; color: var(--muted); }
.bar nav { margin-inline-start: auto; display: flex; gap: 4px; align-items: center; }
.navbtn { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; text-decoration: none; font-size: .95rem; }
.navbtn:hover, .navbtn[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.chip-xp { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

main { padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.crumbs { font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { text-decoration: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); padding: 8px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; color: var(--ink); min-height: 42px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* summary strip */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: stretch; }
.hero-main { display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.hero-main h1 span { background: linear-gradient(transparent 58%, var(--marker) 58%); padding-inline: 2px; }
.levelcard { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; box-shadow: var(--shadow); }
.ring { width: 96px; height: 96px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring text { fill: var(--ink); font: 700 18px var(--f-body); }
.lv-name { font-family: var(--f-display); font-size: 1.25rem; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.kv div { font-size: .8rem; color: var(--muted); }
.kv b { display: block; font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.link { text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.card.link:hover { border-color: var(--accent); transform: translateY(-1px); }
.card.soon { opacity: .7; border-style: dashed; }
.mono { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; flex: none; }
.card-head { display: flex; gap: 12px; align-items: center; }
.pill { display: inline-block; font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

.meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.meter-row { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter-row .meter { flex: 1; }

.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.sec-list { display: flex; flex-direction: column; }
.sec-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.sec-row:last-child { border-bottom: 0; }
.sec-row .t { font-weight: 600; }
.sec-row .actions { display: flex; gap: 6px; }

/* lesson */
details.sec { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
details.sec > summary { list-style: none; padding: 14px 16px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "+"; margin-inline-start: auto; font-size: 1.3rem; color: var(--muted); }
details.sec[open] > summary::after { content: "−"; }
details.sec[open] > summary { border-bottom: 1px solid var(--line); }
.sec-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.notes { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.notes p { white-space: pre-line; }
.notes .lbl { font-size: .78rem; font-weight: 700; letter-spacing: .02em; color: var(--accent); }
.items { display: flex; flex-direction: column; }
.it { padding: 12px 0; border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.it:last-child { border-bottom: 0; }
.it .en-line { display: flex; gap: 8px; align-items: flex-start; justify-content: flex-end; flex-direction: row-reverse; }
.it .en-line .en { font-size: 1.08rem; font-weight: 600; flex: 1; text-align: left; white-space: pre-line; }
.it .ar { font-weight: 500; white-space: pre-line; }
.it .note { font-size: .9rem; color: var(--muted); white-space: pre-line; }
.it .ex { font-size: .92rem; border-inline-start: 3px solid var(--marker); padding-inline-start: 10px; display: flex; flex-direction: column; gap: 2px; }
.it .ex .en { text-align: left; white-space: pre-line; }
.it .wrong { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); }
.it .tag { font-size: .75rem; color: var(--muted); }
.it details.long summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
.it .long-body { white-space: pre-line; padding-top: 6px; }
.say { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none; padding: 0; }
.say svg { width: 16px; height: 16px; fill: var(--accent); }
.mark { background: linear-gradient(transparent 55%, var(--marker) 55%); }

/* quiz */
.quiz { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.qtop { display: flex; align-items: center; gap: 12px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtop .meter { flex: 1; }
.qcard { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.qkind { font-size: .8rem; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.qtext { font-size: 1.15rem; font-weight: 600; white-space: pre-line; }
.qtext .en { font-size: 1.2rem; }
.qsub { color: var(--muted); font-size: .95rem; }
.qbig { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 1.3rem; line-height: 1.6; background: var(--paper); border-radius: 10px; padding: 12px 14px; white-space: pre-line; }
.qbig.ar { font-family: var(--f-body); direction: rtl; text-align: right; font-size: 1.15rem; }
.blank { display: inline-block; min-width: 4ch; border-bottom: 2px solid var(--accent); color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: start; border: 1.5px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; min-height: 52px; white-space: pre-line; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k { width: 26px; height: 26px; border-radius: 7px; background: var(--paper); display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; color: var(--muted); }
.opt .v { flex: 1; min-width: 0; }
.opt .v.en { text-align: left; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.typein { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); font-family: var(--f-en); font-size: 1.1rem; direction: ltr; text-align: left; }
textarea.typein { min-height: 120px; resize: vertical; font-family: var(--f-en); }
.typein:focus { border-color: var(--accent); outline: none; }
.bank, .built { display: flex; flex-wrap: wrap; gap: 8px; direction: ltr; justify-content: flex-start; }
.built { min-height: 56px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; background: var(--paper); }
.tok { font-family: var(--f-en); border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 12px; font-size: 1.02rem; }
.tok:hover { border-color: var(--accent); }
.tok.used { visibility: hidden; }
.fb { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb.mid { background: var(--warn-soft); }
.fb .head { font-weight: 700; }
.fb.ok .head { color: var(--good); }
.fb.no .head { color: var(--bad); }
.fb.mid .head { color: var(--warn); }
.fb .ans { white-space: pre-line; }
.fb .why { font-size: .92rem; white-space: pre-line; }
.qactions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.hint-k { font-size: .8rem; color: var(--muted); }

.flash { min-height: 220px; display: grid; place-items: center; text-align: center; cursor: pointer; padding: 28px; border-radius: 16px; background: var(--sheet); border: 1px solid var(--line); box-shadow: var(--shadow); }
.flash .front { font-family: var(--f-en); font-size: 1.5rem; direction: ltr; }
.flash .back { display: flex; flex-direction: column; gap: 10px; }

.result-score { font-family: var(--f-display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.review-list { display: flex; flex-direction: column; gap: 10px; }
.review-list .r { border-inline-start: 3px solid var(--bad); padding: 6px 12px; background: var(--sheet); border-radius: 0 8px 8px 0; display: flex; flex-direction: column; gap: 2px; }
.review-list .r .q { font-weight: 600; white-space: pre-line; }

.setup { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--sheet); padding: 8px 14px; font-weight: 600; border-inline-start: 1px solid var(--line); }
.seg button:first-child { border-inline-start: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

table.hist { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.hist th, table.hist td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: start; }
table.hist td.n { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.week { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
.week span { aspect-ratio: 1; border-radius: 4px; background: var(--line); max-width: 100%; }
.week span.l1 { background: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.week span.l2 { background: color-mix(in srgb, var(--accent) 65%, var(--line)); }
.week span.l3 { background: var(--accent); }
.toast { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; z-index: 20; }
.toast span { background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .9rem; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .sec-row { grid-template-columns: minmax(0, 1fr); }
  .levelcard { grid-template-columns: 1fr; justify-items: start; }
  .chip-xp { display: none; }
  .qcard { padding: 16px; }
  .bar nav .navbtn { padding: 6px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#home">دربنا <small>تدريب ومراجعة</small></a>
    <nav>
      <span class="chip-xp" id="xpchip"></span>
      <a class="navbtn" href="#home" data-nav="home">الأقسام</a>
      <a class="navbtn" href="#stats" data-nav="stats">المتابعة</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden><span></span></div>

const SUBJECTS = [{"id":"english","title":"الإنجليزي","mono":"En","lang":"en","desc":"تعبيرات، قواعد، مقابلات شغل، والكورس — شرح وتدريب واختبارات","topics":[{"id":"grammar","title":"القواعد والتركيبات","desc":"تركيبات الجمل وحروف الجر واختيار الكلمة الصح","lessons":[{"id":"grammar-0","title":"التركيبات اللغوية","heading":"Useful Language Combinations — التركيبات اللغوية","intro":[],"sections":[{"id":"grammar-0-0","title":"Part 1: I’m in / at / on","notes":["in: داخل مساحة أو مكان. at: موقع أو وجهة. وقد يصح الاثنان مع نفس المكان حسب المقصود.","on: في تعبيرات مثل on the phone وon my computer، ومع الحافلة on a bus.","in the shower = أستحمّ، وليست مجرد وجودي في الحمّام. in a car = داخل سيارة."],"items":[{"en":"I’m in the shower.","ar":"أنا بستحمّى / أنا تحت الدش.","type":"phrase","id":"en1"},{"en":"I’m in the lobby.","ar":"أنا في الردهة / بهو الاستقبال.","type":"phrase","id":"en2"},{"en":"I’m in a car.","ar":"أنا داخل سيارة.","type":"phrase","id":"en3"},{"en":"I’m in a house.","ar":"أنا داخل منزل.","type":"phrase","id":"en4"},{"en":"I’m in a school.","ar":"أنا داخل مدرسة.","type":"phrase","id":"en5"},{"en":"I’m at the mall.","ar":"أنا في المركز التجاري.","type":"phrase","id":"en6"},{"en":"I’m at the doctor’s office.","ar":"أنا في عيادة الطبيب.","type":"phrase","id":"en7"},{"en":"I’m at the park.","ar":"أنا في الحديقة.","type":"phrase","id":"en8"},{"en":"I’m at the airport.","ar":"أنا في المطار.","type":"phrase","id":"en9"},{"en":"I’m in the mall.","ar":"أنا داخل المركز التجاري.","type":"phrase","id":"en10"},{"en":"I’m in the park.","ar":"أنا داخل الحديقة.","type":"phrase","id":"en11"},{"en":"I’m on the phone.","ar":"أنا بتكلم في التليفون.","type":"phrase","id":"en12"},{"en":"I’m on my computer.","ar":"أنا بستخدم الكمبيوتر بتاعي.","type":"phrase","id":"en13"},{"en":"I’m on a bus.","ar":"أنا على متن حافلة.","type":"phrase","id":"en14"}],"rules":["in = جوه مكان مقفول أو مساحة: in the car, in the lobby, in a house.","at = عند نقطة أو مكان بنروحه لغرض: at the airport, at the doctor’s office, at the mall.","on = مع وسائل المواصلات الكبيرة والأجهزة: on a bus, on the phone, on my computer.","in the shower معناها «بستحمى» مش بس «موجود في الحمام»."],"questions":[{"q":"I’m ___ the phone. (بتكلم في التليفون)","options":["on","in","at"],"answer":0,"explain":"مع التليفون والكمبيوتر بنقول on: on the phone, on my computer."},{"q":"I’m ___ a bus.","options":["on","in","at"],"answer":0,"explain":"مع وسائل المواصلات الكبيرة (bus, train, plane) بنقول on."},{"q":"I’m ___ a car.","options":["in","on","at"],"answer":0,"explain":"مع العربية الصغيرة (car, taxi) بنقول in لأنك جوه مساحة مقفولة."},{"q":"I’m ___ the airport. (موجود في المطار كمكان/وجهة)","options":["at","on","to"],"answer":0,"explain":"at للمكان كنقطة أو وجهة: at the airport."},{"q":"إيه معنى I’m in the shower؟","options":["أنا بستحمى","أنا واقف في الحمام","أنا بنضف الحمام"],"answer":0,"explain":"in the shower = بتستحمى تحت الدش."},{"q":"أي جملة صح لما تكون جوه المول بالظبط (داخل المبنى)؟","options":["I’m in the mall.","I’m on the mall.","I’m to the mall."],"answer":0,"explain":"in = جوه المكان. at the mall كمان صح لو تقصد المكان عمومًا."}],"focus":{"in":["at","on"],"at":["in","on"],"on":["in","at"]}},{"id":"grammar-0-1","title":"Part 2: I’m good at","notes":["أنا أجيد / جيد في. بعد at نستخدم اسمًا أو فعلًا بصيغة -ing."],"items":[{"en":"I’m good at video games.","ar":"أنا كويس في ألعاب الفيديو.","type":"phrase","id":"en15"},{"en":"I’m good at swimming.","ar":"أنا أجيد السباحة.","type":"phrase","id":"en16"},{"en":"I’m good at driving.","ar":"أنا أجيد القيادة.","type":"phrase","id":"en17"},{"en":"I’m good at reading.","ar":"أنا أجيد القراءة.","type":"phrase","id":"en18"},{"en":"I’m good at writing.","ar":"أنا أجيد الكتابة.","type":"phrase","id":"en19"},{"en":"I’m good at math.","ar":"أنا كويس في الرياضيات.","type":"phrase","id":"en20"},{"en":"I’m good at chess.","ar":"أنا أجيد الشطرنج.","type":"phrase","id":"en21"}],"rules":["good at + اسم (math, chess) أو فعل -ing (swimming, driving).","مانقولش good in swimming ولا good at swim."],"questions":[{"q":"I’m good at ___.","options":["swimming","swim","to swim"],"answer":0,"explain":"بعد at بييجي اسم أو فعل بـ ing."},{"q":"I’m good ___ math.","options":["at","in","on"],"answer":0,"explain":"التركيب الثابت: good at."},{"q":"أي جملة صحيحة؟","options":["I’m good at driving.","I’m good at drive.","I’m good to driving."],"answer":0,"explain":"good at + verb-ing."}],"focus":{"at":["in","on","to"]}},{"id":"grammar-0-2","title":"Part 3: I’m getting","notes":["getting تعبر عن تغير الحالة أو الاستعداد أو بداية أعراض أو الحصول على شيء، حسب ما بعدها.","getting better = أتحسّن الآن. getting good at reading = أصبح أفضل في القراءة تدريجيًا."],"items":[{"en":"I’m getting better.","ar":"أنا بتحسّن.","type":"phrase","id":"en22"},{"en":"I’m getting ready for bed.","ar":"أنا بستعد للنوم.","type":"phrase","id":"en23"},{"en":"I’m getting a cold.","ar":"بدأ يجيني دور برد.","type":"phrase","id":"en24"},{"en":"I’m getting tired.","ar":"أنا بدأت أتعب.","type":"phrase","id":"en25"},{"en":"I’m getting good at reading.","ar":"أنا بتحسّن في القراءة وببقى كويس فيها.","type":"phrase","id":"en26"},{"en":"I’m getting a new car.","ar":"أنا هجيب عربية جديدة.","type":"phrase","id":"en27"},{"en":"I’m getting a job.","ar":"أنا هحصل على وظيفة.","type":"phrase","id":"en28"}],"rules":["getting + صفة = حالة بتتغير: getting tired, getting better.","getting ready = بستعد. getting a cold = بدأ يجيلي برد.","getting + اسم ممكن تعني هحصل على/هجيب: getting a new car."],"questions":[{"q":"إيه معنى I’m getting tired؟","options":["بدأت أتعب","أنا تعبان من زمان","هجيب حاجة متعبة"],"answer":0,"explain":"getting + صفة = تغير في الحالة دلوقتي."},{"q":"I’m getting ___ for bed.","options":["ready","readying","to ready"],"answer":0,"explain":"getting ready for = بستعد لـ."},{"q":"إيه معنى I’m getting a cold؟","options":["بدأ يجيلي دور برد","بشتري حاجة ساقعة","أنا بردان"],"answer":0,"explain":"get a cold = يصاب بالبرد؛ getting = بداية الأعراض."}],"focus":{"getting":["trying","going","having"]}},{"id":"grammar-0-3","title":"Part 4: I’m trying to + verb","notes":["أنا أحاول أن… بعد trying to يأتي الفعل في صورته الأساسية.","I’m trying new food تعني تجربة طعام جديد؛ trying + اسم، دون to."],"items":[{"en":"I’m trying to get a job.","ar":"أنا بحاول أحصل على وظيفة.","type":"phrase","id":"en29"},{"en":"I’m trying to call my family.","ar":"أنا بحاول أتصل بعيلتي.","type":"phrase","id":"en30"},{"en":"I’m trying to enjoy my dinner.","ar":"أنا بحاول أستمتع بعشائي.","type":"phrase","id":"en31"},{"en":"I’m trying to educate myself.","ar":"أنا بحاول أعلّم وأثقّف نفسي.","type":"phrase","id":"en32"},{"en":"I’m trying to explain myself.","ar":"أنا بحاول أوضح قصدي / موقفي.","type":"phrase","id":"en33"},{"en":"I’m trying new food.","ar":"أنا بجرّب أكل جديد.","type":"phrase","id":"en34"},{"en":"I’m trying to eat healthily.","ar":"أنا بحاول آكل بطريقة صحية.","type":"phrase","id":"en35"},{"en":"I’m trying to understand.","ar":"أنا بحاول أفهم.","type":"phrase","id":"en36"}],"rules":["trying to + فعل في صورته الأساسية = بحاول أعمل.","trying + اسم (من غير to) = بجرّب: I’m trying new food."],"questions":[{"q":"I’m trying ___ understand.","options":["to","for","at"],"answer":0,"explain":"trying to + base verb."},{"q":"إيه الفرق بين I’m trying new food و I’m trying to eat healthily؟","options":["الأولى بجرّب، التانية بحاول","الاتنين بحاول","الاتنين بجرّب"],"answer":0,"explain":"trying + اسم = يجرّب. trying to + فعل = يحاول."},{"q":"أي جملة صحيحة؟","options":["I’m trying to call my family.","I’m trying to calling my family.","I’m trying calling to my family."],"answer":0,"explain":"بعد to الفعل يكون في صورته الأساسية."}],"focus":{"to":["for","at","-"],"trying":["getting","going","having"]}},{"id":"grammar-0-4","title":"Part 5: I’m gonna + verb","notes":["gonna صيغة غير رسمية لـ going to، شائعة في المحادثة. استخدم going to في الكتابة الرسمية.","بعد gonna يأتي الفعل في صورته الأساسية. قد تعبر going to عن خطة أو نية أو توقع، وليس فقط المستقبل القريب."],"items":[{"en":"I’m gonna have some coffee.","ar":"أنا هشرب شوية قهوة.","type":"phrase","id":"en37"},{"en":"I’m gonna go to work.","ar":"أنا هروح الشغل.","type":"phrase","id":"en38"},{"en":"I’m gonna eat some cake.","ar":"أنا هاكل شوية كيك.","type":"phrase","id":"en39"},{"en":"I’m gonna send out my resume.","ar":"أنا هبعت سيرتي الذاتية.","type":"phrase","id":"en40"},{"en":"I’m gonna run a marathon.","ar":"أنا هجري في ماراثون.","type":"phrase","id":"en41"},{"en":"I’m gonna stop smoking.","ar":"أنا هبطل التدخين.","type":"phrase","id":"en42"}],"rules":["gonna = going to (غير رسمي، للكلام).","I’m gonna + فعل أساسي: I’m gonna have some coffee.","في الكتابة الرسمية اكتب going to."],"questions":[{"q":"gonna اختصار لإيه؟","options":["going to","want to","got to"],"answer":0,"explain":"gonna = going to. wanna = want to. gotta = got to."},{"q":"I’m gonna ___ some coffee.","options":["have","having","to have"],"answer":0,"explain":"بعد gonna فعل في صورته الأساسية."},{"q":"في إيميل رسمي تكتب إيه؟","options":["I am going to send my resume.","I’m gonna send my resume.","I gonna send my resume."],"answer":0,"explain":"gonna للكلام غير الرسمي فقط."}],"focus":{"gonna":["wanna","going","about"]}},{"id":"grammar-0-5","title":"Part 6: I wanna + verb","notes":["wanna صيغة غير رسمية لـ want to. بعدها فعل في صورته الأساسية.","نقول I wanna، وليس I’m wanna. استخدم want to في الكتابة الرسمية."],"items":[{"en":"I wanna talk.","ar":"أنا عايز أتكلم.","type":"phrase","id":"en43"},{"en":"I wanna search for a job.","ar":"أنا عايز أدور على وظيفة.","type":"phrase","id":"en44"},{"en":"I wanna order some food.","ar":"أنا عايز أطلب أكل.","type":"phrase","id":"en45"},{"en":"I wanna marry her.","ar":"أنا عايز أتجوزها.","type":"phrase","id":"en46"},{"en":"I wanna listen to that song.","ar":"أنا عايز أسمع الأغنية دي.","type":"phrase","id":"en47"}],"rules":["wanna = want to (غير رسمي).","نقول I wanna مش I’m wanna."],"questions":[{"q":"أي جملة صحيحة؟","options":["I wanna talk.","I’m wanna talk.","I wanna to talk."],"answer":0,"explain":"wanna فيها to بالفعل، ومن غير am."},{"q":"wanna اختصار لإيه؟","options":["want to","going to","want a"],"answer":0,"explain":"wanna = want to (وأحيانًا want a في الكلام)."},{"q":"I wanna ___ some food.","options":["order","ordering","to order"],"answer":0,"explain":"بعد wanna فعل أساسي."}],"focus":{"wanna":["gonna","want","about"]}},{"id":"grammar-0-6","title":"Part 10: I was about to + verb","notes":["كنت على وشك أن… فعل كان متوقعًا بعد لحظات في الماضي. بعد to يأتي الفعل في صورته الأساسية.","قد يمنع حدث آخر تنفيذ الفعل كما في الحوار، لكن التركيب وحده لا يؤكد أنه لم يحدث.","I’m about to: أنا على وشك الآن. I was about to: كنت على وشك في الماضي."],"items":[{"en":"I was about to go out.","ar":"كنت على وشك الخروج.","type":"phrase","id":"en48"},{"en":"I was about to go to bed.","ar":"كنت على وشك الذهاب للنوم.","type":"phrase","id":"en49"},{"en":"I was about to go to work.","ar":"كنت على وشك الذهاب للعمل.","type":"phrase","id":"en50"},{"en":"I was about to say the same thing.","ar":"كنت على وشك أقول نفس الكلام.","type":"phrase","id":"en51"},{"en":"I was about to call you.","ar":"كنت على وشك أتصل بيك.","type":"phrase","id":"en52"},{"en":"I was about to send you an email.","ar":"كنت على وشك أبعتلك إيميل.","type":"phrase","id":"en53"}],"rules":["I was about to = كنت على وشك (في الماضي).","I’m about to = أنا على وشك (دلوقتي).","بعد about to فعل في صورته الأساسية."],"questions":[{"q":"إيه معنى I was about to call you؟","options":["كنت على وشك أتصل بيك","اتصلت بيك عن الموضوع","كنت بتصل بيك كتير"],"answer":0,"explain":"about to = على وشك."},{"q":"دلوقتي حالًا هتخرج. تقول إيه؟","options":["I’m about to go out.","I was about to go out.","I was busy going out."],"answer":0,"explain":"I’m about to للحاضر؛ I was about to للماضي."},{"q":"I was about to ___ the same thing.","options":["say","saying","said"],"answer":0,"explain":"about to + base verb."}],"focus":{"about":["going","busy","trying"]}},{"id":"grammar-0-7","title":"الحوار","notes":[],"items":[{"en":"Adnan: Hi Mire. I need to ask you a favor.","ar":"أهلًا يا مير. محتاج أطلب منك خدمة.","type":"phrase","id":"en54"},{"en":"Mire: Hey Adnan. What do you need?","ar":"أهلًا يا عدنان. محتاج إيه؟","type":"phrase","id":"en55"},{"en":"Adnan: Can you drive me to the convenience store? My car is in the shop and we really need to get milk.","ar":"ممكن توصلني للبقالة؟ عربيتي في ورشة التصليح ومحتاجين نجيب لبن.","type":"phrase","id":"en56"},{"en":"Mire: Sure. I can do that.","ar":"أكيد، أقدر أعمل كده.","type":"phrase","id":"en57"},{"en":"Adnan: Were you in the middle of something? I don’t want to bother you.","ar":"كنت مشغول بحاجة؟ مش عايز أعطّلك.","type":"phrase","id":"en58"},{"en":"Mire: I was about to watch a movie, but that can wait.","ar":"كنت على وشك أتفرج على فيلم، بس ده ممكن يستنى.","type":"phrase","id":"en59"}]},{"id":"grammar-0-8","title":"Part 14: I was busy + verb-ing","notes":["كنت مشغولًا بـ… نستخدم busy ثم فعلًا بصيغة -ing لوصف النشاط في الماضي."],"items":[{"en":"I was busy thinking.","ar":"كنت مشغول بالتفكير.","type":"phrase","id":"en60"},{"en":"I was busy working.","ar":"كنت مشغول بالشغل.","type":"phrase","id":"en61"},{"en":"I was busy cooking dinner.","ar":"كنت مشغول بتحضير العشاء.","type":"phrase","id":"en62"},{"en":"I was busy talking on the phone.","ar":"كنت مشغول بالكلام في التليفون.","type":"phrase","id":"en63"},{"en":"I was busy cleaning the house.","ar":"كنت مشغول بتنظيف البيت.","type":"phrase","id":"en64"},{"en":"I was busy studying for my test.","ar":"كنت مشغول بالمذاكرة لامتحاني.","type":"phrase","id":"en65"}],"rules":["busy + verb-ing = مشغول بـ: I was busy cooking.","مانقولش busy to cook."],"questions":[{"q":"I was busy ___ dinner.","options":["cooking","to cook","cook"],"answer":0,"explain":"busy + verb-ing."},{"q":"أي جملة صحيحة؟","options":["I was busy studying for my test.","I was busy to study for my test.","I was busy study for my test."],"answer":0,"explain":"busy + verb-ing."}],"focus":{"busy":["about","trying","getting"]}},{"id":"grammar-0-9","title":"Part 15: I’m having a hard time + verb-ing","notes":["أنا أواجه صعوبة في… بعد hard time يأتي الفعل بصيغة -ing.","cell phone = هاتف محمول. ترجمة iPod في الصورة لا تطابق المثال الإنجليزي."],"items":[{"en":"I’m having a hard time writing.","ar":"أنا بواجه صعوبة في الكتابة.","type":"phrase","id":"en66"},{"en":"I’m having a hard time understanding you.","ar":"أنا بواجه صعوبة في فهمك.","type":"phrase","id":"en67"},{"en":"I’m having a hard time answering your question.","ar":"أنا بواجه صعوبة في الإجابة على سؤالك.","type":"phrase","id":"en68"},{"en":"I’m having a hard time downloading songs to my cell phone.","ar":"أنا بواجه صعوبة في تحميل أغاني على موبايلي.","type":"phrase","id":"en69"},{"en":"I’m having a hard time agreeing to the terms.","ar":"أنا بواجه صعوبة في الموافقة على الشروط.","type":"phrase","id":"en70"}],"rules":["have a hard time + verb-ing = بواجه صعوبة في.","I’m having a hard time understanding you = بلاقي صعوبة أفهمك."],"questions":[{"q":"I’m having a hard time ___ you.","options":["understanding","to understand","understand"],"answer":0,"explain":"hard time + verb-ing."},{"q":"إيه معنى I’m having a hard time writing؟","options":["بواجه صعوبة في الكتابة","بقضي وقت صعب بكتب","الكتابة بتاخد وقت"],"answer":0,"explain":"have a hard time doing = يواجه صعوبة في."}],"focus":{"hard":["busy","good","about"]}}]},{"id":"grammar-1","title":"استخدامات over","heading":"استخدامات over","intro":["معنى over بيتغير حسب التركيب والسياق. أمثلة المصدر موجودة مع التصحيح والبديل الطبيعي."],"sections":[{"id":"grammar-1-0","title":"استخدامات over","notes":[],"items":[{"en":"Be over.","ar":"يكون انتهى.","note":"over هنا صفة بمعنى منتهٍ. The game is over تحتاج the مع game. لانتهاء وقت محدد: Time is up.","example":"The game is over. Time is up.","exampleAr":"اللعبة خلصت. الوقت انتهى.","type":"phrase","id":"en71"},{"en":"Argue / fight / get divorced over something.","ar":"يتجادل / يتخانق / يتطلق بسبب شيء.","note":"over هنا بخصوص خلاف أو بسببه، مش بديل لكل because of.","example":"They got divorced over a stupid fight.","exampleAr":"اتطلقوا بسبب خناقة سخيفة.","type":"phrase","id":"en72"},{"en":"Over dinner.","ar":"أثناء العشاء.","note":"لعمل شيء خلال وجبة أو نشاط؛ مش شرط فوق سطح العشاء.","example":"Let’s talk over dinner.","exampleAr":"خلّينا نتكلم أثناء العشاء.","type":"phrase","id":"en73"},{"en":"Over + number.","ar":"أكثر من عدد معيّن.","note":"المصدر over two times مفهوم؛ more than twice أبسط.","example":"I called you more than twice. The trip took over two hours.","exampleAr":"اتصلت بيك أكتر من مرتين. الرحلة أخدت أكتر من ساعتين.","type":"phrase","id":"en74"},{"en":"Prefer A over B.","ar":"يفضّل أ على ب.","note":"صيغة مستخدمة، وكمان prefer A to B. لا نخلطها بـ prefer A than B.","example":"I prefer white over black. / I prefer white to black.","exampleAr":"بفضّل الأبيض على الأسود.","type":"phrase","id":"en75"},{"en":"Put something over something.","ar":"يضع شيئًا فوق شيء أو ليغطيه.","note":"السياق يحدد التغطية أو الموضع؛ put في الماضي بنفس الشكل.","example":"I put my hands over my ears.","exampleAr":"حطّيت إيدي على وداني.","type":"phrase","id":"en76"}],"rules":["be over = خلص/انتهى.","argue over = يتخانق بسبب/على.","over dinner = أثناء العشاء.","over + رقم = أكتر من.","prefer A over/to B (مش than)."],"questions":[{"q":"The game is ___.","options":["over","up","off"],"answer":0,"explain":"be over = انتهى."},{"q":"Let’s talk ___ dinner. (أثناء العشاء)","options":["over","on","above"],"answer":0,"explain":"over + وجبة = أثناء الوجبة."},{"q":"أي جملة صحيحة؟","options":["I prefer tea to coffee.","I prefer tea than coffee.","I prefer tea from coffee."],"answer":0,"explain":"prefer A to B أو prefer A over B. مانستخدمش than."},{"q":"The trip took over two hours. معنى over هنا:","options":["أكتر من","فوق","خلص"],"answer":0,"explain":"over + رقم = أكتر من."},{"q":"They argued ___ money. (اتخانقوا بسبب الفلوس)","options":["over","on","for"],"answer":0,"explain":"argue/fight over something = بسبب/على شيء."}]}]},{"id":"grammar-2","title":"قل ولا تقل - فروق الاستخدام","heading":"قل ولا تقل - فروق الاستخدام","intro":["عنوان المصدر لا يعني أن عمود «لا تقل» خطأ. معظم الجمل صحيحة؛ الاختيار حسب المعنى والموقف والنبرة."],"sections":[{"id":"grammar-2-0","title":"قل ولا تقل - فروق الاستخدام","notes":[],"items":[{"en":"I understand you.","alt":"I got you.","ar":"فاهمك.","note":"الاتنين صحيحين. I got you غير رسمية ومعناها حسب السياق: فهمتك أو هساعدك؛ I get it واضحة للفهم.","example":"I understand you. You need more time.","exampleAr":"فاهمك، إنت محتاج وقت أكتر.","type":"phrase","id":"en77"},{"en":"Bring me a coffee.","alt":"Get me a coffee, please.","ar":"هات لي قهوة لو سمحت.","note":"الاتنين صحيحين؛ bring تركيزها الإحضار وget قد تكون إحضار أو شراء. Could you…? ألطف من الأمر.","example":"Could you get me a coffee, please?","exampleAr":"ممكن تجيب لي قهوة لو سمحت؟","type":"phrase","id":"en78"},{"en":"He became sad.","alt":"He got sad.","ar":"هو حزن / بدأ يزعل.","note":"الاتنين صحيحين؛ got أكثر محادثة. get + صفة = يصبح في حالة معينة.","example":"He got sad when he heard the news.","exampleAr":"زعل لما سمع الخبر.","type":"phrase","id":"en79"},{"en":"I arrived home.","alt":"I got home.","ar":"وصلت البيت.","note":"الاتنين صحيحين؛ got شائعة في الكلام. home هنا من غير to.","example":"I got home at nine.","exampleAr":"وصلت البيت الساعة تسعة.","type":"phrase","id":"en80"},{"en":"Very beautiful.","alt":"Gorgeous.","ar":"جميل جدًا / رائع الجمال.","note":"very beautiful صحيحة؛ gorgeous صفة قوية وليست إلزامية.","example":"The view is gorgeous.","exampleAr":"المنظر جميل جدًا.","type":"phrase","id":"en81"},{"en":"Very bad.","alt":"Awful.","ar":"سيئ جدًا / فظيع.","note":"الاتنين صحيحين؛ awful تصف تجربة أو جودة سيئة جدًا حسب السياق.","example":"The traffic was awful this morning.","exampleAr":"الزحمة كانت فظيعة الصبح.","type":"phrase","id":"en82"},{"en":"Very clear.","alt":"Transparent.","ar":"واضح جدًا / شفاف.","note":"مش بدائل في كل سياق. transparent للشفافية المادية أو الوضوح والصراحة؛ شرح مفهوم: very clear أو crystal clear.","example":"Your explanation is very clear. The glass is transparent.","exampleAr":"شرحك واضح جدًا، والزجاج شفاف.","type":"phrase","id":"en83"},{"en":"Very angry.","alt":"Furious.","ar":"غضبان جدًا / في قمة الغضب.","note":"الاتنين صحيحين؛ furious أقوى. furious with someone / about something.","example":"She was furious about the delay.","exampleAr":"كانت غضبانة جدًا بسبب التأخير.","type":"phrase","id":"en84"},{"en":"Very good.","alt":"Superb.","ar":"ممتاز / رائع.","note":"الاتنين صحيحين؛ superb مدح قوي، مش لازم نستبدل بيها كل very good.","example":"You did a superb job.","exampleAr":"عملت شغل ممتاز.","type":"phrase","id":"en85"},{"en":"Very funny.","alt":"Hilarious.","ar":"مضحك جدًا.","note":"الاتنين صحيحين؛ hilarious لما الشيء يضحّك جدًا، مش funny بمعنى غريب.","example":"That video was hilarious.","exampleAr":"الفيديو ده كان مضحك جدًا.","type":"phrase","id":"en86"},{"en":"I don’t know.","alt":"I have no idea.","ar":"مش عارف / معنديش أي فكرة.","note":"الاتنين صحيحين؛ no idea بتؤكد عدم المعرفة.","example":"Where is he? I have no idea.","exampleAr":"هو فين؟ معنديش أي فكرة.","type":"phrase","id":"en87"},{"en":"You can trust me.","alt":"You can count on me.","ar":"تقدر تثق فيّا / تعتمد عليّا.","note":"trust = يثق في الصدق أو الأمانة؛ count on = يعتمد على الدعم أو تنفيذ شيء. المعنى مش متطابق دائمًا.","example":"You can count on me to finish the work.","exampleAr":"تقدر تعتمد عليّا إني أخلّص الشغل.","type":"phrase","id":"en88"},{"en":"Give it a try.","alt":"Give it a shot.","ar":"جرّبها / ادّيها فرصة.","note":"الاتنين صحيحين وبمعنى قريب؛ shot هنا محاولة وغير رسمية.","example":"I’ve never tried it, but I’ll give it a shot.","exampleAr":"مجرّبتهاش قبل كده، بس هجرّب.","type":"phrase","id":"en89"},{"en":"I like you.","alt":"I’m into you.","ar":"أنا معجب بيك.","note":"I like you قد تكون ودية؛ I’m into you غالبًا إعجاب عاطفي أو انجذاب، مش بديل عام.","example":"I’m into you, and I’d like to get to know you better.","exampleAr":"أنا معجب بيك وحابب أعرفك أكتر.","type":"phrase","id":"en90"},{"en":"I’m very happy.","alt":"I’m over the moon.","ar":"أنا فرحان جدًا / طاير من الفرحة.","note":"الاتنين صحيحين؛ over the moon تعبير مجازي عن فرحة شديدة.","example":"I got the job! I’m over the moon.","exampleAr":"اتقبلت في الشغل، أنا طاير من الفرحة!","type":"phrase","id":"en91"},{"en":"Can you help me?","alt":"Excuse me, could you give me a hand, please?","ar":"ممكن تساعدني لو سمحت؟","note":"الاتنين صحيحين؛ الصيغة الأطول ألطف. give someone a hand = يساعده في السياق ده.","example":"Could you give me a hand with these bags?","exampleAr":"ممكن تساعدني في الشنط دي؟","type":"phrase","id":"en92"},{"en":"I’ll pay for it.","alt":"It’s on me.","ar":"أنا هدفع / الحساب عليّا.","note":"الاتنين صحيحين؛ It’s on me في الدفع غالبًا دعوة على حسابك، وقد تعني المسؤولية في سياق آخر.","example":"Let’s get some coffee. It’s on me.","exampleAr":"تعالى نشرب قهوة، الحساب عليّا.","type":"phrase","id":"en93"},{"en":"Sit down.","alt":"Have a seat. / Take a seat.","ar":"اتفضّل اقعد.","note":"كلهم صحيح؛ Sit down أمر مباشر وقد يكون مناسبًا حسب النبرة. Have a seat دعوة ألطف.","example":"Please have a seat. I’ll be with you shortly.","exampleAr":"اتفضّل اقعد، هكون معاك بعد شوية.","type":"phrase","id":"en94"},{"en":"Buy / I bought a book.","alt":"Get / I got a book.","ar":"يشتري / حصلت على كتاب.","note":"get أوسع: يشتري أو يحصل على هدية مثلًا؛ مش بديل دائمًا. I bought يحدد إنك اشتريت. اتدمج صف get مع مثاله لتجنّب التكرار.","example":"I got a book for my birthday. I bought another one.","exampleAr":"جالي كتاب هدية عيد ميلادي، واشتريت واحد تاني.","type":"phrase","id":"en95"}],"rules":["أغلب الصيغتين صح؛ الفرق في الرسمية والقوة والسياق.","get + صفة = يصبح (got sad). got home من غير to."],"questions":[{"q":"I got ___ at nine. (وصلت البيت)","options":["home","to home","at home"],"answer":0,"explain":"مع home بعد get/arrive/go مانستخدمش to."},{"q":"أقوى بديل لـ very funny:","options":["hilarious","funnier","funnily"],"answer":0,"explain":"hilarious = مضحك جدًا."},{"q":"أقوى بديل لـ very angry:","options":["furious","angrily","upset"],"answer":0,"explain":"furious = غضبان جدًا."},{"q":"It’s on me في المطعم معناها:","options":["الحساب عليّا","ده فوقي","ده ذنبي دايمًا"],"answer":0,"explain":"It’s on me = أنا اللي هدفع."},{"q":"أي صيغة ألطف لدعوة حد يقعد؟","options":["Have a seat.","Sit down!","Seat you."],"answer":0,"explain":"Have a seat دعوة لطيفة؛ Sit down ممكن تبان أمر."}]}]}]},{"id":"expressions","title":"تعبيرات ومصطلحات","desc":"تعبيرات يومية ومصطلحات وطرق التعبير عن المشاعر","lessons":[{"id":"expressions-0","title":"جمل مختلفة","heading":"Chapter 37: Different sentences — جمل مختلفة","intro":[],"sections":[{"id":"expressions-0-0","title":"1. Certainty and probability — اليقين والاحتمال","notes":["الجمل التي تنتهي بـ that… تحتاج تكملة تشرح ما أنت متأكد منه أو تتوقعه.","Chances are that… وOdds are that…: من المحتمل حدوث ذلك.","I wouldn’t bet on it: قد يحدث، لكنني لا أتوقعه. ليست بالضرورة مراهنة فعلية."],"items":[{"en":"I’m absolutely sure.","ar":"أنا متأكد تمامًا.","type":"phrase","id":"en96"},{"en":"I’m positive that…","ar":"أنا متأكد أن…","note":"positive هنا تعني متأكد، وليس إيجابي.","type":"phrase","id":"en97"},{"en":"I have no doubt that…","ar":"ليس عندي شك أن…","type":"phrase","id":"en98"},{"en":"I’m a hundred percent certain.","ar":"أنا متأكد بنسبة مئة بالمئة.","type":"phrase","id":"en99"},{"en":"I’m convinced that…","ar":"أنا مقتنع تمامًا أن…","type":"phrase","id":"en100"},{"en":"Chances are that…","ar":"غالبًا / من المحتمل أن…","type":"phrase","id":"en101"},{"en":"Odds are that…","ar":"غالبًا / من المحتمل أن…","type":"phrase","id":"en102"},{"en":"I seriously doubt it.","ar":"أنا أشك في ده بشدة.","note":"نبرة شك قوية.","type":"phrase","id":"en103"},{"en":"I don’t think so.","ar":"مش أعتقد كده.","type":"phrase","id":"en104"},{"en":"Probably not.","ar":"غالبًا لأ.","type":"phrase","id":"en105"},{"en":"It’s not very likely.","ar":"مش مرجّح أوي.","type":"phrase","id":"en106"},{"en":"There’s not much chance of that.","ar":"احتمال حدوث ده مش كبير.","type":"phrase","id":"en107"},{"en":"I’d be very surprised if that happened.","ar":"هستغرب جدًا لو ده حصل.","note":"توقع ضعيف.","type":"phrase","id":"en108"},{"en":"I wouldn’t bet on it.","ar":"مش هعوّل على حدوثه.","type":"phrase","id":"en109"},{"en":"That’ll never happen.","ar":"ده مش هيحصل أبدًا.","note":"تأكيد قوي جدًا.","type":"phrase","id":"en110"}],"rules":[],"questions":[{"q":"I’m positive that… معناها:","options":["أنا متأكد إن…","أنا إيجابي إن…","أنا متفائل إن…"],"answer":0,"explain":"positive هنا = متأكد."},{"q":"أي تعبير معناه «غالبًا هيحصل»؟","options":["Chances are that…","I seriously doubt it.","I wouldn’t bet on it."],"answer":0,"explain":"Chances are / Odds are = من المحتمل."},{"q":"I wouldn’t bet on it معناها:","options":["مش متوقع إنه يحصل","مش بحب المراهنة","أكيد هيحصل"],"answer":0,"explain":"تعبير عن توقع ضعيف، مش مراهنة فعلية."}]},{"id":"expressions-0-1","title":"2. Interesting / boring — ممتع / ممل","notes":["I couldn’t put it down تستخدم خصوصًا مع كتاب مشوّق جدًا: لم أستطع التوقف عن قراءته.","bored to tears / bored to death / dying of boredom: مبالغة للتعبير عن الملل الشديد."],"items":[{"en":"It’s fascinating.","ar":"ده شيّق / مدهش جدًا.","type":"phrase","id":"en111"},{"en":"It’s intriguing.","ar":"ده مثير للاهتمام والفضول.","type":"phrase","id":"en112"},{"en":"I couldn’t tear myself away.","ar":"ماقدرتش أبعد عنه أو أسيبه.","note":"كان جذابًا جدًا.","type":"phrase","id":"en113"},{"en":"I couldn’t put it down.","ar":"ماقدرتش أسيب الكتاب.","note":"للحديث عن كتاب مشوّق.","type":"phrase","id":"en114"},{"en":"I was so into it, I lost track of time.","ar":"اندمجت فيه لدرجة نسيت الوقت.","note":"into it = مهتم أو مندمج فيه.","type":"phrase","id":"en115"},{"en":"It does nothing for me.","ar":"مش بيشدّني / مش بيعجبني.","note":"رأي شخصي مباشر.","type":"phrase","id":"en116"},{"en":"I was bored to tears.","ar":"كنت زهقان جدًا.","note":"مبالغة.","type":"phrase","id":"en117"},{"en":"I was bored to death.","ar":"كنت زهقان جدًا جدًا.","note":"مبالغة.","type":"phrase","id":"en118"},{"en":"I was dying of boredom.","ar":"كنت هموت من الزهق.","note":"مبالغة.","type":"phrase","id":"en119"},{"en":"It’s about as exciting as watching paint dry.","ar":"ممل جدًا، زي متابعة دهان وهو بينشف.","note":"سخرية؛ ليست مدحًا.","type":"phrase","id":"en120"}]},{"id":"expressions-0-2","title":"3. Cheering someone up — المواساة والتشجيع","notes":["You look a bit down: تبدو حزينًا قليلًا.","It’s not the end of the world تستخدم لمشكلة صغيرة نسبيًا. لا تقلّل من مشاعر الشخص في موقف مؤلم."],"items":[{"en":"What’s the matter?","ar":"إيه المشكلة؟ / مالك؟","type":"phrase","id":"en121"},{"en":"What’s wrong?","ar":"مالك؟ / إيه اللي حصل؟","type":"phrase","id":"en122"},{"en":"Are you all right?","ar":"إنت بخير؟","type":"phrase","id":"en123"},{"en":"You look a bit down.","ar":"شكلك زعلان شوية.","note":"down = حزين هنا.","type":"phrase","id":"en124"},{"en":"Is there anything I can do to help?","ar":"في حاجة أقدر أعملها عشان أساعد؟","type":"phrase","id":"en125"},{"en":"Cheer up! / Chin up!","ar":"ارفع معنوياتك! / شد حيلك!","note":"قد تبدو مستخفّة بالمشاعر حسب الموقف.","type":"phrase","id":"en126"},{"en":"It’s not so bad.","ar":"الموضوع مش بالسوء ده.","note":"قد تقلّل من مشاعر الشخص حسب النبرة.","type":"phrase","id":"en127"},{"en":"Everything will be OK.","ar":"كل حاجة هتبقى كويسة.","note":"لطمأنة الشخص.","type":"phrase","id":"en128"},{"en":"Look on the bright side.","ar":"بص للجانب الإيجابي.","type":"phrase","id":"en129"},{"en":"It’s not the end of the world.","ar":"مش نهاية الدنيا.","note":"لمشكلة صغيرة نسبيًا.","type":"phrase","id":"en130"}]},{"id":"expressions-0-3","title":"4. Disappointment — خيبة الأمل","notes":["What a shame هنا تعني يا خسارة، ولا تعني إهانة الشخص أو وصفه بالعار.","Bummer تعبير غير رسمي. letdown = خيبة أمل."],"items":[{"en":"What a pity!","ar":"يا خسارة! / يا للأسف!","type":"phrase","id":"en131"},{"en":"What a shame.","ar":"يا خسارة.","type":"phrase","id":"en132"},{"en":"How disappointing.","ar":"ده مخيّب للآمال.","type":"phrase","id":"en133"},{"en":"That’s too bad.","ar":"يا خسارة / ده شيء مؤسف.","type":"phrase","id":"en134"},{"en":"Bummer.","ar":"يا خسارة / حاجة تضايق.","note":"غير رسمي.","type":"phrase","id":"en135"},{"en":"It was a real letdown.","ar":"كانت خيبة أمل حقيقية.","type":"phrase","id":"en136"},{"en":"It didn’t live up to my expectations.","ar":"ماكانش قد توقعاتي.","type":"phrase","id":"en137"}],"rules":[],"questions":[{"q":"What a shame معناها:","options":["يا خسارة","يا عيب عليك","يا للعار"],"answer":0,"explain":"What a shame = What a pity = يا خسارة."},{"q":"It didn’t live up to my expectations معناها:","options":["ماكانش قد توقعاتي","عاش أكتر من توقعاتي","توقعته بالظبط"],"answer":0,"explain":"live up to = يكون على قدر."}]},{"id":"expressions-0-4","title":"5. Describing speaking — وصف طريقة الكلام","notes":["chatted: تحدثنا بشكل غير رسمي. whined: اشتكى بنبرة متذمرة.","mumbled: تكلم بصوت منخفض وكلمات غير واضحة. muttered: قال شيئًا بصوت منخفض، غالبًا شكوى أو تعليقًا سلبيًا.","rambled: تكلم طويلًا دون تنظيم واضح. went on and on: استمر في الكلام كثيرًا."],"items":[{"en":"He yelled.","ar":"هو زعق / صاح.","type":"phrase","id":"en138"},{"en":"She screamed.","ar":"هي صرخت.","type":"phrase","id":"en139"},{"en":"I whispered.","ar":"أنا همست.","type":"phrase","id":"en140"},{"en":"We chatted.","ar":"إحنا دردشنا.","type":"phrase","id":"en141"},{"en":"He mumbled.","ar":"هو تمتم بكلام مش واضح.","type":"phrase","id":"en142"},{"en":"My kids whined.","ar":"أولادي اتذمّروا / زنّوا.","type":"phrase","id":"en143"},{"en":"He rambled. / He went on and on.","ar":"فضل يتكلم كتير / يسترسل.","note":"ramble يضيف معنى عدم التنظيم أو الابتعاد عن الموضوع.","type":"phrase","id":"en144"},{"en":"She stammered.","ar":"هي اتلعثمت.","type":"phrase","id":"en145"},{"en":"I snapped at my husband.","ar":"ردّيت على جوزي بعصبية.","note":"snapped at = تكلم بعصبية وبحدة، وليس ضرب.","type":"phrase","id":"en146"},{"en":"He muttered.","ar":"هو تمتم بصوت واطي.","note":"غالبًا تعليق سلبي أو شكوى.","type":"phrase","id":"en147"}],"rules":[],"questions":[{"q":"اتكلم بصوت واطي وكلام مش واضح:","options":["mumbled","yelled","chatted"],"answer":0,"explain":"mumble = يتمتم بكلام مش واضح."},{"q":"فضل يتكلم كتير من غير تنظيم:","options":["rambled","whispered","screamed"],"answer":0,"explain":"ramble / go on and on."},{"q":"I snapped at my husband معناها:","options":["رديت عليه بعصبية","ضربته","صورته"],"answer":0,"explain":"snap at = يتكلم بحدة وعصبية."}]}]},{"id":"expressions-1","title":"مصطلحات","heading":"Chapter 38: Idioms — مصطلحات","intro":[],"sections":[{"id":"expressions-1-0","title":"التعبيرات المختارة وصيغها الصحيحة","notes":["المعنى هنا هو الاستخدام الإنجليزي. بعض الترجمات العامية في الكتاب ليست مطابقة حرفيًا.","الصيغ المكتوبة خطأ والتعبيرات الأقل أولوية محفوظة في صفحة «جمل أقل أولوية» مع البدائل."],"items":[{"en":"Lose the long face.","ar":"فك التكشيرة / بلاش الوش الحزين.","note":"غير رسمي؛ قد يبدو آمرًا.","type":"phrase","id":"en148"},{"en":"Catchy phrases.","ar":"عبارات جذابة وسهلة التذكر.","note":"ليست مرادفًا دقيقًا لكلمة إفيهات في كل سياق.","type":"phrase","id":"en149"},{"en":"Sleepyhead!","ar":"يا نعسان! / يا محب النوم!","note":"مزاح لطيف مع شخص تعرفه.","type":"phrase","id":"en150"},{"en":"Don’t rub salt in the wound.","ar":"متزودش وجعي أو تضايقني أكتر.","note":"الصيغة المعتادة بدل التعبير في الصورة.","type":"phrase","id":"en151"},{"en":"You have given us a fright.","ar":"إنت خوّفتنا / فزّعتنا.","note":"لا تعني كسرت مفاصلنا حرفيًا.","type":"phrase","id":"en152"},{"en":"Only a stone’s throw.","ar":"قريب جدًا / على بُعد خطوات.","note":"تعبير عن قرب المسافة.","type":"phrase","id":"en153"},{"en":"Hold your horses!","ar":"استنى شوية / على مهلك.","note":"غير رسمي.","type":"phrase","id":"en154"},{"en":"I got you into a jam.","ar":"أنا ورّطتك / سببت لك مشكلة.","note":"jam هنا = مأزق.","type":"phrase","id":"en155"},{"en":"It serves me right.","ar":"أنا أستاهل اللي حصل لي.","note":"نتيجة خطأ ارتكبته أنا.","type":"phrase","id":"en156"},{"en":"You can bet your bottom dollar.","ar":"تقدر تكون متأكد جدًا.","note":"مجاز عن اليقين، وليس تعليمات للمراهنة.","type":"phrase","id":"en157"},{"en":"You have come at the right time.","ar":"إنت جيت في الوقت المناسب.","type":"phrase","id":"en158"},{"en":"You scratch my back and I’ll scratch yours.","ar":"ساعدني وأنا أساعدك.","note":"تبادل مصالح أو خدمات؛ قد توحي بمحاباة حسب الموقف.","type":"phrase","id":"en159"},{"en":"Workaholic.","ar":"شخص مدمن شغل.","note":"لا تعني حمارًا حرفيًا.","type":"phrase","id":"en160"},{"en":"What a start to the day!","ar":"يا لها من بداية لليوم!","note":"قد تقال بسخرية أو فرح حسب الموقف.","type":"phrase","id":"en161"},{"en":"What’s the rush?","ar":"مستعجل ليه؟","note":"صحّحنا what is إلى الاختصار الطبيعي What’s، والمعنى كما هو.","type":"phrase","id":"en162"},{"en":"Walls have ears.","ar":"الحيطان لها ودان.","note":"قد يسمع كلامك أشخاص آخرون.","type":"phrase","id":"en163"},{"en":"Waste one’s breath.","ar":"يضيع وقته في كلام بلا نتيجة.","note":"one’s تتغير إلى my / your / his حسب الشخص.","type":"phrase","id":"en164"},{"en":"There is always a next time.","ar":"في دايمًا فرصة تانية.","type":"phrase","id":"en165"},{"en":"There is always a way.","ar":"في دايمًا طريقة / حل.","type":"phrase","id":"en166"},{"en":"The sooner, the better.","ar":"كل ما يكون بدري، يكون أحسن.","type":"phrase","id":"en167"},{"en":"So much the better.","ar":"ده أحسن كمان.","type":"phrase","id":"en168"},{"en":"Give me a break.","ar":"بلاش كده / اديني فرصة / سيبني شوية.","note":"قد تعني عدم التصديق أو الضيق أو طلب راحة حسب النبرة.","type":"phrase","id":"en169"},{"en":"Shake a leg!","ar":"استعجل / يلا أسرع.","note":"غير رسمي؛ لا تعني تشارك رجلًا.","type":"phrase","id":"en170"},{"en":"Dressed to the nines.","ar":"لابس بأناقة شديدة.","type":"phrase","id":"en171"},{"en":"He was dressed to the nines at yesterday’s wedding.","ar":"كان لابس شيك جدًا في فرح امبارح.","note":"مثال على dressed to the nines.","type":"phrase","id":"en172"},{"en":"When the cat is away, the mice play.","ar":"لما القط يغيب، الفيران تلعب.","note":"غياب الرقابة يجعل الآخرين يتصرفون بحرية.","type":"phrase","id":"en173"},{"en":"This is just hot air.","ar":"ده مجرد كلام فارغ.","note":"تعبير نقدي مباشر.","type":"phrase","id":"en174"},{"en":"A blessing in disguise.","ar":"حاجة بدت سيئة وبعدين طلعت خير.","note":"ليست نعمة تبدو كأنها نعمة؛ العكس هو المقصود.","type":"phrase","id":"en175"},{"en":"Don’t judge a book by its cover.","ar":"متحكمش على حد أو حاجة من المظهر.","type":"phrase","id":"en176"},{"en":"Don’t cry over spilled milk.","ar":"متزعلش على حاجة حصلت ومش هتتغيّر.","note":"spilled أمريكية؛ spilt شائعة في البريطانية. قد تبدو تقليلًا من المشاعر.","type":"phrase","id":"en177"},{"en":"Easier said than done.","ar":"الكلام أسهل من التنفيذ.","type":"phrase","id":"en178"},{"en":"Nothing more, and nothing less.","ar":"لا أكثر ولا أقل.","type":"phrase","id":"en179"},{"en":"He’s full of himself.","ar":"شايف نفسه أوي / مغرور.","note":"انتقاد مباشر لشخص.","type":"phrase","id":"en180"},{"en":"Don’t cross the line.","ar":"متتعدّاش الحدود.","note":"وضع حدود مقبولة للسلوك.","type":"phrase","id":"en181"},{"en":"You’ve crossed the line.","ar":"إنت اتعدّيت الحدود.","note":"اعتراض مباشر على السلوك.","type":"phrase","id":"en182"}]},{"id":"expressions-1-1","title":"مصطلحات إضافية — الأجزاء 3 و4","notes":[],"items":[{"en":"I rest my case.","ar":"وده يثبت كلامي / مش محتاج أضيف أكتر.","note":"جزء 3: تقال لما تعتقد إن حجتك ثبتت، أحيانًا بسخرية. مش مجرد قلت اللي عندي.\nمثال: He was late again. I rest my case.\nاتأخر تاني، وده يثبت كلامي.","type":"phrase","id":"en183"},{"en":"Cut me some slack.","ar":"خفّ عليّا / اتساهل معايا شوية.","note":"جزء 3: طلب تقليل النقد أو التوقعات، مش طلب راحة جسدية حرفيًا.\nمثال: Cut me some slack. It’s my first week.\nخفّ عليّا، ده أول أسبوع ليّا.","type":"phrase","id":"en184"},{"en":"What’s done is done.","ar":"اللي حصل حصل.","note":"جزء 3 و4: اتكررت فاتضافت مرة واحدة. قبول إن الماضي مش هيتغيّر؛ قد تبدو تقليلًا من المشاعر.\nمثال: What’s done is done. Let’s focus on the next step.\nاللي حصل حصل، خلّينا نركز على الخطوة الجاية.","type":"phrase","id":"en185"},{"en":"We go way back.","ar":"إحنا نعرف بعض من زمان أوي.","note":"جزء 3: علاقة أو معرفة قديمة.\nمثال: We go way back. We met at school.\nنعرف بعض من زمان، اتقابلنا في المدرسة.","type":"phrase","id":"en186"},{"en":"Speak of the devil!","ar":"لسه كنا بنتكلم عنك!","note":"جزء 3: تقال عند ظهور شخص كنا بنتكلم عنه؛ مش اسم لأي شيء بيظهر، ولا شتيمة حرفية. مزاح بين المعارف.\nمثال: Speak of the devil! We were just talking about you.\nلسه كنا بنتكلم عنك، أهو إنت جيت!","type":"phrase","id":"en187"},{"en":"Give someone the cold shoulder.","ar":"يتجاهل شخص عمدًا أو يعامله ببرود.","note":"جزء 3: someone تتبدّل بالشخص؛ التجاهل مقصود.\nمثال: She gave me the cold shoulder after our argument.\nعاملتني ببرود بعد خناقتنا.","type":"phrase","id":"en188"},{"en":"Miss the boat.","ar":"يفوّت الفرصة.","note":"جزء 3: فرصة لم تستغل في وقتها؛ مش شرط قارب حقيقي.\nمثال: Apply today so you don’t miss the boat.\nقدّم النهارده عشان متفوّتش الفرصة.","type":"phrase","id":"en189"},{"en":"Bark up the wrong tree.","ar":"يدور في الاتجاه الغلط / يتهم الشخص الغلط.","note":"جزء 3: أوسع من طلب حاجة من الشخص الغلط؛ خطأ في الظن أو الحل أو الاتهام.\nمثال: If you think I took your phone, you’re barking up the wrong tree.\nلو فاكر إني أخدت تليفونك، إنت بتتهم الشخص الغلط.","type":"phrase","id":"en190"},{"en":"Add insult to injury.","ar":"يزوّد الطين بلّة.","note":"جزء 3: يضيف إساءة أو ضررًا لموقف سيئ بالفعل.\nمثال: The order was late, and to add insult to injury, it was damaged.\nالطلب اتأخر، وفوق ده وصل متضرر.","type":"phrase","id":"en191"},{"en":"Mark my words.","ar":"افتكر كلامي.","note":"جزء 3: تصحيح word إلى words. تأكيد قوي لتوقع أو تحذير؛ قد يبدو حادًا.\nمثال: Mark my words: this will take longer than you think.\nافتكر كلامي: ده هياخد وقت أطول مما تتصور.","type":"phrase","id":"en192"},{"en":"I’m all ears.","ar":"كلي آذان صاغية / سامعك باهتمام.","note":"جزء 4: I’m listening صحيحة؛ التعبير يضيف اهتمامًا واستعدادًا للسماع.\nمثال: Tell me your idea. I’m all ears.\nاحكي لي فكرتك، سامعك باهتمام.","type":"phrase","id":"en193"},{"en":"I’ll sleep on it.","ar":"هفكر فيه وأرد بعد ما آخد وقتي.","note":"جزء 4: تأجيل القرار غالبًا لليوم التالي؛ أخص من I’ll think about it.\nمثال: It’s a big decision. I’ll sleep on it.\nده قرار كبير، هفكر فيه لحد بكرة.","type":"phrase","id":"en194"},{"en":"Practice makes perfect.","ar":"الممارسة بتخلّيك تتحسن وتتقن.","note":"جزء 4: مثل للتشجيع على التدريب؛ مش ضمان للكمال الحرفي.\nمثال: Keep practicing your English. Practice makes perfect.\nكمّل تدريب على الإنجليزي، الممارسة بتحسّن مستواك.","type":"phrase","id":"en195"},{"en":"Less is more.","ar":"البساطة أحيانًا بتدي نتيجة أحسن.","note":"جزء 4: القليل المختار بعناية قد يكون أكثر تأثيرًا؛ مش قاعدة إن الأقل دائمًا أفضل.\nمثال: Use fewer colors in the design. Less is more.\nاستخدم ألوان أقل في التصميم، البساطة أحسن هنا.","type":"phrase","id":"en196"},{"en":"Two peas in a pod.","ar":"شبه بعض جدًا / فولة واتقسمت نصين.","note":"جزء 4: لتشابه شخصين في الشكل أو الطباع؛ مش نصفين حرفيين.\nمثال: Those two friends are like two peas in a pod.\nالصاحبين دول شبه بعض جدًا.","type":"phrase","id":"en197"},{"en":"He’s a carbon copy of…","ar":"هو نسخة طبق الأصل من…","note":"جزء 4: لازم نكمل of بالشخص أو الشيء؛ تشابه شديد، مش شرط بين اتنين بس.\nمثال: He’s a carbon copy of his father.\nهو نسخة طبق الأصل من أبوه.","type":"phrase","id":"en198"},{"en":"The bottom line is…","ar":"الخلاصة / أهم نقطة هي…","note":"جزء 4: صيغة طبيعية لتلخيص النتيجة. مثال المصدر بنبرة مطالبة حادة، مش لازم تحفظه.\nمثال: The bottom line is that we need more time.\nالخلاصة إننا محتاجين وقت أكتر.","type":"phrase","id":"en199"},{"en":"Talk is cheap.","ar":"الكلام سهل؛ العبرة بالفعل.","note":"جزء 4: انتقاد للوعود من غير تنفيذ، مش مجرد وصف إن الكلام سهل.\nمثال: Talk is cheap. Show me what you can do.\nالكلام سهل، وريني تقدر تعمل إيه.","type":"phrase","id":"en200"}]}]},{"id":"expressions-2","title":"تعبيرات يومية 1","heading":"تعبيرات يومية 1","intro":["تعبيرات عامة: المعنى والاستخدام مع مثال مترجم. الصيغ غير المناسبة لكل موقف في صفحة «جمل أقل أولوية»."],"sections":[{"id":"expressions-2-0","title":"تعبيرات يومية 1","notes":[],"items":[{"en":"Don’t laugh at me.","ar":"متضحكش عليّا.","note":"laugh at someone = يضحك عليه أو يسخر منه؛ النبرة تحدد المقصود.","example":"Don’t laugh at me. I’m still learning.","exampleAr":"متضحكش عليّا، أنا لسه بتعلم.","type":"phrase","id":"en201"},{"en":"I’m a light sleeper.","ar":"نومي خفيف.","note":"الشخص اللي بيصحى بسهولة بسبب صوت أو حركة.","example":"Please keep your voice down. I’m a light sleeper.","exampleAr":"وطّي صوتك لو سمحت؛ نومي خفيف.","type":"phrase","id":"en202"},{"en":"Don’t threaten me.","ar":"متهددنيش.","note":"اعتراض مباشر على التهديد؛ مش طلب عادي.","example":"Don’t threaten me. Let’s talk calmly.","exampleAr":"متهددنيش، خلّينا نتكلم بهدوء.","type":"phrase","id":"en203"},{"en":"You’re one of a kind.","ar":"إنت مفيش زيك / شخص مميز.","note":"تصحيح المصدر: one of a kind، ولازم a. غالبًا مجاملة.","example":"You’re one of a kind. Thank you for your help.","exampleAr":"إنت مفيش زيك، شكرًا لمساعدتك.","type":"phrase","id":"en204"},{"en":"That remains to be seen.","ar":"لسه هنشوف / الأمر لسه مش محسوم.","note":"لما نتيجة أو ادعاء لسه محتاج وقت عشان يتأكد.","example":"Will the plan work? That remains to be seen.","exampleAr":"هل الخطة هتنجح؟ لسه هنشوف.","type":"phrase","id":"en205"},{"en":"A pep talk.","ar":"كلام تشجيعي يرفع المعنويات.","note":"اسم معدود؛ give someone a pep talk = يشجعه بكلام.","example":"My friend gave me a pep talk before the interview.","exampleAr":"صاحبي شجّعني قبل المقابلة.","type":"phrase","id":"en206"},{"en":"I smell a rat.","ar":"حاسس إن فيه حاجة مش مظبوطة.","note":"تعبير مجازي عن الشك في خداع أو تصرف مريب، مش أي شك عام.","example":"The offer looks too good. I smell a rat.","exampleAr":"العرض مغري بزيادة، حاسس إن فيه حاجة مش مظبوطة.","type":"phrase","id":"en207"},{"en":"I’m speechless.","ar":"مش لاقي كلام / عاجز عن التعبير.","note":"من فرحة أو صدمة أو مفاجأة؛ مش معناها بالضرورة زعلان.","example":"You did all this for me? I’m speechless.","exampleAr":"عملت كل ده عشاني؟ مش لاقي كلام.","type":"phrase","id":"en208"},{"en":"Your reputation precedes you.","ar":"سمعتك سبقاك.","note":"سمعنا عنك قبل ما نقابلك؛ قد تكون مدحًا أو نقدًا حسب السياق. رسمية نسبيًا.","example":"I’ve heard about your work. Your reputation precedes you.","exampleAr":"سمعت عن شغلك، سمعتك سبقاك.","type":"phrase","id":"en209"},{"en":"That’s a given.","ar":"ده أمر مفروغ منه.","note":"حاجة محسومة أو متفق عليها، مش محتاجة إثبات جديد.","example":"We need to meet the deadline. That’s a given.","exampleAr":"لازم نسلّم في الموعد، ده أمر مفروغ منه.","type":"phrase","id":"en210"},{"en":"Go easy on him.","ar":"اتساهل معاه / خفّ عليه.","note":"طلب إن النقد أو المعاملة ما يكونوش قاسيين.","example":"Go easy on him. It’s his first day.","exampleAr":"خفّ عليه، ده أول يوم ليه.","type":"phrase","id":"en211"},{"en":"Water under the bridge.","ar":"حاجة حصلت وعدّت.","note":"لمشكلة قديمة لم تعد مهمة أو انتهى الخلاف عليها.","example":"Don’t worry about our argument. It’s water under the bridge.","exampleAr":"متشغلش بالك بخناقتنا، خلاص عدّت.","type":"phrase","id":"en212"},{"en":"Totally phony.","ar":"مزيف تمامًا / غير صادق بالمرة.","note":"phony = غير حقيقي أو متصنّع؛ مش ترجمة عامة لكاذب جدًا.","example":"That smile looks totally phony.","exampleAr":"الابتسامة دي باينة متصنّعة تمامًا.","type":"phrase","id":"en213"},{"en":"Why didn’t you say so?","ar":"ما قلتش كده من الأول ليه؟","note":"رد بعد معلومة جديدة؛ النبرة قد تكون مستغربة أو ودودة.","example":"You need a ride? Why didn’t you say so?","exampleAr":"محتاج توصيلة؟ ما قلتش من الأول ليه؟","type":"phrase","id":"en214"},{"en":"It’s a bargain.","ar":"سعره لقطة / صفقة بسعر ممتاز.","note":"معناها سعر مناسب جدًا لقيمة الشيء؛ مش لازم عرض لفترة محدودة.","example":"This jacket was only 50 dirhams. It’s a bargain.","exampleAr":"الجاكيت ده بخمسين درهم بس، سعره لقطة.","type":"phrase","id":"en215"},{"en":"Let me clue you in.","ar":"خلّيني أقولك التفاصيل / أفهّمك الموضوع.","note":"غير رسمي؛ clue someone in on something. قد يبدو متعاليًا حسب النبرة.","example":"Let me clue you in on the plan.","exampleAr":"خلّيني أقولك تفاصيل الخطة.","type":"phrase","id":"en216"},{"en":"Delighted to have you.","ar":"سعداء بوجودك معانا.","note":"ترحيب بضيف أو عضو جديد؛ مش مرادف مباشر لسعدت بلقائك: Delighted to meet you.","example":"We’re delighted to have you on the team.","exampleAr":"إحنا سعداء بانضمامك للفريق.","type":"phrase","id":"en217"}]}]},{"id":"expressions-3","title":"تعبيرات يومية 2-4","heading":"تعبيرات يومية 2-4","intro":["التعبيرات العامة من الأجزاء 2 و3 و4. المصطلحات المجازية في صفحة «مصطلحات»، والأقل أولوية في صفحتها."],"sections":[{"id":"expressions-3-0","title":"تعبيرات يومية 2-4","notes":[],"items":[{"en":"It’s a nice gesture.","ar":"دي لفتة جميلة.","note":"جزء 2: gesture هنا تصرف لطيف أو رمزي، مش مجرد حركة إيد.","example":"Sending her flowers was a nice gesture.","exampleAr":"إنك تبعت لها ورد كان لفتة جميلة.","type":"phrase","id":"en218"},{"en":"I’m stuffed.","ar":"شبعت جدًا / بطني مليانة.","note":"جزء 2: غير رسمي بعد الأكل؛ مش تعبير رسمي عن الشبع.","example":"No dessert for me, thanks. I’m stuffed.","exampleAr":"مش هاخد حلو، شكرًا. أنا شبعت جدًا.","type":"phrase","id":"en219"},{"en":"Things are looking up.","ar":"الأمور بدأت تتحسن.","note":"جزء 2: looking up هنا التحسن، مش النظر لفوق.","example":"I found a new job. Things are looking up.","exampleAr":"لقيت شغل جديد، والأمور بدأت تتحسن.","type":"phrase","id":"en220"},{"en":"Don’t generalize.","ar":"متعمّمش.","note":"جزء 2: اعتراض على حكم عام مبني على حالات قليلة؛ قد تبدو مباشرة.","example":"One bad experience doesn’t mean everyone is the same. Don’t generalize.","exampleAr":"تجربة وحشة واحدة مش معناها إن كل الناس زي بعض، متعمّمش.","type":"phrase","id":"en221"},{"en":"What a mess!","ar":"يا لها من فوضى! / إيه اللخبطة دي!","note":"جزء 2: لمكان غير مرتب أو موقف ملخبط.","example":"Look at this room. What a mess!","exampleAr":"بص على الأوضة، إيه الفوضى دي!","type":"phrase","id":"en222"},{"en":"Take your time.","ar":"خد وقتك / براحتك.","note":"جزء 2: مفيش استعجال؛ مش معناها إضاعة الوقت.","example":"Take your time. There’s no rush.","exampleAr":"خد وقتك، مفيش استعجال.","type":"phrase","id":"en223"},{"en":"You deserve it.","ar":"إنت تستاهل ده.","note":"جزء 2: مدح أو نتيجة سلبية حسب السياق والنبرة.","example":"Congratulations on your promotion. You deserve it.","exampleAr":"مبروك الترقية، إنت تستاهلها.","type":"phrase","id":"en224"},{"en":"By all means.","ar":"أكيد / اتفضل طبعًا.","note":"جزء 2: موافقة على طلب أو إذن؛ مش بديل أكيد في كل سياق.","example":"May I use this chair? — By all means.","exampleAr":"ممكن أستخدم الكرسي ده؟ — أكيد اتفضل.","type":"phrase","id":"en225"},{"en":"By the way,…","ar":"بالمناسبة / على فكرة…","note":"جزء 2: لإضافة معلومة جانبية أو تغيير الموضوع.","example":"By the way, the meeting starts at ten.","exampleAr":"على فكرة، الاجتماع بيبدأ الساعة عشرة.","type":"phrase","id":"en226"},{"en":"Don’t hesitate to…","ar":"متترددش إنك…","note":"جزء 2: بعد hesitate نستخدم to + فعل. المصدر Don’t hesitate صحيح لو المقصود معروف.","example":"Don’t hesitate to ask for help.","exampleAr":"متترددش تطلب مساعدة.","type":"phrase","id":"en227"},{"en":"I guess…","ar":"أظن / غالبًا…","note":"جزء 2: رأي أو تخمين غير مؤكد، مش توقع مستقبلي بالضرورة.","example":"I guess he’s busy.","exampleAr":"أظن إنه مشغول.","type":"phrase","id":"en228"},{"en":"What am I expected to do?","ar":"إيه المطلوب مني أعمله؟","note":"جزء 2: تصحيح المصدر بإضافة I بعد am. طلب توضيح المطلوب؛ قد تعبر عن إحباط بالنبرة.","example":"What am I expected to do before the meeting?","exampleAr":"إيه المطلوب مني أعمله قبل الاجتماع؟","type":"phrase","id":"en229"},{"en":"Reckless / Negligent / Selfish","ar":"متهور / مهمل / أناني.","note":"جزء 2: كلمات مختلفة مش مترادفات: reckless لا يبالي بالمخاطر؛ negligent يهمل واجب العناية؛ selfish يركز على نفسه.","example":"Reckless driving is dangerous. Don’t be negligent or selfish.","exampleAr":"السواقة المتهورة خطرة. متبقاش مهمل أو أناني.","type":"phrase","id":"en230"},{"en":"Be humble.","ar":"خليك متواضع.","note":"جزء 3: humble = متواضع، مش ضعيف الثقة؛ قد يبدو أمرًا مباشرًا.","example":"Be proud of your work, but stay humble.","exampleAr":"افتخر بشغلك، بس خليك متواضع.","type":"phrase","id":"en231"},{"en":"For my sake.","ar":"عشان خاطري / من أجلي.","note":"جزء 3: my = خاطري؛ your = خاطرك. for someone’s sake.","example":"Please be careful, for my sake.","exampleAr":"خلي بالك من نفسك، عشان خاطري.","type":"phrase","id":"en232"},{"en":"It’s up to you.","ar":"القرار راجع لك.","note":"جزء 3: بتسيب الاختيار للشخص؛ مش بالضرورة عدم اهتمام.","example":"We can go today or tomorrow. It’s up to you.","exampleAr":"ممكن نروح النهارده أو بكرة، القرار راجع لك.","type":"phrase","id":"en233"},{"en":"That’s hearsay.","ar":"ده كلام منقول وغير مؤكد.","note":"جزء 3: معلومات سمعتها من الآخرين، مش معرفة مباشرة؛ مش كل hearsay كذبة أو إشاعة مختلقة.","example":"I haven’t seen any evidence. That’s just hearsay.","exampleAr":"مشفتش أي دليل، ده مجرد كلام منقول.","type":"phrase","id":"en234"},{"en":"It’s not my place to say.","ar":"مش من موقعي إني أحكم أو أتدخل.","note":"جزء 3: لعدم امتلاك الحق أو الدور المناسب لإبداء الرأي؛ مش عدم القدرة على الكلام.","example":"It’s not my place to say how you should live.","exampleAr":"مش من حقي أقولك تعيش إزاي.","type":"phrase","id":"en235"},{"en":"Nailed it!","ar":"عملتها بإتقان! / جبتها صح!","note":"جزء 3: غير رسمي بعد نجاح في مهمة أو إجابة؛ مش مدح عام في كل موقف.","example":"You nailed that presentation!","exampleAr":"قدمت العرض ده بإتقان!","type":"phrase","id":"en236"},{"en":"Principles / Principal","ar":"مبادئ / مدير أو رئيسي.","note":"جزء 3: principle = مبدأ، جمعها principles. principal اسم لمدير مدرسة أو صفة بمعنى رئيسي؛ كلمتان مختلفتان.","example":"The principal explained the school’s principles.","exampleAr":"مدير المدرسة شرح مبادئ المدرسة.","type":"phrase","id":"en237"},{"en":"This is incredible!","ar":"ده مذهل / صعب يتصدق!","note":"جزء 3: قد تكون للدهشة الإيجابية أو عدم التصديق حسب السياق.","example":"You finished it in one day? That’s incredible!","exampleAr":"خلصته في يوم واحد؟ ده مذهل!","type":"phrase","id":"en238"},{"en":"What’s the use?","ar":"إيه الفايدة؟","note":"جزء 3: غالبًا سؤال يعبر عن إحباط أو عدم جدوى. What’s the use of + ing.","example":"What’s the use of arguing now?","exampleAr":"إيه فايدة الجدال دلوقتي؟","type":"phrase","id":"en239"},{"en":"That’s personal. / It’s a private matter. / I’d rather keep that information to myself.","ar":"ده شخصي / موضوع خاص / أفضل أحتفظ بالمعلومة لنفسي.","note":"جزء 4: اتجمعت الصيغ المتقاربة في مكان واحد. آخر صيغة ألطف لتحديد الخصوصية؛ info غير رسمية، information أنسب رسميًا.","example":"I’d rather keep that information to myself.","exampleAr":"أفضل أحتفظ بالمعلومة دي لنفسي.","type":"phrase","id":"en240"},{"en":"Keep it simple.","ar":"خلّيها بسيطة.","note":"جزء 4: تجنّب التعقيد غير الضروري، مش حذف معلومات أساسية.","example":"Keep the design simple.","exampleAr":"خلّي التصميم بسيط.","type":"phrase","id":"en241"},{"en":"I can’t place you.","ar":"حاسس إني أعرفك بس مش فاكر منين.","note":"جزء 4: عدم تذكر هوية الشخص أو المكان اللي قابلته فيه.","example":"You look familiar, but I can’t place you.","exampleAr":"شكلك مألوف، بس مش فاكر أعرفك منين.","type":"phrase","id":"en242"},{"en":"Permissible / Prohibited","ar":"مسموح / ممنوع.","note":"جزء 4: وصف عام للقواعد وليس دينيًا فقط؛ halal وharam أو permissible/prohibited in Islam لو المقصود الحكم الديني تحديدًا.","example":"Parking here is prohibited. Is this food halal?","exampleAr":"الركن هنا ممنوع. هل الأكل ده حلال؟","type":"phrase","id":"en243"},{"en":"Let me share a piece of advice with you.","ar":"اسمح لي أشاركك بنصيحة.","note":"جزء 4: ترتيب طبيعي للجملة الواردة. Lemme كتابة غير رسمية لـ let me؛ advice غير معدودة: a piece of advice، مش an advice.","example":"Let me share a piece of advice with you: start small.","exampleAr":"اسمح لي أشاركك بنصيحة: ابدأ بحاجة صغيرة.","type":"phrase","id":"en244"},{"en":"She shared an important piece of information during the meeting.","ar":"هي شاركت بمعلومة مهمة أثناء الاجتماع.","note":"جزء 4: information غير معدودة؛ a piece of information، مش an information. info اختصار غير رسمي.","example":"She shared an important piece of information during the meeting.","exampleAr":"شاركت بمعلومة مهمة أثناء الاجتماع.","type":"phrase","id":"en245"},{"en":"I have a piece of news that you might find interesting.","ar":"عندي خبر ممكن تلاقيه مثير للاهتمام.","note":"جزء 4: حذف it الزيادة من المصدر؛ news غير معدودة. that هنا مفعول find فلا نكرره بـ it.","example":"I have a piece of news that you might find interesting.","exampleAr":"عندي خبر ممكن يهمك.","type":"phrase","id":"en246"}]}]},{"id":"expressions-4","title":"مواقف ومفردات","heading":"مواقف ومفردات","intro":["طلب مقعد، إبداء رأي، ردود التعارف، وصف الطعام وعرض المساعدة. اتشالت مستويات اللغة غير المثبتة واتصححت الترجمات."],"sections":[{"id":"expressions-4-0","title":"مواقف ومفردات","notes":[],"items":[{"en":"Can I sit here? / Is anyone sitting here? / Is this seat taken?","ar":"ممكن أقعد هنا؟ / فيه حد قاعد هنا؟ / الكرسي ده محجوز؟","note":"صيغ طبيعية؛ sitting بحرفَي t. مستويات A1–C1 في الملف مش تصنيف موثوق لكل جملة، فاتشالت.","example":"Excuse me, is this seat taken?","exampleAr":"بعد إذنك، فيه حد قاعد هنا؟","type":"phrase","id":"en247"},{"en":"Is this seat occupied?","ar":"هل المقعد ده مشغول؟","note":"صحيحة لكنها رسمية نسبيًا؛ Is this seat taken? أبسط في المطعم.","example":"Is this seat occupied, or may I sit here?","exampleAr":"هل المقعد ده مشغول، ولا ممكن أقعد هنا؟","type":"phrase","id":"en248"},{"en":"I believe… / I reckon… / It seems to me that…","ar":"أعتقد… / أظن… / يبدو لي أن…","note":"صيغ إبداء رأي؛ reckon غير رسمية وشائعة في البريطانية. I think وIn my opinion موجودين في «الشغل والنقاش».","example":"It seems to me that we need more time.","exampleAr":"يبدو لي إننا محتاجين وقت أكتر.","type":"phrase","id":"en249"},{"en":"As far as I’m concerned,…","ar":"بالنسبة لي / من وجهة نظري…","note":"تصحيح ترجمة المصدر: مش «كنت مهتم». تحدد موقفك الشخصي وقد تبدو حاسمة.","example":"As far as I’m concerned, the matter is settled.","exampleAr":"بالنسبة لي، الموضوع محسوم.","type":"phrase","id":"en250"},{"en":"From my perspective,…","ar":"من وجهة نظري…","note":"صيغة رأي؛ مش شرط مستوى C2. perspective = زاوية النظر للأمر.","example":"From my perspective, this is a useful change.","exampleAr":"من وجهة نظري، ده تغيير مفيد.","type":"phrase","id":"en251"},{"en":"Nice to meet you too. / You too. / Likewise.","ar":"وأنا سعيد بمعرفتك كمان.","note":"ردود طبيعية على Nice to meet you. You too اختصار للرد الكامل؛ Likewise أكثر رسمية نسبيًا. Me too مفهومة لكنها أقل دقة هنا.","example":"Nice to meet you. — Nice to meet you too.","exampleAr":"سعيد بمعرفتك. — وأنا كمان.","type":"phrase","id":"en252"},{"en":"The pleasure is mine.","ar":"الشرف لي / أنا الأسعد بمعرفتك.","note":"رد مهذب على التعارف. My pleasure أكثر شيوعًا ردًا على الشكر؛ الرد الكامل أوضح عند التعارف.","example":"It’s a pleasure to meet you. — The pleasure is mine.","exampleAr":"اتشرفت بمعرفتك. — الشرف لي.","type":"phrase","id":"en253"},{"en":"The cheese is moldy.","ar":"الجبنة عليها عفن.","note":"moldy أمريكية؛ mouldy بريطانية. تصف وجود عفن، مش كل طعام قديم.","example":"Don’t use this cheese. It’s moldy.","exampleAr":"متستخدمش الجبنة دي، عليها عفن.","type":"phrase","id":"en254"},{"en":"The apple is rotten.","ar":"التفاحة معفنة / فاسدة.","note":"rotten = متحلل أو فاسد؛ مش مجرد غير طازج.","example":"This apple is rotten inside.","exampleAr":"التفاحة دي فاسدة من جوّه.","type":"phrase","id":"en255"},{"en":"The milk is spoiled.","ar":"اللبن فاسد / بايظ.","note":"spoiled تصف فساد الطعام؛ في الكلام كمان The milk has gone bad.","example":"The milk smells strange. I think it’s spoiled.","exampleAr":"ريحة اللبن غريبة، أظن إنه فسد.","type":"phrase","id":"en256"},{"en":"The bread is stale.","ar":"العيش بايت ومش طازة.","note":"stale لا تعني بالضرورة متعفن؛ فقد الطزاجة وقد يكون ناشفًا.","example":"The bread is stale, but it isn’t moldy.","exampleAr":"العيش بايت، بس مفيهوش عفن.","type":"phrase","id":"en257"},{"en":"It’s past its expiration date.","ar":"تاريخ صلاحيته عدى.","note":"بديل أوضح للمصدر The can is expired؛ المقصود المنتج أو محتوى العلبة. تاريخ الصلاحية ووصف الفساد معنيان مختلفان.","example":"This can of soup is past its expiration date.","exampleAr":"علبة الشوربة دي تاريخ صلاحيتها عدى.","type":"phrase","id":"en258"},{"en":"If you need anything, let me know.","ar":"لو محتاج أي حاجة، قولي.","note":"عرض مساعدة؛ lemme كتابة عامية لـ let me، والأفضل let me في الكتابة العادية.","example":"If you need anything during the course, let me know.","exampleAr":"لو محتاج أي حاجة أثناء الكورس، قولي.","type":"phrase","id":"en259"},{"en":"Is there anything I can do for you?","ar":"فيه حاجة أقدر أعملها لك؟","note":"anything كلمة واحدة. عرض مساعدة عام؛ قريبة من الجملة الموجودة بصفحة «جمل مختلفة»، وليست تكرارًا حرفيًا.","example":"Is there anything I can do for you before I leave?","exampleAr":"فيه حاجة أقدر أعملها لك قبل ما أمشي؟","type":"phrase","id":"en260"},{"en":"Do you need any assistance?","ar":"هل محتاج أي مساعدة؟","note":"صيغة رسمية نسبيًا. some assistance صحيحة أيضًا؛ any شائعة في السؤال العام.","example":"Do you need any assistance with your booking?","exampleAr":"هل محتاج مساعدة بخصوص حجزك؟","type":"phrase","id":"en261"},{"en":"In no time.","ar":"بسرعة جدًا / في وقت قصير جدًا.","note":"تعبير مستخرج من حوار الحصان؛ مفيد بعيدًا عن سياق النكتة.","example":"You’ll finish this task in no time.","exampleAr":"هتخلص المهمة دي بسرعة جدًا.","type":"phrase","id":"en262"},{"en":"As if…","ar":"كأن…","note":"للتشبيه أو وصف الانطباع. الزمن يتحدد بالمعنى؛ الأصل Something fell from it ترجمتها الحرفية «وقع منه شيء» ولا تثبت ما حدث.","example":"He looks as if he’s lost something.","exampleAr":"شكله كأنه ضيّع حاجة.","type":"phrase","id":"en263"}]}]},{"id":"expressions-5","title":"عنّي: محادثات يومية","heading":"Everyday Conversation — محادثات يومية","intro":[],"sections":[{"id":"expressions-5-0","title":"عنّي - محادثات يومية","notes":[],"items":[{"en":"Hey!","ar":"هالو / أهلًا","note":"تحية ودّية غير رسمية للأصدقاء.","example":"Hey! How’s it going?","type":"phrase","id":"en264"},{"en":"How’s it going?","ar":"أخبارك إيه؟ / الأمور ماشية معاك إزاي؟","note":"سؤال ودّي عن الأحوال. ينفع لولد أو بنت.","example":"Hey! How’s it going?","type":"phrase","id":"en265"},{"en":"What are you up to?","ar":"بتعمل إيه دلوقتي؟ / بتعملي إيه؟","note":"طبيعي وودّي بين الأصدقاء. الصياغة الإنجليزية لا تتغيّر حسب الجنس.","example":"What are you up to?","type":"phrase","id":"en266"},{"en":"Hey! How’s it going? What are you up to?","ar":"هالو! أخبارك إيه؟ بتعمل إيه دلوقتي؟","note":"رسالة كاملة لفتح الحوار.","example":"Hey! How’s it going? What are you up to?","type":"phrase","id":"en267"}]}]},{"id":"expressions-6","title":"اختصارات الشات","heading":"اختصارات الشات","intro":["اختصارات مفيدة للدردشة؛ استخدم الجملة كاملة في الرسائل الرسمية، مع ملاحظة أن FYI شائعة في العمل أيضًا."],"sections":[{"id":"expressions-6-0","title":"اختصارات الشات","notes":[],"items":[{"en":"np = no problem","ar":"مفيش مشكلة.","note":"اختصار غير رسمي في الشات، لا يستخدم في رسالة عمل رسمية.","example":"Thanks! — np","exampleAr":"شكرًا! — مفيش مشكلة.","type":"phrase","id":"en268"},{"en":"idk = I don’t know","ar":"مش عارف.","note":"اختصار دردشة؛ اكتب الجملة كاملة في العمل الرسمي.","example":"idk what time he’ll arrive.","exampleAr":"مش عارف هيوصل إمتى.","type":"phrase","id":"en269"},{"en":"btw = by the way","ar":"بالمناسبة / على فكرة.","note":"التعبير الكامل موجود بالفعل؛ الجديد هنا الاختصار فقط.","example":"btw, I sent you the file.","exampleAr":"على فكرة، بعت لك الملف.","type":"phrase","id":"en270"},{"en":"brb = be right back","ar":"راجع حالًا.","note":"لما تسيب المحادثة لحظات وترجع.","example":"brb, someone’s at the door.","exampleAr":"راجع حالًا، فيه حد على الباب.","type":"phrase","id":"en271"},{"en":"PM = private message","ar":"رسالة خاصة.","note":"اسم وقد تستخدم فعلًا في الشات. مش معناها هنا مساءً؛ السياق يحدد.","example":"Send me a PM.","exampleAr":"ابعت لي رسالة خاصة.","type":"phrase","id":"en272"},{"en":"FYI = for your information","ar":"
