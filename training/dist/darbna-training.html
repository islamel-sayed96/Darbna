للعلم / لمعلوماتك.","note":"تصحيح التوسيع من info إلى information. شائعة أيضًا في رسائل العمل؛ قد تبدو مقتضبة حسب السياق.","example":"FYI, the meeting has moved to Monday.","exampleAr":"للعلم، الاجتماع اتنقل ليوم الاثنين.","type":"phrase","id":"en273"}],"rules":[],"questions":[{"q":"FYI اختصار لـ:","options":["for your information","for your info","fix your issue"],"answer":0,"explain":"FYI = for your information."},{"q":"brb معناها:","options":["راجع حالًا","أخويا","باي باي"],"answer":0,"explain":"brb = be right back."},{"q":"إمتى ماتستخدمش idk؟","options":["في رسالة شغل رسمية","مع صاحبك","في جروب العيلة"],"answer":0,"explain":"الاختصارات للدردشة غير الرسمية."}]}]},{"id":"expressions-7","title":"عبارات تشجيعية","heading":"عبارات تشجيعية","intro":["عبارات من الملف للفهم والتعبير عن الدعم؛ ليست قواعد أو وعودًا مؤكدة. حُذفت المبالغات الطويلة والتكرار."],"sections":[{"id":"expressions-7-0","title":"عبارات تشجيعية","notes":[],"items":[{"en":"Make time for yourself and take breaks.","ar":"خصص وقت لنفسك وخد فواصل.","note":"من قائمة المصدر 7 things: make time for = يخصص وقتًا لـ.","example":"Make time for yourself, even on busy days.","exampleAr":"خصص وقت لنفسك حتى في الأيام المزدحمة.","type":"phrase","id":"en274"},{"en":"It’s okay to have bad or unproductive days.","ar":"عادي يكون فيه أيام صعبة أو إنتاجيتها قليلة.","note":"اقتباس دعم للنفس، مش دعوة لإهمال المسؤوليات.","example":"Some days are less productive, and that’s okay.","exampleAr":"بعض الأيام إنتاجيتها أقل، وده عادي.","type":"phrase","id":"en275"},{"en":"You deserve love, care, and support.","ar":"إنت تستحق الحب والاهتمام والدعم.","note":"deserve + اسم، أو deserve to + فعل.","example":"You deserve care and support.","exampleAr":"إنت تستحق الاهتمام والدعم.","type":"phrase","id":"en276"},{"en":"Allow yourself to feel your emotions.","ar":"اسمح لنفسك تحس بمشاعرك.","note":"منقحة من feel / hear and accept them؛ accept your feelings = يتقبل مشاعره.","example":"Don’t ignore your feelings. Try to understand them.","exampleAr":"متتجاهلش مشاعرك، حاول تفهمها.","type":"phrase","id":"en277"},{"en":"The good you see in others is within you too.","ar":"الخير اللي بتشوفه في الناس موجود جواك كمان.","note":"عبارة تشجيعية من المصدر، وليست حقيقة قابلة للقياس عن كل صفة.","example":"Look for the good in yourself as well as in others.","exampleAr":"شوف الخير في نفسك زي ما بتشوفه في الناس.","type":"phrase","id":"en278"},{"en":"Some days, just getting through is enough.","ar":"بعض الأيام، مجرد إنك تعدّي اليوم كفاية.","note":"صياغة لمعنى days where the only thing you do is survive؛ مناسبة للدعم في يوم صعب.","example":"You had a difficult day. Just getting through it was enough.","exampleAr":"كان يومك صعب، ومجرد إنك عديته كان كفاية.","type":"phrase","id":"en279"},{"en":"Be kind to yourself. You deserve it.","ar":"عامل نفسك بلطف، إنت تستاهل.","note":"صياغة لمعنى love yourself you deserve that. You deserve it موجودة كمان في التعبيرات اليومية.","example":"Be kind to yourself when you make a mistake.","exampleAr":"عامل نفسك بلطف لما تغلط.","type":"phrase","id":"en280"},{"en":"Don’t judge my story by the chapter you walked in on.","ar":"متحكمش على قصتي من الجزء اللي حضرتك شفته بس.","note":"اقتباس مجازي عن معرفة جزء من حياة شخص. ده استخدام مختلف عن Don’t judge a book by its cover الموجودة؛ للفهم لا للحفظ كجملة أساسية.","example":"You’ve only seen part of my story.","exampleAr":"إنت شفت جزء من قصتي بس.","type":"phrase","id":"en281"}]}]}]},{"id":"work","title":"الشغل والمقابلات","desc":"النقاش في الشغل، أسئلة المقابلات وإجاباتك","lessons":[{"id":"work-0","title":"الشغل والنقاش","heading":"الشغل والنقاش","intro":["نهايات المحادثات، المتابعة، إبداء الرأي والاختلاف بأدب. البدائل البسيطة المذكورة بالمصدر صحيحة؛ الاختيار حسب المعنى."],"sections":[{"id":"work-0-0","title":"الشغل والنقاش","notes":[],"items":[{"en":"I appreciate your insights. Talk to you soon.","ar":"بقدّر أفكارك وملاحظاتك. هنتكلم قريب.","note":"جزء 2: insights = أفكار أو فهم عميق، مش رؤيتك بالعين. أطول وأخص من See you؛ الاتنين صحيحين.","example":"I appreciate your insights on the project. Talk to you soon.","exampleAr":"بقدّر ملاحظاتك عن المشروع، هنتكلم قريب.","type":"phrase","id":"en282"},{"en":"It was a pleasure meeting you. Talk to you soon.","ar":"اتشرفت بمعرفتك. هنتكلم قريب.","note":"جزء 2: تصحيح meeting بإضافة you. المصدر كاتب Buy والمقصود غالبًا Bye = مع السلامة؛ مش buy = يشتري.","example":"It was a pleasure meeting you today.","exampleAr":"اتشرفت بمعرفتك النهارده.","type":"phrase","id":"en283"},{"en":"I look forward to our next discussion.","ar":"متطلع لنقاشنا الجاي.","note":"جزء 2: look forward to + اسم أو فعل ing. مش مرادف That’s it = كده خلصنا / هذا كل شيء.","example":"I look forward to discussing the plan with you.","exampleAr":"متطلع إني أناقش الخطة معاك.","type":"phrase","id":"en284"},{"en":"I will follow up with you on this.","ar":"هتابع معاك بخصوص الموضوع ده.","note":"جزء 2: متابعة تقدم أو رد؛ Let’s discuss it later صحيحة لكن معناها نناقشه لاحقًا، مش وعد بالمتابعة.","example":"I’ll follow up with you on the order tomorrow.","exampleAr":"هتابع معاك بخصوص الطلب بكرة.","type":"phrase","id":"en285"},{"en":"The call was dropped.","ar":"المكالمة اتقطعت.","note":"جزء 2: انقطاع مكالمة، مش بالضرورة فقد الشبكة تمامًا. طبيعي كمان: We got cut off.","example":"Sorry, the call was dropped. Can you hear me now?","exampleAr":"آسف، المكالمة اتقطعت. سامعني دلوقتي؟","type":"phrase","id":"en286"},{"en":"I see your point, but…","ar":"فاهم وجهة نظرك، لكن…","note":"جزء 2: تصحيح Is see إلى I see. اعتراف بفكرة الآخر قبل الاعتراض. I disagree صحيحة ومباشرة.","example":"I see your point, but we need more time.","exampleAr":"فاهم وجهة نظرك، لكن محتاجين وقت أكتر.","type":"phrase","id":"en287"},{"en":"I have a different perspective.","ar":"عندي وجهة نظر مختلفة.","note":"جزء 2: اختلاف رأي بهدوء؛ مش تأكيد إن الآخر غلط زي You are wrong.","example":"I have a different perspective on this issue.","exampleAr":"عندي وجهة نظر مختلفة بخصوص الموضوع ده.","type":"phrase","id":"en288"},{"en":"Let’s consider another approach.","ar":"خلّينا نفكر في طريقة تانية.","note":"جزء 2: consider + اسم أو فعل ing. That’s not right اعتراض، مش نفس اقتراح طريقة جديدة.","example":"Let’s consider another approach to the problem.","exampleAr":"خلّينا نفكر في طريقة تانية لحل المشكلة.","type":"phrase","id":"en289"},{"en":"I have some reservations about this.","ar":"عندي بعض التحفظات على ده.","note":"جزء 2: تصحيح reservation إلى reservations. تحفظ أو تردد، مش رفض نهائي زي I can’t accept that.","example":"I have some reservations about the cost.","exampleAr":"عندي بعض التحفظات على التكلفة.","type":"phrase","id":"en290"},{"en":"May I add a point?","ar":"ممكن أضيف نقطة؟","note":"جزء 2: صيغة مهذبة في النقاش. Can I say something? صحيحة وأعم؛ مش كل كلام إضافة نقطة.","example":"May I add a point about the deadline?","exampleAr":"ممكن أضيف نقطة بخصوص موعد التسليم؟","type":"phrase","id":"en291"},{"en":"I have some concerns about this approach.","ar":"عندي بعض المخاوف من الطريقة دي.","note":"جزء 2: concerns about أوضح هنا من with. ألطف وأدق من That’s a bad idea لما تناقش مشكلة محددة.","example":"I have some concerns about this approach. It may take too long.","exampleAr":"عندي مخاوف من الطريقة دي، ممكن تاخد وقت طويل.","type":"phrase","id":"en292"},{"en":"In my opinion,… / I think…","ar":"في رأيي… / أعتقد…","note":"جزء 2: الاتنين صحيحين. In my opinion تتبعها جملة، وI think فعل يتبعه رأيك؛ مش لازم تجمعهم.","example":"In my opinion, we should start now.","exampleAr":"في رأيي، المفروض نبدأ دلوقتي.","type":"phrase","id":"en293"},{"en":"Can you elaborate?","ar":"ممكن تشرح بتفصيل أكتر؟","note":"جزء 3: طلب تفاصيل إضافية. elaborate on + الموضوع؛ مش مجرد تكرار نفس الكلام.","example":"Could you elaborate on your proposal?","exampleAr":"ممكن تشرح اقتراحك بتفصيل أكتر؟","type":"phrase","id":"en294"}]}]},{"id":"work-1","title":"مقابلات العمل","heading":"مقابلات العمل","intro":["سؤال واحد لكل موضوع مع إجابة نموذجية مترجمة. دي مادة المقابلات نفسها، مش اختبارات إضافية. تفاصيل السيرة من الملف المرفق وتحتاج مراجعة قبل الاستخدام."],"sections":[{"id":"work-1-0","title":"مقابلات العمل","notes":[],"items":[{"en":"Tell me about yourself.","ar":"عرّفنا بنفسك.","answer":"Thank you for inviting me today. My name is Islam El-Sayed, and I’m originally from Alexandria, Egypt. I currently live in the UAE. My background includes sales, customer service, web development, digital marketing, and technical training. I work as a Technical Instructor at Al Bayan Educational Institute, and I also work on websites, SEO, and Meta advertising campaigns. I enjoy helping people understand technical ideas and turning those ideas into practical results.","answerAr":"شكرًا لدعوتي النهارده. اسمي إسلام السيد، وأنا من الإسكندرية وبقيم حاليًا في الإمارات. خبرتي تشمل المبيعات وخدمة العملاء وتطوير المواقع والتسويق الرقمي والتدريب التقني. بشتغل مدرّب تقني في معهد البيان وبشتغل كمان على المواقع والسيو وحملات ميتا. بحب أبسّط الأفكار التقنية وأحوّلها لنتائج عملية.","note":"إجابة منقحة من النسخة الأولى في الملف. العمر اختياري ومحذوف لتعارض المسودة القديمة 27 مع خانة العمر الفارغة؛ لم نثبت عمرًا أو سنوات خبرة غير مؤكدة.","type":"qa","id":"en295"},{"en":"Tell me about your education.","ar":"كلّمنا عن تعليمك.","answer":"I graduated from Alexandria University with a Bachelor’s degree in Arts, specializing in Islamic History. Later, I completed an intensive ASP.NET Full-Stack Web Development program at the Information Technology Institute (ITI). This helped me build practical technical skills and move into the technology field.","answerAr":"اتخرجت من جامعة الإسكندرية ببكالوريوس آداب، تخصص التاريخ الإسلامي. وبعد كده خلصت برنامجًا مكثفًا في تطوير الويب الشامل باستخدام ASP.NET في معهد تكنولوجيا المعلومات ITI، وده ساعدني أبني مهارات تقنية عملية وأنتقل لمجال التكنولوجيا.","note":"التخصص من الملف المرفق نفسه؛ راجعه قبل استخدام الإجابة كسيرة شخصية. حذفنا سنة التخرج من المسودة القديمة بدل افتراضها.","type":"qa","id":"en296"},{"en":"Why did you join ITI?","ar":"ليه التحقت بمعهد ITI؟","answer":"I wanted to move into software development and gain structured, practical training. The ASP.NET Full-Stack program helped me improve my technical skills, build projects, and develop my problem-solving abilities.","answerAr":"كنت عايز أنتقل لتطوير البرمجيات وأحصل على تدريب عملي منظّم. البرنامج ساعدني أطوّر مهاراتي التقنية وأبني مشروعات وأحسّن قدرتي على حل المشكلات.","note":"move into a field = ينتقل لمجال. structured training = تدريب منظّم.","type":"qa","id":"en297"},{"en":"Tell me about your telesales experience.","ar":"كلّمنا عن خبرتك في المبيعات الهاتفية.","answer":"I worked in telesales and customer service with outsourcing companies serving customers in the UK and Kuwait. My responsibilities included understanding customer needs, explaining products and services, handling objections, and closing sales. This strengthened my communication and negotiation skills.","answerAr":"اشتغلت في المبيعات الهاتفية وخدمة العملاء مع شركات تعهيد بتخدم عملاء في بريطانيا والكويت. كنت بفهم احتياجات العملاء وبشرح المنتجات والخدمات وبتعامل مع الاعتراضات وبتمم البيع. التجربة دي قوّت مهارات التواصل والتفاوض عندي.","note":"حسب الملف؛ لم نكرر أسماء شركات أو مدد عمل غير مكتملة. handling objections = التعامل مع اعتراضات العميل.","type":"qa","id":"en298"},{"en":"Tell me about your Hilton experience.","ar":"كلّمنا عن تجربتك في هيلتون.","answer":"I worked as a Sales Executive at Hilton Dubai Al Habtoor City, promoting vacation memberships and communicating with potential customers. The role helped me develop my sales skills and learn how to explain an offer clearly and respond to customer questions.","answerAr":"اشتغلت مسؤول مبيعات في هيلتون دبي الحبتور سيتي، وكنت بسوّق عضويات العطلات وبتواصل مع عملاء محتملين. الدور ساعدني أطوّر مهارات البيع وشرح العرض بوضوح والرد على أسئلة العملاء.","note":"المدة والجهة التعاقدية غير مثبتتين هنا؛ الملف يذكر 3 أشهر ثم نحو 4 أشهر. راجع التفاصيل قبل المقابلة.","type":"qa","id":"en299"},{"en":"Why did you leave Hilton?","ar":"ليه سبت هيلتون؟","answer":"My role there ended, and I’m now looking for a long-term opportunity where I can continue developing my skills and contribute consistently.","answerAr":"دوري هناك انتهى، وأنا دلوقتي بدوّر على فرصة طويلة المدى أقدر أطور فيها مهاراتي وأساهم بشكل مستمر.","note":"مسودة محايدة وليست سببًا مكتملًا. لازم تضيف السبب الحقيقي: الملف يذكر عقدًا موسميًا منتهيًا، ومسودة أخرى تذكر عدم توفير الإقامة. لا تستخدم سبب العقد لو لم يكن صحيحًا. حُذف التعليق العربي الذي يشجع على اختيار رواية غير مؤكدة.","type":"qa","id":"en300"},{"en":"Tell me about your role at Al Bayan Institute.","ar":"كلّمنا عن دورك في معهد البيان.","answer":"I work in a role that combines technical training with practical project work. Besides teaching, I contribute to website development, digital marketing, SEO, and technical support. This allows me to use my skills in both educational and business settings.","answerAr":"شغلي بيجمع بين التدريب التقني والمشروعات العملية. بجانب التدريس، بساهم في تطوير المواقع والتسويق الرقمي والسيو والدعم التقني. ده بيخليني أستخدم مهاراتي في التعليم وفي شغل المشروعات.","note":"حُذفت بداية العمل February 2025 من الإجابة المختصرة؛ يمكن إضافتها بعد التأكد من التاريخ.","type":"qa","id":"en301"},{"en":"What are your technical responsibilities?","ar":"إيه مسؤولياتك التقنية؟","answer":"I develop and maintain websites, support software projects, improve SEO, manage Meta advertising campaigns, and provide technical support. I also help organize technical tasks and improve the institute’s digital presence.","answerAr":"بطوّر المواقع وبعمل صيانة ليها، وبشارك في مشروعات البرمجيات، وبحسّن السيو، وبُدير حملات ميتا وبقدم دعم تقني. وبساعد في تنظيم المهام التقنية وتحسين الحضور الرقمي للمعهد.","note":"maintain websites = يصون المواقع ويحدثها. digital presence = الحضور الرقمي.","type":"qa","id":"en302"},{"en":"What subjects do you teach?","ar":"بتدرّس إيه؟","answer":"I teach Software Engineering, Front-End Web Development, Web Design, Shopify E-commerce, UI/UX, SEO, Digital Marketing, and Media Buying. I focus on simplifying concepts and helping students apply what they learn in practical projects.","answerAr":"بدرّس هندسة البرمجيات والفرونت إند وتصميم المواقع وشوبيفاي وتجربة وواجهة المستخدم والسيو والتسويق الرقمي وشراء الإعلانات. بركّز على تبسيط المفاهيم والتطبيق العملي في المشروعات.","note":"الأسماء حسب الملف؛ اختصر القائمة حسب الوظيفة اللي بتتقدم لها.","type":"qa","id":"en303"},{"en":"What are your strengths?","ar":"إيه نقاط قوتك؟","answer":"My main strengths are adaptability, communication, problem-solving, and a willingness to learn. I’m comfortable working with clients and students, and I can connect technical ideas with practical needs.","answerAr":"أهم نقاط قوتي هي التكيّف والتواصل وحل المشكلات والرغبة في التعلم. بعرف أتعامل مع العملاء والطلاب وأربط الأفكار التقنية بالاحتياجات العملية.","note":"ادعم نقطة قوة بموقف حقيقي عند طلب مثال؛ لم نخترع إنجازًا أو رقمًا.","type":"qa","id":"en304"},{"en":"What are your weaknesses?","ar":"إيه نقاط ضعفك؟","answer":"I sometimes spend too much time on details. I’m improving by setting priorities, giving each task a time limit, and keeping the bigger picture in mind.","answerAr":"أحيانًا بقضي وقت زيادة في التفاصيل. بحسّن ده بتحديد الأولويات ووقت لكل مهمة، وبحاول أفضل مركز على الصورة الكبيرة.","note":"من E - Questions: ضعف + خطوات تحسين. الجملة مثال إجابة؛ استخدمها لو بتوصفك فعلًا.","type":"qa","id":"en305"},{"en":"Why should we hire you?","ar":"ليه نختارك للوظيفة؟","answer":"My experience combines customer service, sales, technical work, and training. This helps me understand client needs, communicate clearly, and contribute to practical solutions. I’m adaptable, quick to learn, and committed to delivering good work.","answerAr":"خبرتي بتجمع بين خدمة العملاء والمبيعات والشغل التقني والتدريب. ده بيساعدني أفهم احتياجات العملاء وأتواصل بوضوح وأساهم في حلول عملية. بتكيف بسرعة وبحب أتعلم وملتزم بتقديم شغل كويس.","note":"خصّص آخر جملة لمتطلبات الوظيفة بدل تكرار سيرة عامة.","type":"qa","id":"en306"},{"en":"Why do you want this job?","ar":"ليه عايز الوظيفة دي؟","answer":"I’m looking for a role where I can use my experience, keep learning, and contribute to meaningful results. This position matches my skills in [relevant skill], and I’m interested in the opportunity to work on [specific responsibility].","answerAr":"بدور على دور أستخدم فيه خبرتي وأكمل تعلم وأساهم في نتائج مفيدة. الوظيفة مناسبة لمهاراتي في [مهارة مرتبطة بالوظيفة] ومهتم بفرصة العمل على [مسؤولية محددة].","note":"قالب قابل للتخصيص: املأ الأقواس بمعلومات من إعلان الوظيفة؛ متدّعيش معرفة تفاصيل الشركة من غير مراجعتها.","type":"qa","id":"en307"},{"en":"Where do you see yourself in five years?","ar":"شايف نفسك فين بعد خمس سنين؟","answer":"In five years, I hope to have developed deeper expertise in my field, taken on more responsibility, and contributed to successful projects. I want to keep learning and grow into a role where I can support both the team and the business.","answerAr":"بعد خمس سنين، أتمنى أكون طورت خبرتي بشكل أعمق واتحملت مسؤوليات أكبر وساهمت في مشروعات ناجحة. عايز أفضل أتعلم وأنمو لدور أقدر أدعم فيه الفريق والشغل.","note":"دُمجت النسخ المتكررة؛ expertise = خبرة متخصصة، take on responsibility = يتحمل مسؤولية.","type":"qa","id":"en308"},{"en":"Do you have any questions for us?","ar":"عندك أسئلة لينا؟","answer":"Could you tell me more about the team I’ll be working with?\nWhat does success look like in this role during the first six months?\nWhat opportunities are available for learning and career development?\nWhat are the biggest challenges in this position?","answerAr":"ممكن أعرف أكتر عن الفريق اللي هشتغل معاه؟\nإيه شكل النجاح المتوقع في أول ست شهور؟\nإيه فرص التعلم والتطور الوظيفي؟\nإيه أكبر تحديات الدور ده؟","note":"اختار سؤال أو اتنين مناسبين؛ دي أسئلة المقابلة الأصلية، مش اختبار مذاكرة.","type":"qa","id":"en309"},{"en":"Where do you live?","ar":"ساكن فين؟","answer":"I currently live in Ajman, in the United Arab Emirates.","answerAr":"بقيم حاليًا في عجمان في الإمارات.","note":"أحدث إجابة صريحة في ملف المقابلات هي عجمان؛ دُمجت مسودات دبي الأقدم. السؤال عن المكان لا يستلزم ذكر السبب؛ السبب اختياري لو اتطلب أو كان مفيدًا.","type":"qa","id":"en310"},{"en":"Where are you from?","ar":"إنت منين أصلًا؟","answer":"I’m originally from Alexandria, Egypt.","answerAr":"أنا أصلًا من الإسكندرية في مصر.","note":"فرقها عن Where do you live? اللي بيسأل عن مكان السكن الحالي. تصحيح where you from إلى Where are you from?","type":"qa","id":"en311"},{"en":"Where do you work?","ar":"بتشتغل فين؟","answer":"I work in Dubai, but sometimes my work takes me to other emirates, such as Abu Dhabi, Ajman, and Sharjah.","answerAr":"بشتغل في دبي، وأحيانًا شغلي بيتطلب أروح إمارات تانية زي أبوظبي وعجمان والشارقة.","note":"حسب إجابة الملف؛ depending on work requirements = حسب متطلبات الشغل.","type":"qa","id":"en312"},{"en":"Is commuting every day difficult?","ar":"هل المشوار اليومي صعب؟","answer":"I’m used to commuting, and I have my own car. I don’t mind traveling for work when needed.","answerAr":"متعود على المشوار ومعايا عربيتي، ومعنديش مشكلة أتنقل للشغل وقت الحاجة.","note":"be used to + اسم أو ing = متعود على. حُذفت معلومة السائق لأنها تفصيل غير أساسي وقد تتغير.","type":"qa","id":"en313"},{"en":"How would you describe yourself?","ar":"توصف نفسك إزاي؟","answer":"I’m dedicated, curious, and willing to learn. I enjoy working with people, solving problems, and taking on challenging tasks. I take my work seriously and try to maintain a positive attitude.","answerAr":"أنا ملتزم وفضولي للتعلم وعندي رغبة أطور نفسي. بحب الشغل مع الناس وحل المشكلات والمهام اللي فيها تحدي. باخد شغلي بجدية وبحاول أحافظ على روح إيجابية.","note":"تصحيح السؤال بإضافة you؛ اختُصرت الإجابة المتكررة من غير مبالغة.","type":"qa","id":"en314"},{"en":"Why are you looking for a change?","ar":"ليه بتدور على تغيير؟","answer":"I’m grateful for what I’ve learned in my current role, but I’m ready for new challenges and more opportunities to grow. I’d like to use my experience in a role that allows me to develop further and make a stronger contribution.","answerAr":"ممتن للي اتعلمته في دوري الحالي، لكن جاهز لتحديات جديدة وفرص نمو أكبر. حابب أستخدم خبرتي في دور يسمح لي أتطور وأساهم بشكل أكبر.","note":"لا تنتقد صاحب العمل؛ وسّع horizons بالجمع لو استخدمت expand my horizons. لو انتهى العمل فعلًا بدّل current إلى previous.","type":"qa","id":"en315"},{"en":"Why would you like to work for Etihad Airways?","ar":"ليه حابب تشتغل في الاتحاد للطيران؟","answer":"I’m interested in a role where I can use my communication and customer service skills in an international environment. I’d like to learn more about this position and explain how my experience matches its requirements.","answerAr":"مهتم بدور أستخدم فيه مهارات التواصل وخدمة العملاء في بيئة دولية. حابب أعرف أكتر عن الوظيفة وأوضح إزاي خبرتي مناسبة لمتطلباتها.","note":"مسودة عامة دون ادعاءات عن الشركة. جزء relocate to the UAE غير مناسب لو مقيم فيها بالفعل؛ لو الوظيفة تتطلب انتقالًا لمكان آخر ناقشه حسب الواقع.","type":"qa","id":"en316"},{"en":"How would you rate yourself on a scale of 1 to 10?","ar":"تقيّم نفسك كام من عشرة؟","answer":"For my current skills in [specific area], I’d say eight out of ten. I have a solid foundation, but I know there is still room to learn and improve.","answerAr":"بالنسبة لمهاراتي الحالية في [مجال محدد]، أقول تمانية من عشرة. عندي أساس كويس، لكن عارف إن لسه فيه مجال أتعلم وأتحسن.","note":"قيّم مهارة محددة وادعمها بدليل؛ الرقم مثال من الملف وليس تقييمًا موضوعيًا لك.","type":"qa","id":"en317"},{"en":"How do you deal with criticism?","ar":"بتتعامل إزاي مع النقد؟","answer":"I listen carefully, ask questions if I need clarification, and look for specific ways to improve. Even when feedback is difficult to hear, I try to assess it fairly and respond professionally.","answerAr":"بسمع باهتمام وبسأل لو محتاج توضيح وبدور على خطوات محددة للتحسين. حتى لو الملاحظات صعبة، بحاول أقيّمها بعدل وأرد باحتراف.","note":"تحسين مهم للمصدر: متقولش إنك بتتجاهل كل نقد سلبي؛ فرّق بين النقد المفيد والإهانة.","type":"qa","id":"en318"},{"en":"What inspires you?","ar":"إيه اللي بيلهمك؟","answer":"My goals and other people’s progress inspire me. Seeing someone overcome a challenge reminds me to keep learning and improving. I’m motivated by the idea of becoming better at my work and making a positive difference.","answerAr":"أهدافي وتقدم الناس بيلهموني. لما أشوف حد يتغلب على تحدي ده بيفكرني أكمل تعلم وتحسين. بيحفزني إني أبقى أحسن في شغلي وأعمل فرق إيجابي.","note":"دُمجت المسودات الطويلة؛ حُذفت ادعاءات إتقان ثلاث لغات برمجة وخطط غير مؤكدة. overcome a challenge = يتغلب على تحدي.","type":"qa","id":"en319"},{"en":"What does customer service mean to you?","ar":"خدمة العملاء معناها إيه بالنسبة لك؟","answer":"To me, customer service means listening carefully, understanding what the customer needs, and providing clear, timely support. The goal is to resolve issues, build trust, and create a positive experience before, during, and after a purchase.","answerAr":"بالنسبة لي، خدمة العملاء هي الاستماع باهتمام وفهم احتياجات العميل وتقديم دعم واضح وفي وقت مناسب. الهدف حل المشكلات وبناء الثقة وخلق تجربة إيجابية قبل وأثناء وبعد الشراء.","note":"دُمجت خمس صيغ متشابهة، واتشال النص التالف h9. timely = في الوقت المناسب، build trust = يبني الثقة.","type":"qa","id":"en320"},{"en":"Who supports or encourages you?","ar":"مين بيدعمك أو بيشجّعك؟","answer":"I’m self-motivated, and I’m encouraged by the progress I make toward my goals. Support from the people around me also helps me keep going.","answerAr":"عندي دافع ذاتي، والتقدم نحو أهدافي بيشجعني. ودعم الناس اللي حواليا بيساعدني أكمل.","note":"صياغة مقترحة لمعنى My spirit encourages me، وليست معلومة مثبتة عن أشخاص؛ عدّلها حسب واقعك.","type":"qa","id":"en321"}]}]},{"id":"work-2","title":"موضوعات تحتاج تخصيص","heading":"موضوعات تحتاج تخصيص","intro":["موضوعات وردت بعناوين فقط أو بتفاصيل ناقصة. وضعت قوالب توضيحية، والأقواس تتملأ بمعلوماتك الحقيقية."],"sections":[{"id":"work-2-0","title":"موضوعات تحتاج تخصيص","notes":[],"items":[{"en":"Why did you move to the UAE?","ar":"ليه انتقلت للإمارات؟","answer":"I moved to the UAE to [your actual reason]. I was looking for [specific opportunity], and I wanted to [personal or professional goal].","answerAr":"انتقلت للإمارات عشان [سببك الحقيقي]. كنت بدوّر على [فرصة محددة] وعايز [هدف شخصي أو مهني].","note":"المصدر يسأل عن دبي لكن السكن الحالي عجمان. السبب غير محدد؛ ده قالب تكمّله، مش قصة شخصية مخترعة.","type":"qa","id":"en322"},{"en":"Tell me about your hometown.","ar":"كلّمنا عن مدينتك.","answer":"I’m from Alexandria, Egypt. What I like most about it is [something you genuinely like]. One place I’d recommend is [place], because [reason].","answerAr":"أنا من الإسكندرية في مصر. أكتر حاجة بحبها فيها هي [شيء بتحبه فعلًا]. مكان أرشحه هو [مكان] عشان [السبب].","note":"المصدر يقترح معالم وطعام وناس وتكلفة معيشة. التفاصيل والإجابة الكاملة غير موجودة؛ املأ القالب برأيك.","type":"qa","id":"en323"},{"en":"Tell me about your favorite movie.","ar":"كلّمنا عن فيلمك المفضل.","answer":"My favorite movie is [title]. I like it because [reason]. What stands out to me is [theme, character, or scene], and it makes me think about [idea].","answerAr":"فيلمي المفضل هو [الاسم]. بحبه عشان [السبب]. أكتر حاجة مميزة فيه بالنسبة لي هي [فكرة أو شخصية أو مشهد] وبيخليني أفكر في [فكرة].","note":"المصدر يذكر In Time عنوانًا فقط؛ لم نفترض أحداثًا أو سبب تفضيلك له.","type":"qa","id":"en324"},{"en":"How would you structure a sales presentation?","ar":"تنظم عرض مبيعات إزاي؟","answer":"I would open the conversation, ask questions to understand the customer’s needs, present a relevant solution, address concerns, and agree on a clear next step.","answerAr":"هبدأ المحادثة وأسأل عشان أفهم احتياجات العميل، وأعرض حلًا مناسبًا وأناقش مخاوفه، وبعدين نتفق على خطوة واضحة.","note":"نموذج عام للتوضيح. المصدر يذكر LLVC presentation عنوانًا فقط؛ لا توجد خطوات رسمية أو أسعار أو مزايا عضوية موثقة.","type":"qa","id":"en325"},{"en":"How would you open and close a customer service call?","ar":"تبدأ وتنهي مكالمة خدمة عملاء إزاي؟","answer":"Opening: Thank you for calling [company]. My name is Islam. How may I help you today?\nClosing: Is there anything else I can help you with? Thank you for calling [company]. Have a good day.","answerAr":"البداية: شكرًا لاتصالك بـ[الشركة]. معاك إسلام، أقدر أساعدك إزاي النهارده؟\nالنهاية: فيه أي حاجة تانية أقدر أساعدك فيها؟ شكرًا لاتصالك بـ[الشركة]، يومك سعيد.","note":"نموذج عام مضاف لأن المصدر عنوان فقط. إجراءات التحقق وهوية العميل تُتبع حسب سياسة جهة العمل.","type":"qa","id":"en326"},{"en":"How would you write a professional email?","ar":"تكتب إيميل مهني إزاي؟","answer":"Subject: Follow-up on our meeting\nDear [name],\nThank you for your time today. I’m writing to follow up on [topic]. Could you please confirm [specific request]?\nBest regards,\nIslam","answerAr":"الموضوع: متابعة بخصوص اجتماعنا\nعزيزي/عزيزتي [الاسم]،\nشكرًا لوقتك النهارده. بكتب للمتابعة بخصوص [الموضوع]. ممكن تأكد [الطلب المحدد]؟\nمع أطيب التحيات، إسلام.","note":"نموذج توضيحي مضاف؛ المصدر لا يحتوي إيميلًا مكتملًا. اكتب عنوانًا واضحًا وغرضًا وطلبًا محددًا وخاتمة.","type":"qa","id":"en327"}]}]},{"id":"work-3","title":"عنّي: أسئلة وإجابات","heading":"Islam’s English Practice — Jobs and Routine","intro":[],"sections":[{"id":"work-3-0","title":"عنّي - أسئلة وإجابات","notes":[],"items":[{"version":"Detailed / مفصّلة","answer":"My work has two main parts: teaching and working on practical projects.\n\nI work as an instructor at several training institutes in the UAE, including Al Bayan, NTC, and Al Waseet. These institutes have branches across different emirates. I teach a range of subjects, including web design, e-commerce, front-end and back-end development, UI/UX design, digital marketing, sales, and media buying.\n\nAlongside teaching, I manage several projects involving e-commerce, website design, and online advertising campaigns. Some are freelance projects, some are for the institutes I work with, and others are ongoing projects under long-term contracts.","answerAr":"شغلي فيه جزئين أساسيين: التدريس والعمل على مشاريع عملية.\n\nبشتغل كمحاضر في عدة معاهد تدريب في الإمارات، منها البيان وNTC والوسيط، وليها فروع في إمارات مختلفة. بدرس تصميم المواقع، والتجارة الإلكترونية، وتطوير الواجهات الأمامية والخلفية، وتصميم واجهات وتجربة المستخدم، والتسويق الإلكتروني، والمبيعات، وشراء الإعلانات.\n\nوبجانب التدريس، بدير مشاريع في التجارة الإلكترونية وتصميم المواقع والحملات الإعلانية. بعضها فريلانس، وبعضها للمعاهد اللي بشتغل معاها، والباقي مشاريع مستمرة بعقود طويلة الأجل.","en":"What do you do for a living?","ar":"بتشتغل إيه؟","type":"qa","id":"en328"},{"version":"Short / مختصرة","answer":"I work as an instructor and also manage practical projects. I teach web design, e-commerce, web development, UI/UX design, and digital marketing at several institutes in the UAE. Alongside teaching, I manage online stores, build websites, and run advertising campaigns. I work on both freelance projects and long-term contracts.","answerAr":"بشتغل كمحاضر، وكمان بدير مشاريع عملية. بدرس تصميم المواقع والتجارة الإلكترونية وتطوير المواقع وتصميم واجهات وتجربة المستخدم والتسويق الإلكتروني في عدة معاهد في الإمارات. وبجانب التدريس، بدير متاجر إلكترونية وببني مواقع وبشغّل حملات إعلانية. بشتغل على مشاريع فريلانس وعقود طويلة الأجل.","en":"What do you do for a living?","ar":"بتشتغل إيه؟","type":"qa","id":"en329"},{"version":"Detailed / مفصّلة","answer":"There are two parts of my job that I enjoy the most.\n\nIn teaching, I love seeing students understand what I explain and feel happy about what they’ve learned. It’s rewarding to know that they’re benefiting from my lessons.\n\nIn my practical work, I enjoy delivering a project or task to a client and seeing it achieve good results and meet its goals. Receiving positive feedback from the client is one of the best parts.\n\nBoth experiences give me a sense of achievement because I can see the impact of my work.","answerAr":"فيه جزئين في شغلي بحبهم أكتر حاجة.\n\nفي التدريس، بحب أشوف الطلاب فاهمين اللي بشرحه ومبسوطين باللي اتعلموه. وبحس بالرضا لما أعرف إنهم بيستفيدوا من دروسي.\n\nوفي الشغل العملي، بحب أسلّم المشروع أو المهمة للعميل وأشوفها بتحقق نتائج كويسة وأهدافها. والفيدباك الإيجابي من العميل من أفضل أجزاء شغلي.\n\nفي الحالتين بحس بالإنجاز لأني بشوف أثر شغلي.","en":"What part of your job do you enjoy the most? Why?","ar":"إيه أكتر جزء بتحبه في شغلك؟ وليه؟","type":"qa","id":"en330"},{"version":"Short / مختصرة","answer":"I enjoy seeing my students understand and benefit from what I teach. I also love seeing my projects achieve good results and receiving positive feedback from clients. Both give me a sense of achievement because I can see the impact of my work.","answerAr":"بحب أشوف الطلاب فاهمين ومستفيدين من اللي بدرسّه. وكمان بحب أشوف مشاريعي بتحقق نتائج كويسة وأسمع تقييم إيجابي من العملاء. الاتنين بيدّوني إحساس بالإنجاز لأني بشوف أثر شغلي.","en":"What part of your job do you enjoy the most? Why?","ar":"إيه أكتر جزء بتحبه في شغلك؟ وليه؟","type":"qa","id":"en331"},{"version":"Answer / الإجابة","answer":"Meeting deadlines is the most stressful part of my work, especially when I have several tasks to finish in a short time.","answerAr":"الالتزام بمواعيد التسليم هو أكتر جزء بيسبّب لي ضغط في شغلي، خصوصًا لما يكون عندي عدة مهام لازم أخلصها في وقت قصير.","en":"What’s the most stressful part of your work routine?","ar":"إيه أكتر جزء في روتين شغلك بيسبّب لك ضغط؟","type":"qa","id":"en332"},{"version":"Answer / الإجابة","answer":"My pet peeves at work are people being late or not sticking to what we’ve agreed on. I value punctuality and keeping commitments.","answerAr":"اللي بيضايقني في الشغل هو تأخّر الناس أو عدم التزامهم باللي اتفقنا عليه. أنا بقدّر الالتزام بالمواعيد والوفاء بالالتزامات.","en":"What are your pet peeves at work?","ar":"إيه التصرفات اللي بتضايقك في الشغل؟","type":"qa","id":"en333"},{"version":"Answer / الإجابة","answer":"I’m taking a lot of courses and putting what I learn into practice. I also learn by experimenting and gaining hands-on experience.","answerAr":"باخد كورسات كتير وبطبّق اللي بتعلّمه عمليًا. وكمان بتعلّم من التجربة واكتساب خبرة عملية.","en":"What are you doing to improve your skills for a better job or a better life?","ar":"بتعمل إيه عشان تطوّر مهاراتك لشغل أفضل أو حياة أفضل؟","type":"qa","id":"en334"},{"version":"Answer / الإجابة","answer":"I’m a bit of both. I like waking up early, but I find it hard to fall asleep early. Sometimes I stay up late, but I usually wake up early, whether I’ve had a lot of sleep or only a few hours.","answerAr":"أنا شوية من الاتنين. بحب أصحى بدري، لكن بلاقي صعوبة إني أنام بدري. أحيانًا بسهر، لكن عادةً بصحى بدري سواء نمت كتير أو ساعات قليلة.","en":"Are you an early bird or a night owl?","ar":"بتحب تصحى بدري ولا بتنشط بالليل وبتحب السهر؟","type":"qa","id":"en335"},{"version":"Answer / الإجابة","answer":"I usually wake up at eight, turn off my alarms, and take a shower. I prepare my food and drink, get dressed, pack my bag, and pray. Then I head to my car, put my things inside, start the engine, and put on some music. I drive to work while sipping my drink. I leave home at half past eight and usually start work at ten in the morning. I finish at eight in the evening, but sometimes I work overtime. After work, I take a shower, get changed, and watch a movie or play on my PlayStation. I use my phone before bed and usually go to bed at two or three in the morning.","answerAr":"عادةً بصحى الساعة تمانية، وبقفل المنبّهات وباخد شاور. بحضّر أكلي ومشروبي، وبَلبس وبجهّز شنطتي وبصلّي. بعد كده بخرج لعربيتي، وبحط حاجتي فيها وبدوّرها وبشغّل أغاني. بسوق للشغل وأنا بشرب مشروبي. بخرج من البيت الساعة تمانية ونص وببدأ شغلي عادةً الساعة عشرة الصبح. بخلص تمانية بالليل، وأحيانًا بشتغل وقت إضافي. بعد الشغل باخد شاور وبغيّر هدومي وبتفرج على فيلم أو بلعب بلايستيشن. بستخدم موبايلي قبل النوم، وعادةً بروح أنام الساعة اتنين أو تلاتة الفجر.","en":"What’s your daily routine like?","ar":"روتينك اليومي عامل إزاي؟","type":"qa","id":"en336"},{"version":"Answer / الإجابة","answer":"I usually wake up at eight in the morning.","answerAr":"عادةً بصحى الساعة تمانية الصبح.","en":"What time do you usually wake up on workdays?","ar":"عادةً بتصحى الساعة كام في أيام الشغل؟","type":"qa","id":"en337"},{"version":"Answer / الإجابة","answer":"The first thing I do is turn off my alarms.","answerAr":"أول حاجة بعملها هي إني أقفل المنبّهات.","en":"What do you do right after you wake up?","ar":"بتعمل إيه أول ما تصحى؟","type":"qa","id":"en338"},{"version":"Answer / الإجابة","answer":"The first thing I check is the time.","answerAr":"أول حاجة ببص عليها هي الساعة.","en":"What’s the first thing you check when you grab your phone in the morning?","ar":"إيه أول حاجة بتراجعها لما تمسك موبايلك الصبح؟","type":"qa","id":"en339"},{"version":"Answer / الإجابة","answer":"I get dressed for work right after I take a shower.","answerAr":"بلبس هدوم الشغل أول ما أخلص الشاور.","en":"When do you get dressed to go to work?","ar":"بتلبس عشان تروح الشغل إمتى؟","type":"qa","id":"en340"},{"version":"Answer / الإجابة","answer":"I’m usually ready within half an hour.","answerAr":"عادةً بكون جاهز خلال نص ساعة. المقصود جاهز عمومًا، مش إن اللبس وحده بياخد نص ساعة.","en":"How long do you usually take to get dressed?","ar":"عادةً بتاخد قد إيه عشان تلبس؟","type":"qa","id":"en341"},{"version":"Answer / الإجابة","answer":"I usually start work at ten in the morning. I don’t have to clock in, but I use a fingerprint scanner to open the doors.","answerAr":"عادةً ببدأ شغلي الساعة عشرة الصبح. مش مطلوب مني أسجّل حضور، لكن بستخدم جهاز بصمة لفتح الأبواب.","en":"What time do you clock in?","ar":"بتسجّل حضورك في الشغل الساعة كام؟","type":"qa","id":"en342"},{"version":"Answer / الإجابة","answer":"I usually leave home at half past eight in the morning.","answerAr":"عادةً بخرج من البيت الساعة تمانية ونص الصبح.","en":"What time do you leave home?","ar":"بتخرج من البيت الساعة كام؟","type":"qa","id":"en343"},{"version":"Answer / الإجابة","answer":"I drive to work, and on the way, I listen to music and drink iced coffee.","answerAr":"بسوق للشغل، وفي الطريق بسمع أغاني وبشرب قهوة ساقعة.","en":"How do you spend time on your commute?","ar":"بتقضي وقتك إزاي في الطريق للشغل؟","type":"qa","id":"en344"},{"version":"Answer / الإجابة","answer":"I usually finish work at eight in the evening, but sometimes I work overtime.","answerAr":"عادةً بخلص شغلي الساعة تمانية بالليل، لكن أحيانًا بشتغل وقت إضافي.","en":"What time do you get off work?","ar":"بتخلص شغل الساعة كام؟","type":"qa","id":"en345"},{"version":"Answer / الإجابة","answer":"I usually go to bed at two or three in the morning.","answerAr":"عادةً بروح أنام الساعة اتنين أو تلاتة الفجر.","en":"When do you hit the sack?","ar":"بتروح تنام إمتى؟","type":"qa","id":"en346"},{"version":"Answer / الإجابة","answer":"Yes, I use my phone a lot before bed. Even if I don’t use it all day, I spend a lot of time on it before going to sleep.","answerAr":"أيوه، بستخدم موبايلي كتير قبل النوم. حتى لو ما استخدمتوش طول اليوم، بقضي عليه وقت طويل قبل ما أنام.","en":"Do you use your phone until you fall asleep or not?","ar":"بتستخدم موبايلك لحد ما تنام ولا لأ؟","type":"qa","id":"en347"},{"version":"Answer / الإجابة","answer":"Not really a strict one, but I usually wake up at eight, turn off my alarms, and take a shower. I prepare my food and drink, get dressed, pack my bag, and pray. Then I head to my car, put my things inside, start the engine, and put on some music. I drive to work while sipping my drink.","answerAr":"مش روتين ثابت أوي، لكن عادةً بصحى الساعة تمانية، وبقفل المنبّهات وباخد شاور. بحضّر أكلي ومشروبي، وبَلبس وبجهّز شنطتي وبصلّي. بعد كده بخرج لعربيتي، وبحط حاجتي فيها وبدوّرها وبشغّل أغاني. بسوق للشغل وأنا بشرب مشروبي.","en":"Do you have a morning routine?","ar":"عندك روتين صباحي؟","type":"qa","id":"en348"},{"version":"Answer / الإجابة","answer":"I take a shower, get changed, and relax by watching a movie or playing on my PlayStation. Then I go to bed.","answerAr":"باخد شاور وبغيّر هدومي وبسترخي بمشاهدة فيلم أو اللعب على البلايستيشن. بعد كده بروح أنام.","en":"What are your evening wind-down activities after a long day?","ar":"إيه الأنشطة اللي بتعملها بالليل عشان تهدى وتسترخي بعد يوم طويل؟","type":"qa","id":"en349"},{"version":"Answer / الإجابة","answer":"Taking a shower, choosing clothes that suit my plans for the day, making my bed, and tidying up the house before I leave help me start the day off right. Preparing breakfast and coffee and putting on some perfume also put me in a good mood.","answerAr":"الاستحمام واختيار هدوم مناسبة لخططي خلال اليوم، وترتيب سريري وترويق البيت قبل ما أخرج، بيساعدوني أبدأ يومي بشكل كويس. تحضير الفطار والقهوة والتعطّر كمان بيحسّنوا مزاجي.","en":"What helps you start the day off right?","ar":"إيه اللي بيساعدك تبدأ يومك بشكل كويس؟","type":"qa","id":"en350"},{"version":"Answer / الإجابة","answer":"If I like the vibe, I settle in straight away. I don’t need much time to feel comfortable.","answerAr":"لو الجو عجبني، بتأقلم وبندمج على طول. مش بحتاج وقت كتير عشان أحس بالراحة.","en":"How long does it usually take you to get into the swing of things at a new job?","ar":"عادةً بتاخد وقت قد إيه عشان تتعوّد على نظام الشغل وتندمج في وظيفة جديدة؟","type":"qa","id":"en351"}]}]},{"id":"work-4","title":"عنّي: كلمات وتعبيرات","heading":"Words and Expressions — الكلمات والتعبيرات","intro":[],"sections":[{"id":"work-4-0","title":"عنّي - كلمات وتعبيرات","notes":[],"items":[{"en":"For a living","ar":"لكسب الرزق / كمهنة","example":"What do you do for a living?","exampleAr":"بتشتغل إيه؟","type":"phrase","id":"en352"},{"en":"I work as…","ar":"بشتغل كـ…","example":"I work as an instructor.","exampleAr":"بشتغل كمحاضر.","type":"phrase","id":"en353"},{"en":"Instructor","ar":"محاضر / مدرّب","example":"I work as an instructor at several institutes.","exampleAr":"بشتغل كمحاضر في عدة معاهد.","type":"phrase","id":"en354"},{"en":"Practical projects","ar":"مشاريع عملية","example":"I work on practical projects.","exampleAr":"بشتغل على مشاريع عملية.","type":"phrase","id":"en355"},{"en":"A range of…","ar":"مجموعة متنوعة من…","example":"I teach a range of subjects.","exampleAr":"بدرس مجموعة متنوعة من المواد.","type":"phrase","id":"en356"},{"en":"Including","ar":"بما في ذلك / منها","example":"I teach several subjects, including web design.","exampleAr":"بدرس عدة مواد، منها تصميم المواقع.","type":"phrase","id":"en357"},{"en":"Alongside teaching","ar":"بجانب التدريس","example":"Alongside teaching, I manage several projects.","exampleAr":"بجانب التدريس، بدير عدة مشاريع.","type":"phrase","id":"en358"},{"en":"Involving","ar":"متعلقة بـ / تشمل","example":"I manage projects involving e-commerce.","exampleAr":"بدير مشاريع متعلقة بالتجارة الإلكترونية.","type":"phrase","id":"en359"},{"en":"Freelance projects","ar":"مشاريع عمل حر","example":"Some are freelance projects.","exampleAr":"بعضها مشاريع فريلانس.","type":"phrase","id":"en360"},{"en":"Ongoing projects","ar":"مشاريع مستمرة","example":"I manage ongoing projects.","exampleAr":"بدير مشاريع مستمرة.","type":"phrase","id":"en361"},{"en":"Long-term contracts","ar":"عقود طويلة الأجل","example":"I work on projects under long-term contracts.","exampleAr":"بشتغل على مشاريع بعقود طويلة الأجل.","type":"phrase","id":"en362"},{"en":"Run advertising campaigns","ar":"يشغّل / يدير حملات إعلانية","example":"I run advertising campaigns.","exampleAr":"بدير حملات إعلانية.","type":"phrase","id":"en363"},{"en":"Enjoy the most","ar":"يستمتع به أكتر حاجة","example":"What part of your job do you enjoy the most?","exampleAr":"إيه أكتر جزء بتحبه في شغلك؟","type":"phrase","id":"en364"},{"en":"Rewarding","ar":"مُرضي وبيحسّسك إن مجهودك له قيمة","example":"Teaching is rewarding.","exampleAr":"التدريس بيحسّسني إن مجهودي له قيمة.","type":"phrase","id":"en365"},{"en":"Benefit from","ar":"يستفيد من","example":"Students benefit from my lessons.","exampleAr":"الطلاب بيستفيدوا من دروسي.","type":"phrase","id":"en366"},{"en":"Deliver a project","ar":"يسلّم مشروع","example":"I enjoy delivering a project to a client.","exampleAr":"بحب أسلّم مشروع للعميل.","type":"phrase","id":"en367"},{"en":"Achieve good results","ar":"يحقق نتائج كويسة","example":"My projects achieve good results.","exampleAr":"مشاريعي بتحقق نتائج كويسة.","type":"phrase","id":"en368"},{"en":"Meet its goals","ar":"يحقق أهدافه","example":"I enjoy seeing a project meet its goals.","exampleAr":"بحب أشوف المشروع بيحقق أهدافه.","type":"phrase","id":"en369"},{"en":"Positive feedback","ar":"تعليقات / تقييم إيجابي","example":"I receive positive feedback from clients.","exampleAr":"بتلقّى تقييم إيجابي من العملاء.","type":"phrase","id":"en370"},{"en":"A sense of achievement","ar":"إحساس بالإنجاز","example":"Both give me a sense of achievement.","exampleAr":"الاتنين بيدّوني إحساس بالإنجاز.","type":"phrase","id":"en371"},{"en":"The impact of my work","ar":"أثر شغلي","example":"I can see the impact of my work.","exampleAr":"بقدر أشوف أثر شغلي.","type":"phrase","id":"en372"},{"en":"Web design","ar":"تصميم المواقع","example":"I teach web design.","exampleAr":"بدرس تصميم المواقع.","type":"phrase","id":"en373"},{"en":"E-commerce","ar":"التجارة الإلكترونية","example":"I manage e-commerce projects.","exampleAr":"بدير مشاريع تجارة إلكترونية.","type":"phrase","id":"en374"},{"en":"Front-end development","ar":"تطوير واجهات المواقع","example":"I teach front-end development.","exampleAr":"بدرس تطوير واجهات المواقع.","type":"phrase","id":"en375"},{"en":"Back-end development","ar":"تطوير الجزء الخلفي للمواقع","example":"I teach back-end development.","exampleAr":"بدرس تطوير الجزء الخلفي للمواقع.","type":"phrase","id":"en376"},{"en":"UI/UX design","ar":"تصميم واجهات وتجربة المستخدم","example":"I teach UI/UX design.","exampleAr":"بدرس تصميم واجهات وتجربة المستخدم.","type":"phrase","id":"en377"},{"en":"Digital marketing","ar":"التسويق الإلكتروني","example":"I work in digital marketing.","exampleAr":"بشتغل في التسويق الإلكتروني.","type":"phrase","id":"en378"},{"en":"Media buying","ar":"شراء المساحات الإعلانية / إدارة شراء الإعلانات","example":"I teach media buying.","exampleAr":"بدرس شراء الإعلانات.","type":"phrase","id":"en379"},{"en":"Meeting deadlines","ar":"الالتزام بمواعيد التسليم","example":"Meeting deadlines can be stressful.","exampleAr":"الالتزام بمواعيد التسليم ممكن يسبّب ضغط.","type":"phrase","id":"en380"},{"en":"Stressful","ar":"مُسبّب للضغط أو التوتر","example":"My work can be stressful.","exampleAr":"شغلي ممكن يسبّب ضغط أو توتر.","type":"phrase","id":"en381"},{"en":"Work routine","ar":"روتين العمل","example":"I have a busy work routine.","exampleAr":"عندي روتين شغل مليان مهام.","type":"phrase","id":"en382"},{"en":"Pet peeves","ar":"تصرفات معينة بتضايقك أو بتستفزك شخصيًا","example":"Being late is one of my pet peeves.","exampleAr":"التأخّر من التصرفات اللي بتضايقني.","type":"phrase","id":"en383"},{"en":"Not sticking to what we’ve agreed on","ar":"عدم الالتزام باللي اتفقنا عليه","example":"I dislike people not sticking to what we’ve agreed on.","exampleAr":"بيضايقني إن الناس ما تلتزمش باللي اتفقنا عليه.","type":"phrase","id":"en384"},{"en":"Punctuality","ar":"الالتزام بالمواعيد","example":"I value punctuality.","exampleAr":"أنا بقدّر الالتزام بالمواعيد.","type":"phrase","id":"en385"},{"en":"Keeping commitments","ar":"الوفاء بالالتزامات","example":"Keeping commitments is important to me.","exampleAr":"الوفاء بالالتزامات مهم بالنسبة لي.","type":"phrase","id":"en386"},{"en":"Improve my skills","ar":"أطوّر مهاراتي","example":"I take courses to improve my skills.","exampleAr":"باخد كورسات عشان أطوّر مهاراتي.","type":"phrase","id":"en387"},{"en":"Putting what I learn into practice","ar":"تطبيق اللي بتعلّمه عمليًا","example":"I’m putting what I learn into practice.","exampleAr":"أنا بطبّق اللي بتعلّمه عمليًا.","type":"phrase","id":"en388"},{"en":"Experimenting","ar":"التجربة وتجريب طرق أو أفكار","example":"I learn by experimenting.","exampleAr":"بتعلّم من خلال التجربة.","type":"phrase","id":"en389"},{"en":"Hands-on experience","ar":"خبرة عملية من التطبيق المباشر","example":"I’m gaining hands-on experience.","exampleAr":"أنا باكتسب خبرة عملية من التطبيق المباشر.","type":"phrase","id":"en390"},{"en":"Early bird","ar":"شخص بيصحى بدري؛ تعبير شائع ومجازي، مش ترجمة حرفية.","example":"I’m an early bird.","exampleAr":"أنا بحب أصحى بدري.","type":"phrase","id":"en391"},{"en":"Night owl","ar":"شخص بيحب السهر وبيكون نشيط بالليل؛ تعبير شائع.","example":"I’m a night owl.","exampleAr":"أنا بحب السهر وبنشط بالليل.","type":"phrase","id":"en392"},{"en":"Daily routine","ar":"الروتين اليومي: الأنشطة والعادات المعتادة كل يوم.","example":"My daily routine changes depending on my work schedule.","exampleAr":"روتيني اليومي بيتغيّر حسب جدول شغلي.","type":"phrase","id":"en393"},{"en":"Wake up","ar":"يصحى من النوم؛ يختلف عن get up اللي معناها يقوم من السرير.","example":"I wake up early on workdays.","exampleAr":"بصحى بدري في أيام الشغل.","type":"phrase","id":"en394"},{"en":"Workdays","ar":"أيام العمل.","example":"I’m busy on workdays.","exampleAr":"أنا مشغول في أيام الشغل.","type":"phrase","id":"en395"},{"en":"Right after","ar":"مباشرةً بعد / أول ما.","example":"I wash my face right after I wake up.","exampleAr":"بغسل وشي أول ما أصحى.","type":"phrase","id":"en396"},{"en":"Grab my phone","ar":"أمسك موبايلّي بسرعة؛ تعبير طبيعي وغير رسمي.","example":"I grab my phone to check my messages.","exampleAr":"بمسك موبايلّي عشان أراجع رسائلي.","type":"phrase","id":"en397"},{"en":"Get dressed","ar":"يلبس هدومه؛ ما نقولش wear my clothes لو بنقصد عملية اللبس نفسها.","example":"It takes me ten minutes to get dressed.","exampleAr":"باخد عشر دقايق عشان ألبس.","type":"phrase","id":"en398"},{"en":"How long does it take…?","ar":"بيستغرق قد إيه؟ للسؤال عن مدة، بينما what time للسؤال عن الساعة.","example":"How long does it take you to get ready?","exampleAr":"بتاخد قد إيه عشان تجهّز نفسك؟","type":"phrase","id":"en399"},{"en":"Clock in","ar":"يسجّل حضوره أو بداية دوامه بنظام تسجيل؛ لو مفيش نظام حضور، start work أدق.","example":"I clock in at nine.","exampleAr":"بسجّل حضوري الساعة تسعة.","type":"phrase","id":"en400"},{"en":"Commute to work","ar":"التنقّل المعتاد للشغل؛ commute ممكن يكون فعل أو اسم.","example":"I commute to work by bus.","exampleAr":"بروح الشغل بالأتوبيس.","type":"phrase","id":"en401"},{"en":"On my commute","ar":"أثناء رحلتي المعتادة للشغل.","example":"I listen to podcasts on my commute.","exampleAr":"بسمع بودكاست في الطريق للشغل.","type":"phrase","id":"en402"},{"en":"Leave home","ar":"يخرج من البيت.","example":"I leave home at eight.","exampleAr":"بخرج من البيت الساعة تمانية.","type":"phrase","id":"en403"},{"en":"Get off work","ar":"يخلص شغل؛ شائع خصوصًا في الإنجليزية الأمريكية. finish work بديل واضح.","example":"I get off work at six.","exampleAr":"بخلص شغل الساعة ستة.","type":"phrase","id":"en404"},{"en":"Go to bed","ar":"يروح السرير عشان ينام؛ مش شرط ينام فورًا.","example":"I go to bed at eleven.","exampleAr":"بروح أنام الساعة حداشر.","type":"phrase","id":"en405"},{"en":"Hit the sack","ar":"يروح ينام؛ تعبير غير رسمي ومستخدم. go to bed أبسط ومحايد وأكثر أولوية للحفظ.","example":"I’m tired. I’m going to hit the sack.","exampleAr":"أنا تعبان، هروح أنام.","type":"phrase","id":"en406"},{"en":"Fall asleep","ar":"يدخل في النوم / يغلبه النوم، عكس go to bed اللي تعني يروح السرير.","example":"I sometimes fall asleep while reading.","exampleAr":"أحيانًا النوم بيغلبني وأنا بقرأ.","type":"phrase","id":"en407"},{"en":"Morning routine","ar":"روتين الصباح.","example":"My morning routine starts with breakfast.","exampleAr":"روتيني الصباحي بيبدأ بالفطار.","type":"phrase","id":"en408"},{"en":"Wind down","ar":"يهدى ويسترخي تدريجيًا بعد الانشغال؛ طبيعي في المحادثة.","example":"I read to wind down in the evening.","exampleAr":"بقرأ عشان أسترخي بالليل.","type":"phrase","id":"en409"},{"en":"Start the day off right","ar":"يبدأ يومه بشكل كويس؛ تعبير طبيعي.","example":"A good breakfast helps me start the day off right.","exampleAr":"فطار كويس بيساعدني أبدأ يومي بشكل كويس.","type":"phrase","id":"en410"},{"en":"Get into the swing of things","ar":"يتعوّد على نظام جديد ويندمج فيه؛ تعبير مستخدم، وget used to a new job بديل أبسط.","example":"It takes me a few days to get into the swing of things.","exampleAr":"باخد كام يوم عشان أتعود على النظام وأندمج.","type":"phrase","id":"en411"},{"en":"A bit of both","ar":"شوية من الاتنين","example":"I’m a bit of both.","exampleAr":"أنا شوية من الاتنين.","type":"phrase","id":"en412"},{"en":"I find it hard to…","ar":"بلاقي صعوبة إني…؛ بعدها فعل في المصدر.","example":"I find it hard to fall asleep early.","exampleAr":"بلاقي صعوبة إني أنام بدري.","type":"phrase","id":"en413"},{"en":"Stay up late","ar":"يسهر","example":"I sometimes stay up late.","exampleAr":"أحيانًا بسهر.","type":"phrase","id":"en414"},{"en":"Whether… or…","ar":"سواء… أو…","example":"I wake up early whether I sleep a lot or only a few hours.","exampleAr":"بصحى بدري سواء نمت كتير أو ساعات قليلة.","type":"phrase","id":"en415"},{"en":"Turn off my alarms","ar":"أقفل المنبّهات؛ turn off لإيقافها، snooze لتأجيل الرنّة مؤقتًا.","example":"The first thing I do is turn off my alarms.","exampleAr":"أول حاجة بعملها إني أقفل المنبّهات.","type":"phrase","id":"en416"},{"en":"Check the time","ar":"يبص على الساعة / يعرف الساعة كام","example":"The first thing I check is the time.","exampleAr":"أول حاجة ببص عليها هي الساعة.","type":"phrase","id":"en417"},{"en":"Take a shower","ar":"ياخد شاور","example":"I take a shower before work.","exampleAr":"باخد شاور قبل الشغل.","type":"phrase","id":"en418"},{"en":"Within half an hour","ar":"خلال نص ساعة؛ within تعني قبل انتهاء المدة أو عند نهايتها.","example":"I’m usually ready within half an hour.","exampleAr":"عادةً بكون جاهز خلال نص ساعة.","type":"phrase","id":"en419"},{"en":"Get ready / Get dressed","ar":"Get ready: يجهّز نفسه عمومًا. Get dressed: يلبس هدومه تحديدًا.","example":"It takes me half an hour to get ready.","exampleAr":"باخد نص ساعة عشان أجهّز نفسي.","type":"phrase","id":"en420"},{"en":"Start work","ar":"يبدأ الشغل؛ مناسب حتى لو مفيش نظام حضور.","example":"I usually start work at ten.","exampleAr":"عادةً ببدأ شغلي الساعة عشرة.","type":"phrase","id":"en421"},{"en":"Fingerprint scanner","ar":"جهاز بصمة","example":"I use a fingerprint scanner to open the doors.","exampleAr":"بستخدم جهاز بصمة لفتح الأبواب.","type":"phrase","id":"en422"},{"en":"Half past eight","ar":"الساعة تمانية ونص؛ ممكن "id":"en435"},{"en":"Settle in straight away","ar":"يتأقلم ويندمج على طول","example":"If I like the vibe, I settle in straight away.","exampleAr":"لو الجو عجبني، بتأقلم على طول.","type":"phrase","id":"en436"},{"en":"Make my bed","ar":"يرتّب سريره؛ التعبير الصحيح لترتيب السرير.","example":"I make my bed in the morning.","exampleAr":"برتّب سريري الصبح.","type":"phrase","id":"en437"},{"en":"Tidy up the house","ar":"يرتّب ويروّق البيت","example":"I tidy up the house before I leave.","exampleAr":"بروّق البيت قبل ما أخرج.","type":"phrase","id":"en438"},{"en":"Put on some perfume","ar":"يتعطّر / يحط برفان","example":"I put on some perfume before I go out.","exampleAr":"بتعطّر قبل ما أخرج.","type":"phrase","id":"en439"},{"en":"Put me in a good mood","ar":"يخلّيني في مزاج كويس","example":"Breakfast and coffee put me in a good mood.","exampleAr":"الفطار والقهوة بيخلّوني في مزاج كويس.","type":"phrase","id":"en440"},{"en":"Clothes that suit my plans","ar":"هدوم مناسبة لخططي أو أنشطتي","example":"I choose clothes that suit my plans for the day.","exampleAr":"بختار هدوم مناسبة لخططي خلال اليوم.","type":"phrase","id":"en441"}]}]},{"id":"work-5","title":"طلباتي بالإنجليزي","heading":"طلباتي بالإنجليزي","intro":["طلباتك المتكررة من قائمتنا في الشات، متقسمة حسب الاستخدام. الجمل هنا مادة للتعلم؛ الأسئلة والاختبارات الفعلية تفضل في الشات."],"sections":[{"id":"work-5-0","title":"استكمال الشغل","notes":[],"items":[{"en":"Let’s pick up where we left off.","ar":"يلا نكمل من مكان ما وقفنا.","note":"pick up here = يستأنف، مش يلتقط حرفيًا.","type":"phrase","id":"en442"},{"en":"Let’s get back to what we were working on.","ar":"يلا نرجع للي كنا بنعمله.","note":"get back to = يرجع لنشاط. Let’s get back to it أقصر لو السياق واضح.","type":"phrase","id":"en443"},{"en":"Let’s work on this page.","ar":"يلا نشتغل على الصفحة دي.","note":"Let’s للعمل سوا. I’d like you to work on this page = عايزك إنت تشتغل عليها.","type":"phrase","id":"en444"},{"en":"Send me the next part.","ar":"ابعت لي الجزء اللي بعده.","note":"next part = الجزء التالي.","type":"phrase","id":"en445"},{"en":"Do the same with these.","ar":"اعمل نفس الكلام مع دول.","note":"these لأكتر من عنصر؛ this لواحد.","type":"phrase","id":"en446"},{"en":"Let’s go through it one section at a time.","ar":"خلّينا نمشي جزء جزء.","note":"go through = يراجع أو يتناول بالتفصيل.","type":"phrase","id":"en447"}]},{"id":"work-5-1","title":"الشرح","notes":[],"items":[{"en":"Explain this section in simple terms.","ar":"اشرح لي الجزء ده ببساطة.","note":"in simple terms = بكلام سهل.","type":"phrase","id":"en448"},{"en":"What does this sentence mean?","ar":"الجملة دي معناها إيه؟","note":"does + الفعل الأساسي mean.","type":"phrase","id":"en449"},{"en":"When do we use this expression?","ar":"بنستخدم التعبير ده إمتى؟","note":"expression = تعبير.","type":"phrase","id":"en450"},{"en":"What’s the difference between these two expressions?","ar":"إيه الفرق بين التعبيرين دول؟","note":"between للمقارنة بين الاتنين.","type":"phrase","id":"en451"},{"en":"Give me some everyday examples.","ar":"اديني أمثلة من الحياة اليومية.","note":"everyday صفة بمعنى يومي.","type":"phrase","id":"en452"},{"en":"Does this sentence sound natural?","ar":"الجملة دي طبيعية في الكلام؟","note":"sound natural = تبدو مألوفة وطبيعية.","type":"phrase","id":"en453"},{"en":"Which expression works best in this situation?","ar":"أنهي تعبير أنسب في الموقف ده؟","note":"works best = يناسب أكتر.","type":"phrase","id":"en454"}]},{"id":"work-5-2","title":"التدريب","notes":[],"items":[{"en":"Let’s practice this section.","ar":"يلا نتدرّب على الجزء ده.","note":"practice فعل هنا.","type":"phrase","id":"en455"},{"en":"Send me the questions with answers so I can practice.","ar":"ابعت لي الأسئلة بالإجابات عشان أتدرّب.","note":"so I can = عشان أقدر.","type":"phrase","id":"en456"},{"en":"Quiz me without showing me the answers.","ar":"اختبرني من غير ما توريني الإجابات.","note":"without + ing.","type":"phrase","id":"en457"},{"en":"Send me all the questions at once.","ar":"ابعت لي كل الأسئلة مرة واحدة.","note":"at once هنا = مع بعض.","type":"phrase","id":"en458"},{"en":"Correct my answers and explain my mistakes.","ar":"صحّح إجاباتي واشرح أخطائي.","note":"correct فعل بمعنى يصحح.","type":"phrase","id":"en459"},{"en":"Keep the questions for each section separate.","ar":"خلّي أسئلة كل جزء لوحدها.","note":"keep + المفعول + صفة.","type":"phrase","id":"en460"}]},{"id":"work-5-3","title":"الإكسل","notes":[],"items":[{"en":"Add this to the Excel workbook.","ar":"ضيف ده لملف الإكسل.","note":"workbook = الملف كله؛ sheet = صفحة داخله.","type":"phrase","id":"en461"},{"en":"Create a separate sheet for each chapter.","ar":"اعمل صفحة مستقلة لكل فصل.","note":"separate = منفصل.","type":"phrase","id":"en462"},{"en":"Put it in the appropriate section.","ar":"حطه في القسم المناسب.","note":"appropriate = مناسب.","type":"phrase","id":"en463"},{"en":"Remove any duplicates.","ar":"احذف أي تكرار.","note":"duplicates = عناصر مكررة.","type":"phrase","id":"en464"},{"en":"Make sure to include the explanations and examples.","ar":"متنساش الشرح والأمثلة.","note":"make sure to + فعل.","type":"phrase","id":"en465"},{"en":"Move the lower-priority phrases to a separate sheet.","ar":"انقل الجمل الأقل أولوية لصفحة مستقلة.","note":"lower-priority لا تعني غلط أو غير مستخدم تمامًا.","type":"phrase","id":"en466"},{"en":"Keep the layout simple and easy to study.","ar":"خلّي التنسيق بسيط وسهل للمذاكرة.","note":"layout = ترتيب وعرض المحتوى.","type":"phrase","id":"en467"},{"en":"Send me the latest version of the file.","ar":"ابعت لي أحدث نسخة من الملف.","note":"latest = الأحدث.","type":"phrase","id":"en468"}]},{"id":"work-5-4","title":"التصميم","notes":[],"items":[{"en":"Turn this list into a professional presentation slide.","ar":"حوّل القائمة دي لشريحة احترافية.","note":"turn A into B = يحوّل أ إلى ب.","type":"phrase","id":"en469"},{"en":"Use a modern English-learning theme.","ar":"استخدم طابع عصري لتعلّم الإنجليزي.","note":"theme = طابع أو هوية بصرية.","type":"phrase","id":"en470"},{"en":
